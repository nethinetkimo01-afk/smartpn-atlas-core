<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>DS-04 明細表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei',Arial,sans-serif;font-size:13px;background:#f5f7fa;color:#333}
.topbar{background:#1e3a5f;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:15px;font-weight:600;margin-right:auto}
.topbar a{color:#adc8f0;text-decoration:none;font-size:12px}
.filters{background:#fff;border-bottom:1px solid #dde;padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filters label{font-size:12px;color:#666;display:flex;gap:4px;align-items:center}
.filters select{padding:4px 8px;border:1px solid #ccd;border-radius:4px;font-size:12px}
.stat-bar{background:#eef3fb;padding:5px 16px;font-size:12px;color:#555;border-bottom:1px solid #dde;display:flex;align-items:center;gap:16px}
.stat-bar span{font-weight:700;color:#1e3a5f}
.lock-badge{background:#c62828;color:#fff;padding:2px 9px;border-radius:3px;font-size:11px;font-weight:700}
.lock-badge.unlocked{background:#2e7d32}
.content{padding:12px 16px;overflow-x:auto}

/* Layer 1: 部門 */
.dept-section{margin-bottom:16px;border-radius:5px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dept-header{background:#1e3a5f;color:#fff;padding:8px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.dept-header:hover{background:#254b7a}
.dept-header .toggle-arrow{font-size:11px;width:14px;flex-shrink:0}
.dept-header .dept-stats{margin-left:auto;font-size:11px;font-weight:400;opacity:.8}
.dept-section.collapsed .dept-header{border-radius:5px}
.dept-body{border:1px solid #d0d8e8;border-top:none}
.dept-section.collapsed .dept-body{display:none}

/* Layer 2: LEAN */
.lean-group{border-top:1px solid #d0d8e8}
.lean-group:first-child{border-top:none}
.lean-header{background:#2d5a9e;color:#fff;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;cursor:pointer;user-select:none}
.lean-header:hover{background:#3569b8}
.lean-toggle{font-size:10px;width:12px;flex-shrink:0}
.lean-header .lc{background:#1e3a5f;padding:1px 7px;border-radius:3px;font-size:12px;font-family:monospace}
.lean-header .lt{margin-left:auto;font-size:11px;font-weight:400;opacity:.8}

/* Layer 3: 訂單明細 */
.lean-body{display:none}
.lean-group.expanded .lean-body{display:block}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:#e8eef8}
th{padding:5px 8px;text-align:left;font-weight:600;color:#1e3a5f;border-bottom:1px solid #c5d0e0;white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid #edf0f5;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f5f8ff}

.badge-y{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600}
.btn{padding:4px 10px;border:none;border-radius:3px;cursor:pointer;font-size:11px;font-weight:600}
.btn-edit{background:#e3f2fd;color:#1565c0}
.btn-edit:hover{background:#bbdefb}
.btn-del{background:#fce4ec;color:#c62828}
.btn-del:hover{background:#f8bbd0}
.btn-add{background:#2d5a9e;color:#fff;padding:5px 12px;font-size:12px}
.btn-dl{background:#2e7d32;color:#fff;padding:5px 12px;font-size:12px}
.btn-confirm{background:#ff6f00;color:#fff;padding:5px 14px;font-size:12px;font-weight:700}
.btn-confirm:hover{background:#e65100}
.btn-confirm.locked{background:#c62828}
.btn-confirm.locked:hover{background:#b71c1c}
.no-data,.loading{text-align:center;padding:40px;color:#999}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;padding:20px;width:420px;max-width:95vw}
.modal h3{font-size:14px;font-weight:700;color:#1e3a5f;margin-bottom:14px}
.form-row{margin-bottom:10px;display:flex;gap:8px;align-items:center}
.form-row label{width:80px;font-size:12px;color:#555;flex-shrink:0}
.form-row input,.form-row select{flex:1;padding:5px 8px;border:1px solid #ccd;border-radius:4px;font-size:12px}
.form-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn-cancel{background:#eee;color:#555}
.btn-save{background:#2d5a9e;color:#fff}
.toast{position:fixed;bottom:20px;right:20px;background:#1e3a5f;color:#fff;padding:9px 16px;border-radius:5px;font-size:12px;display:none;z-index:999}
button:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div class="topbar">
  <h1>DS-04 明細表</h1>
  <label style="color:#adc8f0;font-size:12px">月份
    <select id="selMonth" onchange="onMonthChange()" style="margin-left:4px;padding:3px 7px;font-size:12px;border-radius:3px;border:none">
      <option value="2026-06">2026-06</option>
      <option value="2026-07">2026-07</option>
      <option value="2026-05">2026-05</option>
    </select>
  </label>
  <a href="/eolr-settings">EOLR設定 →</a>
  <a href="/allocation">勾選表 →</a>
  <a href="/bianche">廠務編制表 →</a>
  <button id="btnAdd" class="btn btn-add" onclick="openAdd()">＋ 新增指令</button>
  <button class="btn btn-dl" onclick="downloadXlsx()">⬇ 下載 xlsx</button>
  <button id="btnConfirm" class="btn btn-confirm" onclick="toggleLock()">確認本月資料</button>
</div>

<div class="filters">
  <label>部門<select id="selDept" onchange="loadData()"><option value="">全部</option></select></label>
  <label>LEAN<select id="selLean" onchange="loadData()"><option value="">全部</option></select></label>
  <label>外包鞋面
    <select id="selOutsource" onchange="loadData()">
      <option value="">全部</option>
      <option value="Y">外包鞋面(Y)</option>
      <option value="N">非外包</option>
    </select>
  </label>
</div>
<div class="stat-bar" id="statBar">
  <span id="statText">載入中...</span>
  <span id="lockStatus"></span>
</div>
<div class="content" id="content"><div class="loading">載入中...</div></div>

<!-- Edit/Add Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">新增指令</h3>
    <input type="hidden" id="editId">
    <div class="form-row"><label>部門</label><input id="fDept" placeholder="1部"></div>
    <div class="form-row"><label>LEAN</label><input id="fLean" placeholder="1A"></div>
    <div class="form-row"><label>鞋型名稱</label><input id="fModel" placeholder="CODECHAOS 27"></div>
    <div class="form-row"><label>ART</label><input id="fArt" placeholder="KI5735"></div>
    <div class="form-row"><label>訂單號</label><input id="fOrderNo" placeholder="MF2606KI5735-10"></div>
    <div class="form-row"><label>數量</label><input id="fQty" type="number" placeholder="0"></div>
    <div class="form-row"><label>交期</label><input id="fDate" placeholder="6/5"></div>
    <div class="form-row"><label>外包鞋面</label>
      <select id="fOut"><option value="0">否</option><option value="1">是(Y)</option></select>
    </div>
    <div class="form-btns">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-save" onclick="saveRow()">儲存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DEPT_ORDER = ['1部','2部','3部','5部','6部','7部','8部','9部','10部','11部','11部 (2)','12部'];
const LEAN_ORDER = [
  '1A','1B','1C','2A','2B','2C','3A','3B','3C','4A','4B','4C',
  '5A','5B','5C','6A','6B','6C','7A','7B','7C','8A','8B','8C',
  '9A','9B','9C','10A','10B','10C','11A1','11A2','11B1','11B2','11C'
];
function deptKey(d) { const i = DEPT_ORDER.indexOf(d); return i >= 0 ? i : 999; }
function leanKey(l) { const i = LEAN_ORDER.indexOf(l); return i >= 0 ? i : 999; }

let _rows = [];
let _locked = false;
let _lockedAt = '';

async function init() {
  const f = await fetch('/api/ds04/filters').then(r=>r.json());
  const sd=document.getElementById('selDept'), sl=document.getElementById('selLean');
  (f.depts||[]).forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sd.appendChild(o);});
  (f.leans||[]).forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;sl.appendChild(o);});
  await loadLockStatus();
  loadData();
}

function currentMonth() { return document.getElementById('selMonth').value; }

async function loadLockStatus() {
  const res = await fetch(`/api/ds04/lock?month=${currentMonth()}`).then(r=>r.json());
  _locked = res.locked || false;
  _lockedAt = res.locked_at || '';
  updateLockUI();
}

function updateLockUI() {
  const btn = document.getElementById('btnConfirm');
  const addBtn = document.getElementById('btnAdd');
  const ls = document.getElementById('lockStatus');
  if (_locked) {
    btn.textContent = '🔒 已鎖定（點此解鎖）';
    btn.classList.add('locked');
    addBtn.disabled = true;
    ls.innerHTML = `<span class="lock-badge">已鎖定 ${_lockedAt ? _lockedAt.slice(0,10) : ''}</span>`;
  } else {
    btn.textContent = '確認本月資料';
    btn.classList.remove('locked');
    addBtn.disabled = false;
    ls.innerHTML = '<span class="lock-badge unlocked">未鎖定</span>';
  }
  if (_rows.length) render(_rows);
}

async function toggleLock() {
  const month = currentMonth();
  if (_locked) {
    if (!confirm(`解鎖 ${month}？解鎖後可再修改資料。`)) return;
    const r = await fetch('/api/ds04/lock', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'unlock', month})
    }).then(r=>r.json());
    if (r.ok) { _locked = false; _lockedAt = ''; showToast('已解鎖'); updateLockUI(); }
    else alert('解鎖失敗: ' + (r.error||''));
  } else {
    if (!confirm(`確認鎖定 ${month} 的資料？鎖定後不可新增/修改/刪除，廠務編制表將以此為計算來源。`)) return;
    const r = await fetch('/api/ds04/lock', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'lock', month, locked_by: 'user'})
    }).then(r=>r.json());
    if (r.ok) { _locked = true; _lockedAt = r.locked_at||''; showToast(`${month} 已確認鎖定`); updateLockUI(); }
    else alert('鎖定失敗: ' + (r.error||''));
  }
}

async function onMonthChange() {
  await loadLockStatus();
  loadData();
}

async function loadData() {
  const dept=document.getElementById('selDept').value;
  const lean=document.getElementById('selLean').value;
  const out=document.getElementById('selOutsource').value;
  let url='/api/ds04/orders?';
  if(dept) url+=`dept=${encodeURIComponent(dept)}&`;
  if(lean) url+=`lean=${encodeURIComponent(lean)}&`;
  if(out)  url+=`outsource=${out}&`;
  document.getElementById('content').innerHTML='<div class="loading">載入中...</div>';
  const res=await fetch(url).then(r=>r.json());
  _rows=res.rows||[];
  render(_rows);
}

function render(rows) {
  const totalQty = rows.reduce((s,r)=>s+(r.qty||0), 0);
  const wb = rows.filter(r=>r.is_outsource_upper).length;
  document.getElementById('statText').innerHTML=
    `共 <span>${rows.length}</span> 筆　總數量 <span>${totalQty.toLocaleString()}</span> 雙　外包鞋面 <span>${wb}</span> 筆`;

  if(!rows.length){document.getElementById('content').innerHTML='<div class="no-data">無資料</div>';return;}

  // Group: dept → lean → rows
  const byDept = {};
  rows.forEach(r => {
    const dk = r.dept||'—';
    if(!byDept[dk]) byDept[dk] = {};
    const lk = r.lean||'—';
    if(!byDept[dk][lk]) byDept[dk][lk] = [];
    byDept[dk][lk].push(r);
  });

  const sortedDepts = Object.keys(byDept).sort((a,b) => deptKey(a)-deptKey(b));
  let html = '';
  let di = 0;

  for(const dept of sortedDepts) {
    const deptRows = Object.values(byDept[dept]).flat();
    const deptQty = deptRows.reduce((s,r)=>s+(r.qty||0),0);
    const dId = `d${di++}`;

    // Layer 1: 部門（預設展開）
    html += `<div class="dept-section" id="${dId}">
      <div class="dept-header" onclick="toggleDept('${dId}')">
        <span class="toggle-arrow">▼</span>
        ${esc(dept)}
        <span class="dept-stats">共 ${deptRows.length} 筆，總數量 ${deptQty.toLocaleString()} 雙</span>
      </div>
      <div class="dept-body">`;

    const sortedLeans = Object.keys(byDept[dept]).sort((a,b) => leanKey(a)-leanKey(b));
    let li = 0;
    for(const lean of sortedLeans) {
      const lr = byDept[dept][lean];
      const leanQty = lr.reduce((s,r)=>s+(r.qty||0),0);
      const wb2 = lr.filter(r=>r.is_outsource_upper).length;
      const lId = `${dId}_l${li++}`;

      // Layer 2: LEAN（預設收合）
      html += `<div class="lean-group" id="${lId}">
        <div class="lean-header" onclick="toggleLean('${lId}')">
          <span class="lean-toggle">▶</span>
          <span class="lc">${esc(lean)}</span>
          <span class="lt">${lr.length} 筆，${leanQty.toLocaleString()} 雙${wb2?` 外包 ${wb2}`:''}</span>
        </div>
        <div class="lean-body">
          <table><thead><tr>
            <th>鞋型名稱</th><th>ART</th><th>訂單號</th><th>數量</th><th>交期</th><th>預計完成日</th><th>外包鞋面</th><th>操作</th>
          </tr></thead><tbody>`;

      // Layer 3: 訂單明細
      lr.forEach(r => {
        const dis = _locked ? 'disabled' : '';
        html += `<tr>
          <td>${esc(r.model_name)}</td>
          <td>${esc(r.art)}</td>
          <td style="font-family:monospace;font-size:11px">${esc(r.order_no)}</td>
          <td><b>${(r.qty||0).toLocaleString()}</b></td>
          <td style="color:#666">${esc(r.delivery_date)}</td>
          <td style="color:#999">${esc(r.estimated_completion)||'—'}</td>
          <td>${r.is_outsource_upper?'<span class="badge-y">Y</span>':''}</td>
          <td>
            <button class="btn btn-edit" onclick='openEdit(${JSON.stringify(r)})' ${dis}>編輯</button>
            <button class="btn btn-del" onclick="delRow(${r.id})" ${dis}>刪除</button>
          </td>
        </tr>`;
      });

      html += '</tbody></table></div></div>';
    }
    html += '</div></div>';
  }
  document.getElementById('content').innerHTML = html;
}

function toggleDept(id) {
  const el = document.getElementById(id);
  el.classList.toggle('collapsed');
  el.querySelector('.toggle-arrow').textContent = el.classList.contains('collapsed') ? '▶' : '▼';
}

function toggleLean(id) {
  const el = document.getElementById(id);
  el.classList.toggle('expanded');
  el.querySelector('.lean-toggle').textContent = el.classList.contains('expanded') ? '▼' : '▶';
}

function openAdd() {
  if(_locked){alert('本月已鎖定，無法新增');return;}
  document.getElementById('modalTitle').textContent='新增指令';
  document.getElementById('editId').value='';
  ['fDept','fLean','fModel','fArt','fOrderNo','fDate'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fQty').value='0';
  document.getElementById('fOut').value='0';
  document.getElementById('overlay').classList.add('show');
}
function openEdit(r) {
  document.getElementById('modalTitle').textContent='編輯指令';
  document.getElementById('editId').value=r.id;
  document.getElementById('fDept').value=r.dept||'';
  document.getElementById('fLean').value=r.lean||'';
  document.getElementById('fModel').value=r.model_name||'';
  document.getElementById('fArt').value=r.art||'';
  document.getElementById('fOrderNo').value=r.order_no||'';
  document.getElementById('fQty').value=r.qty||0;
  document.getElementById('fDate').value=r.delivery_date||'';
  document.getElementById('fOut').value=r.is_outsource_upper?'1':'0';
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

async function saveRow() {
  const id=document.getElementById('editId').value;
  const body={
    month: currentMonth(),
    dept:document.getElementById('fDept').value,
    lean:document.getElementById('fLean').value,
    model_name:document.getElementById('fModel').value,
    art:document.getElementById('fArt').value,
    order_no:document.getElementById('fOrderNo').value,
    qty:parseInt(document.getElementById('fQty').value)||0,
    delivery_date:document.getElementById('fDate').value,
    is_outsource_upper:document.getElementById('fOut').value==='1',
  };
  const url=id ? `/api/ds04/order/${id}` : '/api/ds04/order';
  const method=id ? 'PUT' : 'POST';
  const res=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
  if(res.ok){ closeModal(); showToast(id?'已更新':'已新增'); loadData(); }
  else { alert('錯誤: '+(res.error||'未知')); }
}

async function delRow(id) {
  if(_locked){alert('本月已鎖定，無法刪除');return;}
  if(!confirm('確定刪除此筆？')) return;
  const r=await fetch(`/api/ds04/order/${id}?month=${currentMonth()}`,{method:'DELETE'}).then(r=>r.json());
  if(r.ok){ showToast('已刪除'); loadData(); }
  else { alert('刪除失敗: '+(r.error||'')); }
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function downloadXlsx(){
  const d=document.getElementById('selDept').value,l=document.getElementById('selLean').value,o=document.getElementById('selOutsource').value;
  let url='/api/ds04/export?';
  if(d) url+=`dept=${encodeURIComponent(d)}&`;
  if(l) url+=`lean=${encodeURIComponent(l)}&`;
  if(o) url+=`outsource=${o}&`;
  window.location=url;
}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
init();
</script>
</body>
</html>
