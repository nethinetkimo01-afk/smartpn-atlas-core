<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IE 標準化界面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:13px;background:#f0f2f5;color:#1a1a2e;min-height:100vh}

:root{--ph-h:40px;--tb-h:44px}

.page-header{background:#1a2744;color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.page-header h1{font-size:15px;font-weight:600}
.header-right{display:flex;gap:8px;align-items:center}
.version{font-size:11px;color:#7a9bcc;background:#243356;padding:3px 8px;border-radius:4px}

.toolbar{background:#fff;border-bottom:1px solid #e4e9f2;padding:8px 20px;display:flex;gap:12px;align-items:center;position:sticky;top:var(--ph-h);z-index:90;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.search-inp{border:1px solid #d0d5e0;border-radius:5px;padding:5px 10px;font-size:12px;width:260px;outline:none}
.search-inp:focus{border-color:#4a6cf7;box-shadow:0 0 0 2px rgba(74,108,247,.12)}
.stats{font-size:11px;color:#888;margin-left:8px}

.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;transition:background .15s;outline:none}
.btn-refresh{background:#4a6cf7;color:#fff}.btn-refresh:hover{background:#3a5ce7}
.btn-link{background:#5c6bc0;color:#fff;text-decoration:none;padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500}.btn-link:hover{background:#3949ab}

.lang-group{display:flex;gap:2px;background:#243356;border-radius:5px;padding:2px}
.btn-lang{background:transparent;color:#8aaedd;border:none;border-radius:3px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;transition:background .12s}
.btn-lang:hover{background:#3a5080;color:#fff}
.btn-lang.active{background:#4a6cf7;color:#fff}

/* Table */
.table-wrap{overflow-x:auto;margin:14px 20px;border-radius:8px;box-shadow:0 1px 8px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
thead th{background:#1a2744;color:#fff;padding:8px 6px;text-align:left;font-weight:600;white-space:nowrap;font-size:11px;border-right:1px solid #243356;position:sticky;top:calc(var(--ph-h) + var(--tb-h));z-index:5}
thead th:last-child{border-right:none}

.tr-first{border-top:2px solid #cdd8f0}
.tr-first td,.tr-sub td{padding:6px 6px;border-bottom:1px solid #edf0f7;vertical-align:middle}
.tr-sub td{border-top:1px dashed #e4e9f2;background:#f9fbff}
.tr-first:hover td,.tr-sub:hover td{background:#eef2ff}

/* Model */
.model-cell{max-width:220px;word-break:break-word;font-size:11px;color:#333;line-height:1.4;border-right:1px solid #e4e9f2}
.model-link{text-decoration:none;color:inherit;display:block}.model-link:hover .model-short{color:#4a6cf7;text-decoration:underline}
.model-short{font-weight:700;color:#1a2744;font-size:12px}
.model-detail{color:#888;font-size:10px;margin-top:2px}

/* ARTs */
.arts-cell{min-width:160px;border-right:1px solid #e4e9f2;padding:6px}
.art-chip{display:inline-block;background:#e8f0fe;color:#1a2744;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;margin:1px 2px 1px 0}

/* EOLR */
.eolr-cell{text-align:center;width:52px;white-space:nowrap}
.eolr-badge{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px}
.eolr-60{background:#fff3e0;color:#e65100}
.eolr-120{background:#e8f5e9;color:#2e7d32}
.eolr-other{background:#f3e5f5;color:#7b1fa2}

/* MP read-only */
.mp-cell{min-width:72px;text-align:center}
.mp-val{font-size:12px;font-weight:600;color:#1a2744}
.mp-dash{font-size:13px;color:#e05252;font-weight:700}

/* States */
.loading{text-align:center;padding:40px;color:#888}
.empty{text-align:center;padding:30px;color:#aaa;font-size:12px}
</style>
</head>
<body>

<div class="page-header" id="page-header">
  <h1 id="page-title">IE 標準化界面 · MP 一覽</h1>
  <div class="header-right">
    <div class="lang-group">
      <button class="btn-lang active" data-lang="zh" onclick="setLang('zh')">中</button>
      <button class="btn-lang"        data-lang="en" onclick="setLang('en')">EN</button>
      <button class="btn-lang"        data-lang="vi" onclick="setLang('vi')">VI</button>
    </div>
    <a href="/" class="btn-link" id="btn-back">← DS-03</a>
    <span class="version">v1.3</span>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <input id="search" class="search-inp" type="text" placeholder="搜尋鞋型 / ART..." oninput="filterTable()">
  <button id="btn-reload" class="btn btn-refresh" onclick="loadData()">重新載入</button>
  <span id="stats" class="stats">—</span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th id="th-model" style="min-width:200px">鞋型</th>
        <th id="th-arts"  style="min-width:150px">ART 列表</th>
        <th id="th-eolr"  style="width:52px;text-align:center">EOLR</th>
        <th id="th-cut"   style="width:76px;text-align:center">裁斷MP</th>
        <th id="th-stitch"style="width:76px;text-align:center">針車MP</th>
        <th id="th-asm"   style="width:76px;text-align:center">成型MP</th>
        <th id="th-sf"    style="width:76px;text-align:center">庫存</th>
      </tr>
    </thead>
    <tbody id="ie-tbody">
      <tr><td colspan="7" class="loading">載入中...</td></tr>
    </tbody>
  </table>
</div>

<script>
// ── i18n ──────────────────────────────────────────────
const LANGS = {
  zh:{title:'IE 標準化界面 · MP 一覽',col_model:'鞋型',col_arts:'ART 列表',col_eolr:'EOLR',col_cut:'裁斷MP',col_stitch:'針車MP',col_asm:'成型MP',col_sf:'庫存',search_ph:'搜尋鞋型 / ART...',btn_reload:'重新載入',stats:(n,m)=>`共 ${n} 筆記錄 · ${m} 筆缺 MP`,loading:'載入中...',offline:'伺服器離線',empty:'無記錄',back:'← DS-03'},
  en:{title:'IE Interface · MP Overview',col_model:'Model Name',col_arts:'ART List',col_eolr:'EOLR',col_cut:'Cutting MP',col_stitch:'Stitching MP',col_asm:'Assembly MP',col_sf:'Stockfitting',search_ph:'Search model / ART...',btn_reload:'Reload',stats:(n,m)=>`${n} records · ${m} missing MP`,loading:'Loading...',offline:'Server offline',empty:'No records',back:'← DS-03'},
  vi:{title:'Giao diện IE · Tổng quan MP',col_model:'Tên giày',col_arts:'Danh sách ART',col_eolr:'EOLR',col_cut:'MP Cắt',col_stitch:'MP May',col_asm:'MP Lắp ráp',col_sf:'Stockfitting',search_ph:'Tìm kiểu giày / ART...',btn_reload:'Tải lại',stats:(n,m)=>`${n} bản ghi · ${m} thiếu MP`,loading:'Đang tải...',offline:'Máy chủ offline',empty:'Không có dữ liệu',back:'← DS-03'},
};
let currentLang = localStorage.getItem('ie_lang') || 'zh';
let allRecords = [];
function L(k){ return LANGS[currentLang][k]; }

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('ie_lang', lang);
  const d = LANGS[lang];
  document.getElementById('page-title').textContent  = d.title; document.title = d.title;
  document.getElementById('th-model').textContent   = d.col_model;
  document.getElementById('th-arts').textContent    = d.col_arts;
  document.getElementById('th-eolr').textContent    = d.col_eolr;
  document.getElementById('th-cut').textContent     = d.col_cut;
  document.getElementById('th-stitch').textContent  = d.col_stitch;
  document.getElementById('th-asm').textContent     = d.col_asm;
  document.getElementById('th-sf').textContent      = d.col_sf;
  document.getElementById('search').placeholder     = d.search_ph;
  document.getElementById('btn-reload').textContent = d.btn_reload;
  document.getElementById('btn-back').textContent   = d.back;
  document.querySelectorAll('.btn-lang').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  updateStats();
}

function fixStickyOffsets(){
  const ph = document.getElementById('page-header').getBoundingClientRect().height;
  const tb = document.getElementById('toolbar').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--ph-h', Math.round(ph)+'px');
  document.documentElement.style.setProperty('--tb-h', Math.round(tb)+'px');
}

// ── Helpers ───────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmtModel(name){
  if(!name) return '<span class="model-short" style="color:#aaa">—</span>';
  const short = name.replace(/\s+Target Output.*$/i,'').replace(/\s{2,}/g,' ').trim();
  return `<span class="model-short">${esc(short)}</span>`;
}

function eolrBadge(eolr){
  const cls = eolr===60?'eolr-60':eolr===120?'eolr-120':'eolr-other';
  return `<span class="eolr-badge ${cls}">${eolr}</span>`;
}

function mpText(v){
  if(v===null||v===undefined||parseFloat(v)===0) return '<span class="mp-dash">—</span>';
  return `<span class="mp-val">${parseFloat(v).toFixed(1)}</span>`;
}

function isMissing(v){ return v===null||v===undefined||parseFloat(v)===0; }

// ── Grouping ──────────────────────────────────────────
function groupByModel(records){
  const map={};
  records.forEach(r=>{ const k=r.model_name||'—'; if(!map[k])map[k]=[]; map[k].push(r); });
  return Object.values(map).map(rows=>{
    rows.sort((a,b)=>a.eolr-b.eolr);
    const arts=[...new Set(rows.flatMap(r=>r.arts||[]))];
    return {model_name:rows[0].model_name, arts, ids:rows.map(r=>r.id), rows};
  });
}

// ── Render ────────────────────────────────────────────
function renderGroup(g){
  const n = g.rows.length;
  const chips = g.arts.map(a=>`<span class="art-chip">${esc(a)}</span>`).join('');
  let html = '';
  g.rows.forEach((r,i)=>{
    html += `<tr class="${i===0?'tr-first':'tr-sub'}">`;
    if(i===0){
      html += `<td class="model-cell" rowspan="${n}"><a href="/ie/${g.ids[0]}" class="model-link">${fmtModel(r.model_name)}</a></td>`;
      html += `<td class="arts-cell" rowspan="${n}">${chips||'<span style="color:#aaa;font-size:11px">—</span>'}</td>`;
    }
    html += `<td class="eolr-cell">${eolrBadge(r.eolr)}</td>`;
    html += `<td class="mp-cell">${mpText(r.cutting)}</td>`;
    html += `<td class="mp-cell">${mpText(r.stitching)}</td>`;
    html += `<td class="mp-cell">${mpText(r.assembly)}</td>`;
    html += `<td class="mp-cell">${mpText(r.stock)}</td>`;
    html += '</tr>';
  });
  return html;
}

function updateStats(){
  const missing = allRecords.filter(r=>isMissing(r.cutting)&&isMissing(r.stitching)&&isMissing(r.assembly)).length;
  document.getElementById('stats').textContent = allRecords.length ? L('stats')(allRecords.length, missing) : '—';
}

// ── Data ──────────────────────────────────────────────
async function loadData(){
  document.getElementById('ie-tbody').innerHTML = `<tr><td colspan="7" class="loading">${esc(L('loading'))}</td></tr>`;
  try{
    const res = await fetch('/api/ie/list');
    const data = await res.json();
    allRecords = data.ok ? (data.records||[]) : [];
    renderGroupedTable(groupByModel(allRecords));
    updateStats();
    fixStickyOffsets();
  }catch(e){
    document.getElementById('ie-tbody').innerHTML = `<tr><td colspan="7" class="empty">${esc(L('offline'))}</td></tr>`;
  }
}

function renderGroupedTable(groups){
  const tbody = document.getElementById('ie-tbody');
  if(!groups.length){ tbody.innerHTML=`<tr><td colspan="7" class="empty">${esc(L('empty'))}</td></tr>`; return; }
  tbody.innerHTML = groups.map(renderGroup).join('');
}

function filterTable(){
  const q = document.getElementById('search').value.toLowerCase();
  if(!q){ renderGroupedTable(groupByModel(allRecords)); return; }
  const matched = new Set(allRecords.filter(r=>(r.model_name||'').toLowerCase().includes(q)||(r.arts||[]).some(a=>a.toLowerCase().includes(q))).map(r=>r.model_name));
  renderGroupedTable(groupByModel(allRecords.filter(r=>matched.has(r.model_name))));
}

setLang(currentLang);
fixStickyOffsets();
loadData();
</script>
</body>
</html>
