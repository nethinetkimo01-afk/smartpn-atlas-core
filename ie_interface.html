<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IE 標準化界面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:13px;background:#f0f2f5;color:#1a1a2e;min-height:100vh}

:root{--ph-h:40px;--tb-h:44px;--thead-r1-h:32px}

.page-header{background:#1a2744;color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.page-header h1{font-size:15px;font-weight:600}
.header-right{display:flex;gap:8px;align-items:center}
.version{font-size:11px;color:#7a9bcc;background:#243356;padding:3px 8px;border-radius:4px}

.toolbar{background:#fff;border-bottom:1px solid #e4e9f2;padding:8px 20px;display:flex;gap:12px;align-items:center;position:sticky;top:var(--ph-h);z-index:90;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.search-inp{border:1px solid #d0d5e0;border-radius:5px;padding:5px 10px;font-size:12px;width:260px;outline:none}
.search-inp:focus{border-color:#4a6cf7;box-shadow:0 0 0 2px rgba(74,108,247,.12)}
.stats{font-size:11px;color:#888;margin-left:8px}

.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;transition:background .15s;outline:none}
.btn-refresh{background:#4a6cf7;color:#fff}.btn-refresh:hover{background:#3a5ce7}
.btn-link{background:#5c6bc0;color:#fff;text-decoration:none;padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500}.btn-link:hover{background:#3949ab}

.lang-group{display:flex;gap:2px;background:#243356;border-radius:5px;padding:2px}
.btn-lang{background:transparent;color:#8aaedd;border:none;border-radius:3px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;transition:background .12s}
.btn-lang:hover{background:#3a5080;color:#fff}
.btn-lang.active{background:#4a6cf7;color:#fff}

/* table-wrap scrolls independently so thead sticky top:0 works */
.table-wrap{overflow:auto;margin:14px 20px;border-radius:8px;box-shadow:0 1px 8px rgba(0,0,0,.1);max-height:calc(100vh - var(--ph-h) - var(--tb-h) - 28px)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12px;min-width:960px}

/* Row 1: sticky at top:0 */
thead tr:first-child th{
  background:#1a2744;color:#fff;padding:7px 8px;
  text-align:center;font-weight:700;white-space:nowrap;font-size:11px;
  border-right:1px solid #2e3d5c;
  position:sticky;top:0;z-index:5
}
/* Row 2: sticky at row1 height */
thead tr:last-child th{
  background:#243356;color:#c8d8f0;padding:5px 6px;
  text-align:center;font-weight:600;white-space:nowrap;font-size:10px;
  border-right:1px solid #1a2744;
  position:sticky;top:var(--thead-r1-h);z-index:4
}
thead th:last-child{border-right:none}
thead tr:first-child th.th-left{text-align:left}

/* EOLR group spanning headers */
.eolr-hdr-60 {background:#c84b00!important;color:#fff!important;border-left:2px solid #fff!important}
.eolr-hdr-120{background:#276e2a!important;color:#fff!important;border-left:2px solid #fff!important}

/* Sub-header row */
thead tr:last-child th.sub-60 {background:#fff3e0!important;color:#c84b00!important;border-top:2px solid #c84b00}
thead tr:last-child th.sub-120{background:#e8f5e9!important;color:#1b5e20!important;border-top:2px solid #276e2a}

/* Data rows */
.tr-model td{
  border-top:2px solid #c5cfe8;background:#fff;
  padding:6px 6px;border-bottom:1px solid #edf0f7;vertical-align:middle
}
.tr-model:nth-child(even) td{background:#f8faff}
.tr-model:hover td{background:#eef2ff!important}

/* Separator before EOLR=120 group */
.sep-120{border-left:2px solid #276e2a!important}

/* Fixed left columns */
.model-cell{max-width:210px;word-break:break-word;font-size:11px;color:#333;
  line-height:1.4;border-right:1px solid #e4e9f2;text-align:left!important}
.model-link{text-decoration:none;color:inherit;display:block}
.model-link:hover .model-short{color:#4a6cf7;text-decoration:underline}
.model-short{font-weight:700;color:#1a2744;font-size:12px}

.arts-cell{min-width:150px;border-right:1px solid #e4e9f2;padding:5px 6px;text-align:left!important}
.art-chip{display:inline-block;background:#e8f0fe;color:#1a2744;border-radius:10px;
  padding:1px 8px;font-size:11px;font-weight:600;margin:1px 2px 1px 0}

.mat-cell{min-width:110px;border-right:1px solid #e4e9f2;text-align:left!important;
  padding:5px 6px;vertical-align:top}

/* MP cells */
.mp-cell{min-width:68px;text-align:center}
.mp-val{font-size:12px;font-weight:600;color:#1a2744}
.mp-zero{font-size:12px;color:#bbb}
.mp-na{font-size:11px;color:#ddd}

.loading{text-align:center;padding:40px;color:#888}
.empty{text-align:center;padding:30px;color:#aaa;font-size:12px}
</style>
</head>
<body>

<div class="page-header" id="page-header">
  <h1 id="page-title">IE 標準化界面 · MP 一覽</h1>
  <div class="header-right">
    <div class="lang-group">
      <button class="btn-lang active" data-lang="zh" onclick="setLang('zh')">中</button>
      <button class="btn-lang"        data-lang="en" onclick="setLang('en')">EN</button>
      <button class="btn-lang"        data-lang="vi" onclick="setLang('vi')">VI</button>
    </div>
    <a href="/ie/matrix" class="btn-link" style="background:#0e7490">矩陣</a>
    <a href="/" class="btn-link" id="btn-back">← DS-03</a>
    <div id="status-dot" title="伺服器狀態" style="width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block;flex-shrink:0;cursor:default"></div>
    <button id="btn-reconnect" onclick="reconnect()" style="display:none;background:#ef4444;color:#fff;border:none;border-radius:4px;padding:3px 9px;font-size:11px;cursor:pointer;font-weight:500">重新連線</button>
    <span class="version">v1.6</span>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <input id="search" class="search-inp" type="text" placeholder="搜尋鞋型 / ART..." oninput="filterTable()">
  <button id="btn-reload" class="btn btn-refresh" onclick="loadData()">重新載入</button>
  <span id="stats" class="stats">—</span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th id="th-model" rowspan="2" class="th-left" style="min-width:190px">鞋型</th>
        <th id="th-arts"  rowspan="2" class="th-left" style="min-width:150px">ART 列表</th>
        <th id="th-mat"    rowspan="2" class="th-left" style="min-width:110px">材料類</th>
        <th id="th-season" rowspan="2" style="min-width:60px">生產季度</th>
        <th colspan="4" class="eolr-hdr-60">EOLR = 60</th>
        <th colspan="4" class="eolr-hdr-120">EOLR = 120</th>
      </tr>
      <tr>
        <th id="th-cut60"     class="sub-60"  style="width:72px">裁斷MP</th>
        <th id="th-stitch60"  class="sub-60"  style="width:72px">針車MP</th>
        <th id="th-asm60"     class="sub-60"  style="width:72px">成型MP</th>
        <th id="th-sf60"      class="sub-60"  style="width:72px">貼底</th>
        <th id="th-cut120"    class="sub-120" style="width:72px">裁斷MP</th>
        <th id="th-stitch120" class="sub-120" style="width:72px">針車MP</th>
        <th id="th-asm120"    class="sub-120" style="width:72px">成型MP</th>
        <th id="th-sf120"     class="sub-120" style="width:72px">貼底</th>
      </tr>
    </thead>
    <tbody id="ie-tbody">
      <tr><td colspan="12" class="loading">載入中...</td></tr>
    </tbody>
  </table>
</div>

<script>
// ── i18n ──────────────────────────────────────────────
const LANGS = {
  zh:{
    title:'IE 標準化界面 · MP 一覽',
    col_model:'鞋型',col_arts:'ART 列表',col_mat:'材料類',
    col_eolr60:'EOLR = 60',col_eolr120:'EOLR = 120',
    col_cut:'裁斷MP',col_stitch:'針車MP',col_asm:'成型MP',col_sf:'貼底',
    search_ph:'搜尋鞋型 / ART...',btn_reload:'重新載入',
    stats:(n,m)=>`共 ${n} 款鞋型 · ${m} 款缺 MP`,
    loading:'載入中...',offline:'伺服器離線',empty:'無記錄',back:'← DS-03'
  },
  en:{
    title:'IE Interface · MP Overview',
    col_model:'Model Name',col_arts:'ART List',col_mat:'Material',
    col_eolr60:'EOLR = 60',col_eolr120:'EOLR = 120',
    col_cut:'Cutting MP',col_stitch:'Stitching MP',col_asm:'Assembly MP',col_sf:'Stockfitting',
    search_ph:'Search model / ART...',btn_reload:'Reload',
    stats:(n,m)=>`${n} models · ${m} missing MP`,
    loading:'Loading...',offline:'Server offline',empty:'No records',back:'← DS-03'
  },
  vi:{
    title:'Giao diện IE · Tổng quan MP',
    col_model:'Tên giày',col_arts:'Danh sách ART',col_mat:'Nguyên liệu',
    col_eolr60:'EOLR = 60',col_eolr120:'EOLR = 120',
    col_cut:'MP Cắt',col_stitch:'MP May',col_asm:'MP Lắp ráp',col_sf:'Stockfitting',
    search_ph:'Tìm kiểu giày / ART...',btn_reload:'Tải lại',
    stats:(n,m)=>`${n} kiểu giày · ${m} thiếu MP`,
    loading:'Đang tải...',offline:'Máy chủ offline',empty:'Không có dữ liệu',back:'← DS-03'
  },
};
let currentLang = localStorage.getItem('ie_lang') || 'zh';
let allRecords = [];
let allGroups  = [];
function L(k){ return LANGS[currentLang][k]; }

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('ie_lang', lang);
  const d = LANGS[lang];
  document.getElementById('page-title').textContent    = d.title; document.title = d.title;
  document.getElementById('th-model').textContent      = d.col_model;
  document.getElementById('th-arts').textContent       = d.col_arts;
  document.getElementById('th-mat').textContent        = d.col_mat;
  document.querySelector('.eolr-hdr-60').textContent   = d.col_eolr60;
  document.querySelector('.eolr-hdr-120').textContent  = d.col_eolr120;
  document.getElementById('th-cut60').textContent      = d.col_cut;
  document.getElementById('th-stitch60').textContent   = d.col_stitch;
  document.getElementById('th-asm60').textContent      = d.col_asm;
  document.getElementById('th-sf60').textContent       = d.col_sf;
  document.getElementById('th-cut120').textContent     = d.col_cut;
  document.getElementById('th-stitch120').textContent  = d.col_stitch;
  document.getElementById('th-asm120').textContent     = d.col_asm;
  document.getElementById('th-sf120').textContent      = d.col_sf;
  document.getElementById('search').placeholder        = d.search_ph;
  document.getElementById('btn-reload').textContent    = d.btn_reload;
  document.getElementById('btn-back').textContent      = d.back;
  document.querySelectorAll('.btn-lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  updateStats();
}

function fixStickyOffsets(){
  const ph = document.getElementById('page-header').getBoundingClientRect().height;
  const tb = document.getElementById('toolbar').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--ph-h', Math.round(ph)+'px');
  document.documentElement.style.setProperty('--tb-h', Math.round(tb)+'px');
  const r1 = document.querySelector('thead tr:first-child');
  if(r1) document.documentElement.style.setProperty('--thead-r1-h', Math.round(r1.getBoundingClientRect().height)+'px');
}

// ── Helpers ───────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmtModel(name){
  if(!name) return '<span class="model-short" style="color:#aaa">—</span>';
  const short = name.replace(/\s+Target Output.*$/i,'').replace(/\s{2,}/g,' ').trim();
  return `<span class="model-short">${esc(short)}</span>`;
}

function mpText(v){
  if(v===null||v===undefined||parseFloat(v)===0)
    return '<span class="mp-zero">—</span>';
  return `<span class="mp-val">${parseFloat(v).toFixed(1)}</span>`;
}

function matText(v){
  if(!v) return '<span style="color:#aaa;font-size:11px">—</span>';
  return v.split('/').map(s=>s.trim()).filter(Boolean)
    .map(s=>`<span style="font-size:10px;display:block;line-height:1.5;color:#444">${esc(s)}</span>`).join('');
}

function isMissing(r){
  return !r||((!r.cutting||parseFloat(r.cutting)===0)&&
              (!r.stitching||parseFloat(r.stitching)===0)&&
              (!r.assembly||parseFloat(r.assembly)===0));
}

// ── Grouping ──────────────────────────────────────────
// Normalize model name for grouping: strip the " Target Output..." suffix that
// the IE Excel embeds in the model_name field.  fmtModel() does the same strip
// for display, so the group key matches the visible label.
function normKey(name){
  return (name||'').replace(/\s+Target Output.*$/i,'').replace(/\s{2,}/g,' ').trim().toLowerCase();
}

// API already deduplicates (1 record per model_name+eolr, latest wins).
// Group by normalized model name so r60/r120 share one UI row even when the
// raw model_name strings differ only in the Target Output suffix.
function groupByModel(records){
  const map = new Map();
  records.forEach(r=>{
    const key = normKey(r.model_name);
    if(!map.has(key)) map.set(key,{model_name:r.model_name||'',arts:[],mat:'',season:'',r60:null,r120:null,id60:null,id120:null});
    const g = map.get(key);
    (r.arts||[]).forEach(a=>{ if(!g.arts.includes(a)) g.arts.push(a); });
    if(!g.mat && r.material) g.mat = r.material;
    if(!g.season && r.season) g.season = r.season;
    const eolr = parseInt(r.eolr, 10);
    if(eolr===60)  { g.r60=r;  g.id60=r.id; }
    if(eolr===120) { g.r120=r; g.id120=r.id; }
  });
  const groups = [...map.values()];
  groups.sort((a,b)=>normKey(a.model_name).localeCompare(normKey(b.model_name)));
  return groups;
}

// ── Render ────────────────────────────────────────────
function mp4cells(r, firstCls){
  const c1 = 'mp-cell'+(firstCls?' '+firstCls:'');
  if(!r){
    const na = '<span class="mp-na">—</span>';
    return `<td class="${c1}">${na}</td><td class="mp-cell">${na}</td><td class="mp-cell">${na}</td><td class="mp-cell">${na}</td>`;
  }
  return `<td class="${c1}">${mpText(r.cutting)}</td>`+
    `<td class="mp-cell">${mpText(r.stitching)}</td>`+
    `<td class="mp-cell">${mpText(r.assembly)}</td>`+
    `<td class="mp-cell">${mpText(r.stock)}</td>`;
}

function renderRow(g){
  const chips = g.arts.map(a=>`<span class="art-chip">${esc(a)}</span>`).join('');
  const linkId = g.id120||g.id60||0;
  const detailLink = linkId ? `<a href="/ie/${linkId}/detail" style="font-size:10px;color:#7a9bcc;margin-left:5px" title="IE細表">細表</a>` : '';
  return `<tr class="tr-model">`+
    `<td class="model-cell"><a href="/ie/${linkId}" class="model-link">${fmtModel(g.model_name)}</a>${detailLink}</td>`+
    `<td class="arts-cell">${chips||'<span style="color:#aaa;font-size:11px">—</span>'}</td>`+
    `<td class="mat-cell">${matText(g.mat)}</td>`+
    `<td style="text-align:center;font-size:11px;font-weight:600;color:#1a4a7a;white-space:nowrap">${esc(g.season||'—')}</td>`+
    mp4cells(g.r60, '')+
    mp4cells(g.r120, 'sep-120')+
    `</tr>`;
}

function updateStats(){
  if(!allGroups.length){ document.getElementById('stats').textContent='—'; return; }
  const missing = allGroups.filter(g=>isMissing(g.r60)&&isMissing(g.r120)).length;
  document.getElementById('stats').textContent = L('stats')(allGroups.length, missing);
}

// ── Data ──────────────────────────────────────────────
async function loadData(){
  document.getElementById('ie-tbody').innerHTML=`<tr><td colspan="11" class="loading">${esc(L('loading'))}</td></tr>`;
  try{
    const res  = await fetch('/api/ie/list');
    const data = await res.json();
    allRecords = data.ok?(data.records||[]):[];
    allGroups  = groupByModel(allRecords);
    renderGroupedTable(allGroups);
    updateStats();
    fixStickyOffsets();
  }catch(e){
    document.getElementById('ie-tbody').innerHTML=`<tr><td colspan="11" class="empty">${esc(L('offline'))}</td></tr>`;
  }
}

function renderGroupedTable(groups){
  const tbody = document.getElementById('ie-tbody');
  if(!groups.length){ tbody.innerHTML=`<tr><td colspan="11" class="empty">${esc(L('empty'))}</td></tr>`; return; }
  tbody.innerHTML = groups.map(renderRow).join('');
}

function filterTable(){
  const q = document.getElementById('search').value.toLowerCase();
  if(!q){ renderGroupedTable(allGroups); return; }
  const filtered = allRecords.filter(r=>
    (r.model_name||'').toLowerCase().includes(q)||
    (r.arts||[]).some(a=>a.toLowerCase().includes(q))
  );
  renderGroupedTable(groupByModel(filtered));
}

// ── Health check / status dot ─────────────────────
let _healthTimer = null;

async function _doFetch(){
  const ctrl = new AbortController();
  const tid = setTimeout(()=>ctrl.abort(), 5000);
  try{
    const r = await fetch('/api/health', {signal: ctrl.signal});
    clearTimeout(tid);
    const d = await r.json();
    return !!d.ok;
  }catch(e){ clearTimeout(tid); return false; }
}

async function checkHealth(){
  let ok = await _doFetch();
  if(!ok){
    await new Promise(r=>setTimeout(r, 2000));
    ok = await _doFetch();
  }
  const dot = document.getElementById('status-dot');
  const btn = document.getElementById('btn-reconnect');
  dot.style.background = ok ? '#22c55e' : '#ef4444';
  dot.title = ok ? '伺服器正常' : '伺服器離線';
  if(btn) btn.style.display = ok ? 'none' : 'inline-block';
  if(_healthTimer) clearTimeout(_healthTimer);
  _healthTimer = setTimeout(checkHealth, 30000);
}

async function reconnect(){
  const dot = document.getElementById('status-dot');
  const btn = document.getElementById('btn-reconnect');
  dot.style.background = '#f59e0b';
  dot.title = '連線中...';
  if(btn) btn.style.display = 'none';
  await checkHealth();
  loadData();
}

setLang(currentLang);
fixStickyOffsets();
loadData();
checkHealth();
</script>
</body>
</html>
