<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IE 標準化界面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:13px;background:#f0f2f5;color:#1a1a2e;min-height:100vh}

.page-header{background:#1a2744;color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.page-header h1{font-size:15px;font-weight:600}
.header-right{display:flex;gap:10px;align-items:center}
.version{font-size:11px;color:#7a9bcc;background:#243356;padding:3px 8px;border-radius:4px}

.toolbar{background:#fff;border-bottom:1px solid #e4e9f2;padding:8px 20px;display:flex;gap:12px;align-items:center}
.search-inp{border:1px solid #d0d5e0;border-radius:5px;padding:5px 10px;font-size:12px;width:260px;outline:none}
.search-inp:focus{border-color:#4a6cf7;box-shadow:0 0 0 2px rgba(74,108,247,.12)}
.stats{font-size:11px;color:#888;margin-left:8px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;transition:background .15s;outline:none}
.btn-refresh{background:#4a6cf7;color:#fff}.btn-refresh:hover{background:#3a5ce7}
.btn-save{background:#1d9e6b;color:#fff}.btn-save:hover{background:#178059}
.btn-link{background:#5c6bc0;color:#fff;text-decoration:none}.btn-link:hover{background:#3949ab}

.table-wrap{overflow-x:auto;margin:14px 20px;border-radius:8px;box-shadow:0 1px 8px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
thead th{background:#1a2744;color:#fff;padding:8px 6px;text-align:left;font-weight:600;white-space:nowrap;font-size:11px;border-right:1px solid #243356;position:sticky;top:52px;z-index:5}
thead th:last-child{border-right:none}
tbody tr:nth-child(even){background:#f7f9fc}
tbody tr:hover{background:#eef2ff}
td{padding:6px 6px;border-bottom:1px solid #edf0f7;vertical-align:top}

.model-cell{max-width:220px;word-break:break-word;font-size:11px;color:#333;line-height:1.4}
.model-short{font-weight:700;color:#1a2744;font-size:12px}
.model-detail{color:#888;font-size:10px;margin-top:2px}

.arts-cell{min-width:160px}
.art-chip{display:inline-block;background:#e8f0fe;color:#1a2744;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;margin:1px 2px 1px 0}
.art-add-wrap{display:flex;gap:4px;margin-top:4px;align-items:center}
.art-add-inp{border:1px solid #d0d5e0;border-radius:4px;padding:2px 6px;font-size:11px;width:76px;outline:none}
.art-add-inp:focus{border-color:#4a6cf7}
.btn-art-add{background:#4a6cf7;color:#fff;border:none;border-radius:4px;padding:1px 7px;font-size:11px;cursor:pointer;font-weight:500;line-height:1.6}.btn-art-add:hover{background:#3a5ce7}

.mp-cell{min-width:80px;text-align:center}
.mp-inp{width:72px;border:1px solid #d0d5e0;border-radius:4px;padding:3px 6px;font-size:12px;text-align:center;background:#f8f9fc;outline:none}
.mp-inp:focus{border-color:#4a6cf7;background:#fff;box-shadow:0 0 0 2px rgba(74,108,247,.12)}
.mp-inp.missing{background:#fff0f0;border-color:#ffaaaa;color:#cc2222}
.mp-inp.missing:focus{background:#fff;border-color:#cc2222}
.mp-inp.changed{background:#fffde7;border-color:#ffc107}

.eolr-cell{text-align:center;color:#555;font-size:11px;white-space:nowrap}
.source-badge{font-size:10px;padding:1px 6px;border-radius:8px;display:inline-block;margin-top:2px}
.src-ie{background:#e8f5e9;color:#2e7d32}
.src-manual{background:#fff3e0;color:#e65100}
.src-unknown{background:#f5f5f5;color:#757575}

.save-cell{text-align:center;min-width:60px}
.btn-row-save{background:#1d9e6b;color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;font-weight:500}.btn-row-save:hover{background:#178059}
.save-ok{color:#1a7a40;font-size:11px;font-weight:600}
.save-err{color:#cc2222;font-size:11px}

.loading{text-align:center;padding:40px;color:#888;font-size:13px}
.empty{text-align:center;padding:30px;color:#aaa;font-size:12px}
</style>
</head>
<body>

<div class="page-header">
  <h1>IE 標準化界面 · MP 一覽</h1>
  <div class="header-right">
    <a href="/" class="btn btn-link">← DS-03</a>
    <span class="version">v1.0</span>
  </div>
</div>

<div class="toolbar">
  <input id="search" class="search-inp" type="text" placeholder="搜尋鞋型 / ART..." oninput="filterTable()">
  <button class="btn btn-refresh" onclick="loadData()">重新載入</button>
  <span id="stats" class="stats">—</span>
</div>

<div class="table-wrap">
  <table id="ie-table">
    <thead>
      <tr>
        <th style="min-width:200px">鞋型 (IE 標題)</th>
        <th style="min-width:160px">ART 列表</th>
        <th style="width:60px;text-align:center">EOLR</th>
        <th style="width:80px;text-align:center">Cutting MP</th>
        <th style="width:80px;text-align:center">Stitching MP</th>
        <th style="width:80px;text-align:center">Assembly MP</th>
        <th style="width:80px;text-align:center">Stockfitting</th>
        <th style="width:64px;text-align:center">存檔</th>
      </tr>
    </thead>
    <tbody id="ie-tbody">
      <tr><td colspan="8" class="loading">載入中...</td></tr>
    </tbody>
  </table>
</div>

<script>
let allRecords = [];

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtModel(name) {
  if (!name) return '<span class="model-short" style="color:#aaa">—</span>';
  // Extract short name (first meaningful word group before "Target Output")
  const short = name.replace(/\s+Target Output.*$/i, '').replace(/\s{2,}/g,' ').trim();
  const detail = name.length > short.length ? name.slice(short.length).trim() : '';
  return `<span class="model-short">${esc(short)}</span>` +
         (detail ? `<div class="model-detail">${esc(detail.slice(0,60))}</div>` : '');
}

function srcBadge(source) {
  if (!source) return '';
  const cls = source.includes('ie') ? 'src-ie' : source.includes('manual') ? 'src-manual' : 'src-unknown';
  return `<span class="source-badge ${cls}">${esc(source)}</span>`;
}

function renderRow(r) {
  const isMissing = (v) => v === null || v === undefined || parseFloat(v) === 0;
  const mpCls = (v) => isMissing(v) ? ' missing' : '';
  const mpVal = (v) => (v === null || v === undefined) ? '' : v;

  const artsHtml = (r.arts || []).map(a => `<span class="art-chip">${esc(a)}</span>`).join('') +
    `<div class="art-add-wrap">
       <input class="art-add-inp" type="text" placeholder="新增 ART" maxlength="10"
              onkeydown="if(event.key==='Enter')addArt(${r.id},this)">
       <button class="btn-art-add" onclick="addArt(${r.id},this.previousElementSibling)">+</button>
     </div>`;

  return `<tr id="row-${r.id}" data-model="${esc(r.model_name)}" data-arts="${esc((r.arts||[]).join(','))}">
    <td class="model-cell">${fmtModel(r.model_name)}</td>
    <td class="arts-cell" id="arts-${r.id}">${artsHtml}</td>
    <td class="eolr-cell">${r.eolr}<br>${srcBadge(r.source)}</td>
    <td class="mp-cell"><input class="mp-inp${mpCls(r.cutting)}" id="mp-c-${r.id}" type="number" step="0.1" value="${mpVal(r.cutting)}" oninput="markChanged(this)" placeholder="—"></td>
    <td class="mp-cell"><input class="mp-inp${mpCls(r.stitching)}" id="mp-s-${r.id}" type="number" step="0.1" value="${mpVal(r.stitching)}" oninput="markChanged(this)" placeholder="—"></td>
    <td class="mp-cell"><input class="mp-inp${mpCls(r.assembly)}" id="mp-a-${r.id}" type="number" step="0.1" value="${mpVal(r.assembly)}" oninput="markChanged(this)" placeholder="—"></td>
    <td class="mp-cell"><input class="mp-inp${mpCls(r.stock)}" id="mp-sf-${r.id}" type="number" step="0.1" value="${mpVal(r.stock)}" oninput="markChanged(this)" placeholder="—"></td>
    <td class="save-cell"><button class="btn-row-save" onclick="saveRow(${r.id})">Save</button><div id="save-${r.id}"></div></td>
  </tr>`;
}

function markChanged(inp) {
  inp.classList.remove('missing');
  inp.classList.add('changed');
}

async function loadData() {
  document.getElementById('ie-tbody').innerHTML = '<tr><td colspan="8" class="loading">載入中...</td></tr>';
  try {
    const res = await fetch('/api/ie/list');
    const data = await res.json();
    allRecords = data.ok ? (data.records || []) : [];
    renderTable(allRecords);
    const missing = allRecords.filter(r => !r.cutting && !r.stitching && !r.assembly).length;
    document.getElementById('stats').textContent = `共 ${allRecords.length} 筆鞋型 · ${missing} 筆缺 MP`;
  } catch(e) {
    document.getElementById('ie-tbody').innerHTML = '<tr><td colspan="8" class="empty">伺服器離線</td></tr>';
  }
}

function renderTable(records) {
  const tbody = document.getElementById('ie-tbody');
  if (!records.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">無記錄</td></tr>';
    return;
  }
  tbody.innerHTML = records.map(renderRow).join('');
}

function filterTable() {
  const q = document.getElementById('search').value.toLowerCase();
  if (!q) { renderTable(allRecords); return; }
  renderTable(allRecords.filter(r =>
    (r.model_name || '').toLowerCase().includes(q) ||
    (r.arts || []).some(a => a.toLowerCase().includes(q))
  ));
}

async function saveRow(id) {
  const c  = parseFloat(document.getElementById('mp-c-' + id)?.value  || 0) || 0;
  const s  = parseFloat(document.getElementById('mp-s-' + id)?.value  || 0) || 0;
  const a  = parseFloat(document.getElementById('mp-a-' + id)?.value  || 0) || 0;
  const sf = parseFloat(document.getElementById('mp-sf-'+ id)?.value  || 0) || 0;
  const el = document.getElementById('save-' + id);
  try {
    const res = await fetch('/api/ie/update_mp', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ header_id: id, cutting: c, stitching: s, assembly: a, stock: sf })
    });
    const r = await res.json();
    if (r.ok) {
      el.innerHTML = '<span class="save-ok">✓</span>';
      // Remove missing/changed styles
      ['mp-c-','mp-s-','mp-a-','mp-sf-'].forEach(pre => {
        const inp = document.getElementById(pre + id);
        if (inp) { inp.classList.remove('missing','changed'); }
      });
      setTimeout(() => { el.innerHTML = ''; }, 2000);
    } else {
      el.innerHTML = `<span class="save-err">${esc(r.error)}</span>`;
    }
  } catch(e) {
    el.innerHTML = '<span class="save-err">離線</span>';
  }
}

async function addArt(headerId, inp) {
  const art = inp.value.trim().toUpperCase();
  if (!art) return;
  try {
    const res = await fetch('/api/ds03/add_art', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ art, header_id: headerId })
    });
    const r = await res.json();
    if (r.ok) {
      inp.value = '';
      // Refresh just that row's arts
      const rec = allRecords.find(x => x.id === headerId);
      if (rec && !rec.arts.includes(art)) rec.arts.push(art);
      const artsCell = document.getElementById('arts-' + headerId);
      if (artsCell) {
        const chips = (rec?.arts || []).map(a => `<span class="art-chip">${esc(a)}</span>`).join('');
        artsCell.innerHTML = chips +
          `<div class="art-add-wrap">
             <input class="art-add-inp" type="text" placeholder="新增 ART" maxlength="10"
                    onkeydown="if(event.key==='Enter')addArt(${headerId},this)">
             <button class="btn-art-add" onclick="addArt(${headerId},this.previousElementSibling)">+</button>
           </div>`;
      }
    } else {
      alert('Error: ' + r.error);
    }
  } catch(e) {
    alert('Server offline');
  }
}

// ── Keyboard shortcut: Enter to save when in MP cell ──
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.target.classList.contains('mp-inp')) {
    const id = e.target.id.split('-').pop();
    if (id) saveRow(parseInt(id));
  }
});

loadData();
</script>
</body>
</html>
