<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IE 標準化界面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:13px;background:#f0f2f5;color:#1a1a2e;min-height:100vh}

:root{--ph-h:40px;--tb-h:44px}

.page-header{background:#1a2744;color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.page-header h1{font-size:15px;font-weight:600}
.header-right{display:flex;gap:8px;align-items:center}
.version{font-size:11px;color:#7a9bcc;background:#243356;padding:3px 8px;border-radius:4px}

.toolbar{background:#fff;border-bottom:1px solid #e4e9f2;padding:8px 20px;display:flex;gap:12px;align-items:center;position:sticky;top:var(--ph-h);z-index:90;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.search-inp{border:1px solid #d0d5e0;border-radius:5px;padding:5px 10px;font-size:12px;width:260px;outline:none}
.search-inp:focus{border-color:#4a6cf7;box-shadow:0 0 0 2px rgba(74,108,247,.12)}
.stats{font-size:11px;color:#888;margin-left:8px}

.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;transition:background .15s;outline:none}
.btn-refresh{background:#4a6cf7;color:#fff}.btn-refresh:hover{background:#3a5ce7}
.btn-link{background:#5c6bc0;color:#fff;text-decoration:none;padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500}.btn-link:hover{background:#3949ab}

.lang-group{display:flex;gap:2px;background:#243356;border-radius:5px;padding:2px}
.btn-lang{background:transparent;color:#8aaedd;border:none;border-radius:3px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;transition:background .12s}
.btn-lang:hover{background:#3a5080;color:#fff}
.btn-lang.active{background:#4a6cf7;color:#fff}

.table-wrap{overflow:auto;margin:14px 20px;border-radius:8px;box-shadow:0 1px 8px rgba(0,0,0,.1);max-height:calc(100vh - var(--ph-h) - var(--tb-h) - 28px)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12px;min-width:780px}

thead tr th{
  background:#1a2744;color:#fff;padding:7px 8px;
  text-align:center;font-weight:700;white-space:nowrap;font-size:11px;
  border-right:1px solid #2e3d5c;
  position:sticky;top:0;z-index:5
}
thead th.th-left{text-align:left}
thead th:last-child{border-right:none}

/* Paired model rows */
.tr-eolr td{
  padding:5px 7px;border-bottom:1px solid #edf0f7;vertical-align:middle
}
.tr-model-first td{border-top:2px solid #c5cfe8}
.tr-model-second td{border-top:1px dashed #d0d8ec}
.tr-model-second .season-cell,.tr-model-second .model-cell,
.tr-model-second .arts-cell,.tr-model-second .mat-cell{color:#aaa;font-size:10px}
.tr-single td{border-top:2px solid #c5cfe8}
.tr-eolr:hover td{background:#f0f4ff!important}

/* Left shared cells */
.season-cell{text-align:center;font-size:11px;font-weight:600;color:#1a4a7a;white-space:nowrap;border-right:1px solid #e4e9f2;vertical-align:middle!important}
.model-cell{max-width:210px;word-break:break-word;font-size:11px;color:#333;line-height:1.5;border-right:1px solid #e4e9f2;text-align:left!important;vertical-align:middle!important}
.model-link{text-decoration:none;color:inherit}
.model-link:hover .model-short{color:#4a6cf7;text-decoration:underline}
.model-short{font-weight:700;color:#1a2744;font-size:12px}
.detail-link{font-size:10px;color:#7a9bcc;margin-left:4px;text-decoration:none;display:inline-block;margin-top:2px}
.detail-link:hover{color:#4a6cf7;text-decoration:underline}

.arts-cell{min-width:140px;border-right:1px solid #e4e9f2;padding:5px 7px;text-align:left!important;vertical-align:middle!important}
.art-chip{display:inline-block;background:#e8f0fe;color:#1a2744;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;margin:1px 2px 1px 0}

.mat-cell{min-width:100px;border-right:1px solid #e4e9f2;text-align:left!important;padding:5px 7px;vertical-align:middle!important}

/* EOLR badge cell */
.eolr-cell{text-align:center;border-right:1px solid #e4e9f2;white-space:nowrap;padding:4px 8px}
.eolr-60 {display:inline-block;background:#fff3e0;color:#c84b00;border:1px solid #ffb74d;border-radius:4px;padding:2px 10px;font-size:11px;font-weight:700}
.eolr-120{display:inline-block;background:#e8f5e9;color:#1b5e20;border:1px solid #81c784;border-radius:4px;padding:2px 10px;font-size:11px;font-weight:700}

/* MP cells */
.mp-cell{min-width:72px;text-align:right;padding:4px 10px;border-right:1px solid #e8ecf4;font-family:Consolas,monospace}
.mp-cell:last-child{border-right:none}
.mp-val{font-size:12px;font-weight:700;color:#1a2744}
.mp-zero{font-size:12px;color:#bbb}
.mp-na{font-size:11px;color:#ddd}

.loading{text-align:center;padding:40px;color:#888}
.empty{text-align:center;padding:30px;color:#aaa;font-size:12px}

.act-cell{text-align:center;padding:2px 4px;white-space:nowrap;border-right:1px solid #e4e9f2;vertical-align:middle}
.btn-add-rec,.btn-del-rec{background:transparent;border:none;cursor:pointer;font-size:12px;font-weight:700;border-radius:3px;padding:1px 5px;line-height:1.5}
.btn-add-rec{color:#1a2744}.btn-add-rec:hover{background:#e8eaf6}
.row-menu{position:absolute;left:0;top:22px;background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:100;min-width:160px;padding:4px 0;white-space:nowrap}
.row-menu div{padding:7px 14px;font-size:13px;cursor:pointer;color:#222}.row-menu div:hover{background:#f5f7ff}
.btn-del-rec{color:#e53935}.btn-del-rec:hover{background:#ffebee;color:#b71c1c}
</style>
</head>
<body>

<div class="page-header" id="page-header">
  <h1 id="page-title">IE 標準化界面 · MP 一覽</h1>
  <div class="header-right">
    <div class="lang-group">
      <button class="btn-lang active" data-lang="zh" onclick="setLang('zh')">中</button>
      <button class="btn-lang"        data-lang="en" onclick="setLang('en')">EN</button>
      <button class="btn-lang"        data-lang="vi" onclick="setLang('vi')">VI</button>
    </div>
    <a href="/ie/matrix" class="btn-link" style="background:#0e7490">矩陣</a>
    <a href="/" class="btn-link" id="btn-back">← DS-03</a>
    <div id="status-dot" title="伺服器狀態" style="width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block;flex-shrink:0;cursor:default"></div>
    <button id="btn-reconnect" onclick="reconnect()" style="display:none;background:#ef4444;color:#fff;border:none;border-radius:4px;padding:3px 9px;font-size:11px;cursor:pointer;font-weight:500">重新連線</button>
    <span class="version">v2.0</span>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <input id="search" class="search-inp" type="text" placeholder="搜尋鞋型 / ART..." oninput="filterTable()">
  <button id="btn-reload" class="btn btn-refresh" onclick="loadData()">重新載入</button>
  <button id="btn-new-model" class="btn btn-refresh" onclick="openNewModelModal()" style="display:none;background:#1a2744;color:#fff">＋ 新增鞋型</button>
  <span id="user-badge" style="font-size:12px;color:#555;padding:0 6px"></span>
  <a id="btn-logout" href="#" onclick="doLogout()" style="display:none;font-size:12px;color:#888;text-decoration:none">登出</a>
  <span id="stats" class="stats">—</span>
</div>

<!-- New Model Modal -->
<div id="modal-new-model" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:10px;padding:28px;width:380px;box-shadow:0 8px 32px rgba(0,0,0,.3)">
    <h3 style="color:#1a2744;margin-bottom:16px;font-size:16px">新增鞋型</h3>
    <label style="font-size:12px;color:#666">鞋型名稱 *</label>
    <input id="nm-name" type="text" placeholder="e.g. TOKYO W" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;margin-bottom:10px;font-size:14px">
    <label style="font-size:12px;color:#666">ART *</label>
    <input id="nm-art" type="text" placeholder="e.g. TEST001" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;margin-bottom:10px;font-size:14px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div>
        <label style="font-size:12px;color:#666">EOLR</label>
        <select id="nm-eolr" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px">
          <option value="120">120</option>
          <option value="60">60</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px;color:#666">季度</label>
        <input id="nm-season" type="text" placeholder="FW26" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px">
      </div>
    </div>
    <div id="nm-msg" style="font-size:12px;color:#c00;min-height:16px;margin-bottom:8px"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button onclick="closeNewModelModal()" style="padding:7px 16px;border:1px solid #ccc;border-radius:4px;cursor:pointer;background:#fff">取消</button>
      <button onclick="submitNewModel()" style="padding:7px 16px;background:#1a2744;color:#fff;border:none;border-radius:4px;cursor:pointer">建立</button>
    </div>
  </div>
</div>

<!-- Assign Modal -->
<div id="modal-assign" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:10px;padding:28px;width:380px;box-shadow:0 8px 32px rgba(0,0,0,.3)">
    <h3 style="color:#1a2744;margin-bottom:6px;font-size:16px" id="assign-title">指派鞋型</h3>
    <div style="font-size:12px;color:#888;margin-bottom:14px" id="assign-model-name"></div>
    <div id="assign-list" style="max-height:200px;overflow-y:auto;border:1px solid #eee;border-radius:4px;padding:8px;margin-bottom:12px;font-size:13px"></div>
    <label style="font-size:12px;color:#666">新增指派（選擇帳號）</label>
    <select id="assign-user-sel" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px;margin-top:4px;margin-bottom:10px">
      <option value="">— 選擇資料建立帳號 —</option>
    </select>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button onclick="closeAssignModal()" style="padding:7px 16px;border:1px solid #ccc;border-radius:4px;cursor:pointer;background:#fff">關閉</button>
      <button onclick="submitAssign()" style="padding:7px 16px;background:#1a2744;color:#fff;border:none;border-radius:4px;cursor:pointer">指派</button>
    </div>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:46px;text-align:center;border-right:1px solid #c8d5ed;padding:4px 2px"></th>
        <th id="th-season" style="min-width:70px">生產季度</th>
        <th id="th-model"  class="th-left" style="min-width:180px">鞋型</th>
        <th id="th-arts"   class="th-left" style="min-width:140px">ART 列表</th>
        <th id="th-mat"    class="th-left" style="min-width:100px">材料類</th>
        <th id="th-eolr"   style="min-width:60px">EOLR</th>
        <th id="th-cut"    style="min-width:72px">裁斷MP</th>
        <th id="th-stitch" style="min-width:72px">針車MP</th>
        <th id="th-asm"    style="min-width:72px">成型MP</th>
        <th id="th-sf"     style="min-width:72px">貼底</th>
      </tr>
    </thead>
    <tbody id="ie-tbody">
      <tr><td colspan="10" class="loading">載入中...</td></tr>
    </tbody>
  </table>
</div>

<script>
const LANGS = {
  zh:{
    title:'IE 標準化界面 · MP 一覽',
    col_season:'生產季度',col_model:'鞋型',col_arts:'ART 列表',col_mat:'材料類',
    col_eolr:'EOLR',col_cut:'裁斷MP',col_stitch:'針車MP',col_asm:'成型MP',col_sf:'貼底',
    search_ph:'搜尋鞋型 / ART...',btn_reload:'重新載入',
    stats:(n,m)=>`共 ${n} 款鞋型 · ${m} 款缺 MP`,
    loading:'載入中...',offline:'伺服器離線',empty:'無記錄',back:'← DS-03',
    detail:'▶ 細表',
  },
  en:{
    title:'IE Interface · MP Overview',
    col_season:'Season',col_model:'Model Name',col_arts:'ART List',col_mat:'Material',
    col_eolr:'EOLR',col_cut:'Cutting MP',col_stitch:'Stitching MP',col_asm:'Assembly MP',col_sf:'Stockfitting',
    search_ph:'Search model / ART...',btn_reload:'Reload',
    stats:(n,m)=>`${n} models · ${m} missing MP`,
    loading:'Loading...',offline:'Server offline',empty:'No records',back:'← DS-03',
    detail:'▶ Detail',
  },
  vi:{
    title:'Giao diện IE · Tổng quan MP',
    col_season:'Mùa',col_model:'Tên giày',col_arts:'Danh sách ART',col_mat:'Nguyên liệu',
    col_eolr:'EOLR',col_cut:'MP Cắt',col_stitch:'MP May',col_asm:'MP Lắp ráp',col_sf:'Stockfitting',
    search_ph:'Tìm kiểu giày / ART...',btn_reload:'Tải lại',
    stats:(n,m)=>`${n} kiểu giày · ${m} thiếu MP`,
    loading:'Đang tải...',offline:'Máy chủ offline',empty:'Không có dữ liệu',back:'← DS-03',
    detail:'▶ Chi tiết',
  },
};
let currentLang = localStorage.getItem('ie_lang') || 'zh';
let allRecords = [];
let allGroups  = [];
function L(k){ return LANGS[currentLang][k]; }

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('ie_lang', lang);
  const d = LANGS[lang];
  document.getElementById('page-title').textContent  = d.title;
  document.title = d.title;
  document.getElementById('th-season').textContent   = d.col_season;
  document.getElementById('th-model').textContent    = d.col_model;
  document.getElementById('th-arts').textContent     = d.col_arts;
  document.getElementById('th-mat').textContent      = d.col_mat;
  document.getElementById('th-eolr').textContent     = d.col_eolr;
  document.getElementById('th-cut').textContent      = d.col_cut;
  document.getElementById('th-stitch').textContent   = d.col_stitch;
  document.getElementById('th-asm').textContent      = d.col_asm;
  document.getElementById('th-sf').textContent       = d.col_sf;
  document.getElementById('search').placeholder      = d.search_ph;
  document.getElementById('btn-reload').textContent  = d.btn_reload;
  document.getElementById('btn-back').textContent    = d.back;
  document.querySelectorAll('.btn-lang').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  updateStats();
  // Re-render to update detail link text
  if (allGroups.length) renderGroupedTable(allGroups);
}

function fixStickyOffsets(){
  const ph = document.getElementById('page-header').getBoundingClientRect().height;
  const tb = document.getElementById('toolbar').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--ph-h', Math.round(ph) + 'px');
  document.documentElement.style.setProperty('--tb-h', Math.round(tb) + 'px');
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmtModel(name){
  if(!name) return '<span class="model-short" style="color:#aaa">—</span>';
  const short = name.replace(/\s+Target Output.*$/i,'').replace(/\s{2,}/g,' ').trim();
  return `<span class="model-short">${esc(short)}</span>`;
}

function mpText(v){
  if(v===null||v===undefined||parseFloat(v)===0) return '<span class="mp-zero">—</span>';
  return `<span class="mp-val">${parseFloat(v).toFixed(1)}</span>`;
}

function matText(v){
  if(!v) return '<span style="color:#aaa;font-size:11px">—</span>';
  return v.split('/').map(s=>s.trim()).filter(Boolean)
    .map(s=>`<span style="font-size:10px;display:block;line-height:1.5;color:#444">${esc(s)}</span>`).join('');
}

function isMissing(r){
  return !r||((!r.cutting||parseFloat(r.cutting)===0)&&(!r.stitching||parseFloat(r.stitching)===0)&&(!r.assembly||parseFloat(r.assembly)===0));
}

// ── Grouping ──────────────────────────────────────────────────────────────────
function normKey(name){
  return (name||'').replace(/\s+Target Output.*$/i,'').replace(/\s{2,}/g,' ').trim().toLowerCase();
}

function groupByModel(records){
  const map = new Map();
  records.forEach(r=>{
    const key = normKey(r.model_name);
    if(!map.has(key)) map.set(key,{model_name:r.model_name||'',arts:[],mat:'',season:'',r60:null,r120:null,id60:null,id120:null});
    const g = map.get(key);
    (r.arts||[]).forEach(a=>{ if(!g.arts.includes(a)) g.arts.push(a); });
    if(!g.mat && r.material) g.mat = r.material;
    if(!g.season && r.season) g.season = r.season;
    const eolr = parseInt(r.eolr, 10);
    if(eolr===60)  { g.r60=r;  g.id60=r.id; }
    if(eolr===120) { g.r120=r; g.id120=r.id; }
  });
  const groups = [...map.values()];
  groups.sort((a,b)=>normKey(a.model_name).localeCompare(normKey(b.model_name)));
  return groups;
}

// ── Render ────────────────────────────────────────────────────────────────────
function mpRow(r){
  if(!r) return '<td class="mp-cell"><span class="mp-na">—</span></td>'.repeat(4);
  return `<td class="mp-cell">${mpText(r.cutting)}</td>`+
         `<td class="mp-cell">${mpText(r.stitching)}</td>`+
         `<td class="mp-cell">${mpText(r.assembly)}</td>`+
         `<td class="mp-cell">${mpText(r.stock)}</td>`;
}

function renderGroup(g){
  const has60  = !!g.r60;
  const has120 = !!g.r120;
  const both   = has60 && has120;
  const linkId = g.id120 || g.id60 || 0;

  const chips      = g.arts.map(a=>`<span class="art-chip">${esc(a)}</span>`).join('');
  const detailHref = linkId ? `/ie/${linkId}/detail` : '#';
  const detailTxt  = L('detail');

  const seasonVal = esc(g.season||'—');
  const modelVal  = `<a href="/ie/${linkId}" class="model-link">${fmtModel(g.model_name)}</a>`+
    (linkId ? `<br><a href="${detailHref}" class="detail-link">${esc(detailTxt)}</a>` : '');
  const artsVal   = chips || '<span style="color:#aaa;font-size:11px">—</span>';
  const matVal    = matText(g.mat);
  const modelJ    = esc(JSON.stringify(g.model_name));

  function leftCells(rs){
    const r = rs ? ' rowspan="2"' : '';
    return `<td class="season-cell"${r}>${seasonVal}</td>`+
           `<td class="model-cell"${r}>${modelVal}</td>`+
           `<td class="arts-cell"${r}>${artsVal}</td>`+
           `<td class="mat-cell"${r}>${matVal}</td>`;
  }

  let rows = '';

  const isAdmin = CURRENT_USER && CURRENT_USER.role === 'admin';
  const menuId  = `menu-${linkId}`;
  const actBtn  = isAdmin
    ? `<button class="btn-add-rec" onclick="toggleMenu('${menuId}',${linkId},${modelJ},event)" title="操作">···</button>`
    : '';
  const actMenu = isAdmin
    ? `<div id="${menuId}" class="row-menu" style="display:none">
        <div onclick="addArtToModel(${linkId},${modelJ})">＋ 新增 ART</div>
        <div onclick="removeArtFromModel(${linkId})">－ 移除 ART</div>
        <div onclick="changeEolrModal(${linkId})">⇄ 修改 EOLR</div>
        <div onclick="openAssignModal(${linkId},${modelJ})">👤 指派帳號</div>
        <div onclick="delIeRecord(${linkId})" style="color:#c62828">✕ 刪除鞋型</div>
       </div>`
    : '';

  if(has60){
    const rs = both ? ' rowspan="2"' : '';
    rows += `<tr class="tr-eolr ${both ? 'tr-model-first' : 'tr-single'}">
      <td class="act-cell"${rs} style="position:relative">${actBtn}${actMenu}</td>
      ${leftCells(both)}
      <td class="eolr-cell"><span class="eolr-60">60</span></td>
      ${mpRow(g.r60)}
    </tr>`;
  }

  if(has120){
    rows += `<tr class="tr-eolr ${both ? 'tr-model-second' : 'tr-single'}">
      ${!has60 ? `<td class="act-cell" style="position:relative">${actBtn}${actMenu}${leftCells(false)}` : ''}
      <td class="eolr-cell"><span class="eolr-120">120</span></td>
      ${mpRow(g.r120)}
    </tr>`;
  }

  if(!has60 && !has120){
    rows = `<tr class="tr-eolr tr-single">
      <td class="act-cell" style="position:relative">${actBtn}${actMenu}</td>
      ${leftCells(false)}
      <td class="eolr-cell">—</td>
      <td class="mp-cell" colspan="4"><span class="mp-na">—</span></td>
    </tr>`;
  }

  return rows;
}

function updateStats(){
  if(!allGroups.length){ document.getElementById('stats').textContent='—'; return; }
  const missing = allGroups.filter(g=>isMissing(g.r60)&&isMissing(g.r120)).length;
  document.getElementById('stats').textContent = L('stats')(allGroups.length, missing);
}

// ── Data ──────────────────────────────────────────────────────────────────────
async function loadData(){
  document.getElementById('ie-tbody').innerHTML=`<tr><td colspan="10" class="loading">${esc(L('loading'))}</td></tr>`;
  try{
    const res  = await fetch('/api/ie/list');
    const data = await res.json();
    allRecords = data.ok ? (data.records||[]) : [];
    allGroups  = groupByModel(allRecords);
    renderGroupedTable(allGroups);
    updateStats();
    fixStickyOffsets();
  }catch(e){
    document.getElementById('ie-tbody').innerHTML=`<tr><td colspan="10" class="empty">${esc(L('offline'))}</td></tr>`;
  }
}

function renderGroupedTable(groups){
  const tbody = document.getElementById('ie-tbody');
  if(!groups.length){ tbody.innerHTML=`<tr><td colspan="10" class="empty">${esc(L('empty'))}</td></tr>`; return; }
  tbody.innerHTML = groups.map(renderGroup).join('');
}

function filterTable(){
  const q = document.getElementById('search').value.toLowerCase();
  if(!q){ renderGroupedTable(allGroups); return; }
  const filtered = allRecords.filter(r=>
    (r.model_name||'').toLowerCase().includes(q)||
    (r.arts||[]).some(a=>a.toLowerCase().includes(q))
  );
  renderGroupedTable(groupByModel(filtered));
}

// ── Auth ─────────────────────────────────────────────────────────────────────
let CURRENT_USER = null;

async function initAuth(){
  try{
    const r = await fetch('/api/me');
    const d = await r.json();
    CURRENT_USER = d.ok ? d.user : null;
  }catch{ CURRENT_USER = null; }
  const badge = document.getElementById('user-badge');
  const logoutBtn = document.getElementById('btn-logout');
  const newBtn = document.getElementById('btn-new-model');
  if(CURRENT_USER){
    badge.textContent = CURRENT_USER.display_name || CURRENT_USER.username;
    logoutBtn.style.display = 'inline';
    if(CURRENT_USER.role === 'admin') newBtn.style.display = 'inline-block';
  }
}

async function doLogout(){
  await fetch('/api/logout', {method:'POST'});
  window.location.href = '/login';
}

// ── Row menu ──────────────────────────────────────────────────────────────────
function toggleMenu(menuId, headerId, modelName, ev){
  ev.stopPropagation();
  document.querySelectorAll('.row-menu').forEach(m=>{ if(m.id!==menuId) m.style.display='none'; });
  const m = document.getElementById(menuId);
  if(!m) return;
  m.style.display = m.style.display==='none' ? 'block' : 'none';
}
document.addEventListener('click', ()=>document.querySelectorAll('.row-menu').forEach(m=>m.style.display='none'));

// ── Actions ───────────────────────────────────────────────────────────────────
async function addIeRecord(modelName){
  const art = prompt(`新增 ART（鞋型：${modelName}）：`);
  if(!art || !art.trim()) return;
  const eolrStr = prompt('EOLR（60 或 120）：','120');
  const eolr = parseInt(eolrStr);
  if(![60,120].includes(eolr)){ alert('EOLR 只能是 60 或 120'); return; }
  const r = await fetch('/api/ie/create_record',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({art:art.trim(), model_name:modelName, eolr}),
  });
  const j = await r.json();
  if(j.ok) loadData();
  else alert('新增失敗：'+(j.error||''));
}

async function addArtToModel(headerId, modelName){
  const art = prompt(`新增 ART（鞋型：${modelName}）：`);
  if(!art||!art.trim()) return;
  const r = await fetch('/api/ie/add_art',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({header_id:headerId, art:art.trim()})});
  const j = await r.json();
  if(j.ok) loadData(); else alert('新增失敗：'+(j.error||''));
}

async function removeArtFromModel(headerId){
  const art = prompt('輸入要移除的 ART 號碼：');
  if(!art||!art.trim()) return;
  if(!confirm(`確認移除 ${art.trim()} ？`)) return;
  const r = await fetch('/api/ie/remove_art',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({header_id:headerId, art:art.trim()})});
  const j = await r.json();
  if(j.ok) loadData(); else alert('移除失敗：'+(j.error||''));
}

async function changeEolrModal(headerId){
  const eolrStr = prompt('新的 EOLR（60 或 120）：','120');
  const eolr = parseInt(eolrStr);
  if(![60,120].includes(eolr)){ alert('EOLR 只能是 60 或 120'); return; }
  const r = await fetch(`/api/ie/${headerId}/update_eolr`,{method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({eolr})});
  const j = await r.json();
  if(j.ok) loadData(); else alert('修改失敗：'+(j.error||''));
}

async function delIeRecord(id){
  if(!confirm('確認刪除此鞋型記錄？此操作不可復原。')) return;
  const r = await fetch('/api/ie/'+id+'/delete',{method:'POST'});
  const j = await r.json();
  if(j.ok) loadData();
  else alert('刪除失敗：'+(j.error||''));
}

// ── New Model Modal ────────────────────────────────────────────────────────────
function openNewModelModal(){
  document.getElementById('nm-name').value='';
  document.getElementById('nm-art').value='';
  document.getElementById('nm-season').value='';
  document.getElementById('nm-msg').textContent='';
  document.getElementById('modal-new-model').style.display='flex';
  document.getElementById('nm-name').focus();
}
function closeNewModelModal(){ document.getElementById('modal-new-model').style.display='none'; }
async function submitNewModel(){
  const name   = document.getElementById('nm-name').value.trim();
  const art    = document.getElementById('nm-art').value.trim();
  const eolr   = parseInt(document.getElementById('nm-eolr').value);
  const season = document.getElementById('nm-season').value.trim();
  const msg    = document.getElementById('nm-msg');
  if(!name||!art){ msg.textContent='鞋型名稱和ART不能空白'; return; }
  const r = await fetch('/api/ie/create_record',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({art, model_name:name, eolr})});
  const j = await r.json();
  if(j.ok){
    if(season){
      await fetch(`/api/ie/${j.header_id}/update_season`,{method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify({season})});
    }
    closeNewModelModal();
    loadData();
  } else { msg.textContent = j.error||'建立失敗'; }
}

// ── Assign Modal ────────────────────────────────────────────────────────────────
let _assignHeaderId = null, _assignModelName = '';
async function openAssignModal(headerId, modelName){
  _assignHeaderId = headerId; _assignModelName = modelName;
  document.getElementById('assign-model-name').textContent = modelName;
  document.getElementById('assign-title').textContent = `指派鞋型 — ${modelName}`;
  const [assignRes, usersRes] = await Promise.all([
    fetch(`/api/ie/${headerId}/assignments`).then(r=>r.json()),
    fetch('/api/users').then(r=>r.json()),
  ]);
  // Current assignments
  const listEl = document.getElementById('assign-list');
  const assignments = assignRes.assignments||[];
  listEl.innerHTML = assignments.length
    ? assignments.map(a=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0">
        <span>${esc(a.display_name)} (${esc(a.username)})</span>
        <button onclick="doUnassign(${headerId},${a.user_id})" style="background:none;border:none;color:#c62828;cursor:pointer;font-size:12px">移除</button>
      </div>`).join('')
    : '<span style="color:#aaa;font-size:12px">（尚未指派）</span>';
  // User dropdown — only data_entry
  const sel = document.getElementById('assign-user-sel');
  const editors = (usersRes.users||[]).filter(u=>u.role==='data_entry'&&u.active&&!assignments.find(a=>a.user_id===u.id));
  sel.innerHTML = '<option value="">— 選擇資料建立帳號 —</option>' +
    editors.map(u=>`<option value="${u.id}">${esc(u.display_name)} (${esc(u.username)})</option>`).join('');
  document.getElementById('modal-assign').style.display='flex';
}
function closeAssignModal(){ document.getElementById('modal-assign').style.display='none'; }
async function doUnassign(headerId, userId){
  const r = await fetch(`/api/ie/${headerId}/unassign`,{method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({user_id:userId})});
  const j = await r.json();
  if(j.ok) openAssignModal(headerId, _assignModelName);
}
async function submitAssign(){
  const uid = parseInt(document.getElementById('assign-user-sel').value);
  if(!uid){ alert('請選擇帳號'); return; }
  const r = await fetch(`/api/ie/${_assignHeaderId}/assign`,{method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({user_id:uid})});
  const j = await r.json();
  if(j.ok) openAssignModal(_assignHeaderId, _assignModelName);
  else alert('指派失敗：'+(j.error||''));
}

// ── Health check ──────────────────────────────────────────────────────────────
let _healthTimer = null;

async function _doFetch(){
  const ctrl = new AbortController();
  const tid = setTimeout(()=>ctrl.abort(), 5000);
  try{
    const r = await fetch('/api/health', {signal:ctrl.signal});
    clearTimeout(tid);
    return !!(await r.json()).ok;
  }catch(e){ clearTimeout(tid); return false; }
}

async function checkHealth(){
  let ok = await _doFetch();
  if(!ok){ await new Promise(r=>setTimeout(r,2000)); ok = await _doFetch(); }
  const dot = document.getElementById('status-dot');
  const btn = document.getElementById('btn-reconnect');
  dot.style.background = ok ? '#22c55e' : '#ef4444';
  dot.title = ok ? '伺服器正常' : '伺服器離線';
  if(btn) btn.style.display = ok ? 'none' : 'inline-block';
  if(_healthTimer) clearTimeout(_healthTimer);
  _healthTimer = setTimeout(checkHealth, 30000);
}

async function reconnect(){
  const dot = document.getElementById('status-dot');
  const btn = document.getElementById('btn-reconnect');
  dot.style.background = '#f59e0b'; dot.title = '連線中...';
  if(btn) btn.style.display = 'none';
  await checkHealth();
  loadData();
}

setLang(currentLang);
fixStickyOffsets();
initAuth().then(()=>loadData());
checkHealth();
</script>
