<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>設備種類管理</title>
<style>
  :root{--line:#e4e9f2;--ink:#1d1d1f;--mut:#8a8a8e;--blue:#0066cc}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Microsoft JhengHei",sans-serif;color:var(--ink);background:#f5f5f7}
  .hdr{background:#1a2744;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
  .hdr h1{font-size:16px;margin:0;font-weight:600}
  .hdr a{color:#cdd6f4;font-size:13px;text-decoration:none}
  .wrap{max-width:820px;margin:20px auto;padding:0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mut);font-weight:600;font-size:12px}
  .so-inp{width:56px;padding:3px 5px;border:1px solid #c7c7cc;border-radius:5px;font-size:13px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .btn:hover{background:#f0f4fb}
  .btn-pri{background:#1a2744;color:#fff;border-color:#1a2744}
  .btn-danger{color:#c0392b;border-color:#f0c9c4}
  .btn[disabled]{opacity:.4;cursor:not-allowed;background:#f3f3f3}
  .badge{font-size:11px;padding:2px 7px;border-radius:10px}
  .b-on{background:#e5f6ec;color:#1d9e6b}.b-off{background:#f0f0f0;color:#8a8a8e}
  .ref{font-size:11px;color:#b26a00}
  .add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .add-row input{padding:6px 8px;border:1px solid #c7c7cc;border-radius:6px;font-size:13px}
  .msg{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;display:none}
  .msg.err{background:#fdecea;color:#b71c1c;display:block}
  .msg.ok{background:#e8f5e9;color:#1b5e20;display:block}
  #denied{display:none;padding:40px;text-align:center;color:#b71c1c;font-size:15px}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;display:none}
</style>
<div class="hdr">
  <h1>⚙ 設備種類管理</h1>
  <a href="/ie">← 返回 IE 清單</a>
</div>
<div class="wrap">
  <div id="denied">您沒有權限使用此頁（限 manager／admin）。</div>
  <div id="app" style="display:none">
    <div id="msg" class="msg"></div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:10px">新增設備種類</div>
      <div class="add-row">
        <input id="newName" placeholder="名稱（例：三針針車機）" style="min-width:200px">
        <input id="newSort" type="number" placeholder="排序" style="width:90px" value="0">
        <button class="btn btn-pri" onclick="addType()">＋ 新增</button>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th style="width:70px">排序</th><th>名稱</th><th style="width:70px">狀態</th><th style="width:130px">引用</th><th style="width:230px">操作</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p style="color:var(--mut);font-size:12px;line-height:1.7">
      規則：已被工序引用的設備種類＝<b>名稱鎖定不可改、不可刪除，只能停用</b>；未引用的可改名、可刪除。
      停用＝IE 細表下拉不再出現該項，既有資料照常顯示（細表重新載入後生效）。
    </p>
  </div>
</div>
<div id="toast"></div>
<script>
let ROLE = null;
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._tm);t._tm=setTimeout(()=>t.style.display='none',2200);}
function showMsg(m,ok){const e=document.getElementById('msg');e.textContent=m;e.className='msg '+(ok?'ok':'err');setTimeout(()=>{e.className='msg';},4000);}

async function init(){
  let role=null;
  try{ const d=await fetch('/api/me').then(r=>r.json()); role=d&&d.user&&d.user.role; }catch{}
  ROLE=role;
  if(!(role==='admin'||role==='manager')){ document.getElementById('denied').style.display='block'; return; }
  document.getElementById('app').style.display='block';
  load();
}

async function load(){
  const d=await fetch('/api/equipment_types/admin').then(r=>r.json()).catch(()=>({ok:false}));
  if(!d.ok){ showMsg('載入失敗：'+(d.error||''),false); return; }
  const tb=document.getElementById('tbody'); tb.innerHTML='';
  (d.options||[]).forEach(o=>{
    const referenced=o.ref_count>0;
    const tr=document.createElement('tr');
    const renameBtn = referenced
      ? `<button class="btn" disabled title="已被 ${o.ref_count} 道工序使用，名稱鎖定">改名</button>`
      : `<button class="btn" onclick="renameType(${o.id},'${esc(o.name)}')">改名</button>`;
    const delBtn = referenced
      ? `<button class="btn btn-danger" disabled title="已被 ${o.ref_count} 道工序使用，不可刪除">刪除</button>`
      : `<button class="btn btn-danger" onclick="delType(${o.id},'${esc(o.name)}')">刪除</button>`;
    const toggleBtn = `<button class="btn" onclick="toggleActive(${o.id},${o.active?0:1})">${o.active?'停用':'啟用'}</button>`;
    tr.innerHTML =
      `<td><input class="so-inp" type="number" value="${o.sort_order}" onchange="reorder(${o.id},this.value)"></td>`+
      `<td>${esc(o.name)}${referenced?` <span class="ref">🔒 已被 ${o.ref_count} 道使用</span>`:''}</td>`+
      `<td><span class="badge ${o.active?'b-on':'b-off'}">${o.active?'啟用':'停用'}</span></td>`+
      `<td>${referenced?`<span class="ref">${o.ref_count} 道工序</span>`:'<span style="color:#8a8a8e;font-size:12px">未引用</span>'}</td>`+
      `<td style="white-space:nowrap">${renameBtn} ${toggleBtn} ${delBtn}</td>`;
    tb.appendChild(tr);
  });
}

async function addType(){
  const name=document.getElementById('newName').value.trim();
  const sort=parseInt(document.getElementById('newSort').value)||0;
  if(!name){ showMsg('請輸入名稱',false); return; }
  const r=await fetch('/api/equipment_types',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,sort_order:sort})}).then(r=>r.json());
  if(r.ok){ document.getElementById('newName').value=''; toast('已新增 ✓'); load(); }
  else showMsg('新增失敗：'+(r.error||''),false);
}
async function renameType(id,cur){
  const nn=prompt('新名稱：',cur); if(nn==null) return;
  const name=nn.trim(); if(!name||name===cur) return;
  const res=await fetch('/api/equipment_types/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  const r=await res.json();
  if(res.ok&&r.ok){ toast('已改名 ✓'); load(); }
  else showMsg((res.status===409?'名稱鎖定：':'改名失敗：')+(r.error||''),false);
}
async function reorder(id,val){
  const r=await fetch('/api/equipment_types/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({sort_order:parseInt(val)||0})}).then(r=>r.json());
  if(r.ok){ toast('排序已更新'); load(); } else showMsg('排序失敗：'+(r.error||''),false);
}
async function toggleActive(id,active){
  const r=await fetch('/api/equipment_types/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({active})}).then(r=>r.json());
  if(r.ok){ toast(active?'已啟用':'已停用'); load(); } else showMsg('操作失敗：'+(r.error||''),false);
}
async function delType(id,name){
  if(!confirm(`確定刪除設備種類「${name}」？此操作無法復原。`)) return;
  const res=await fetch('/api/equipment_types/'+id,{method:'DELETE'});
  const r=await res.json();
  if(res.ok&&r.ok){ toast('已刪除 ✓'); load(); }
  else showMsg((res.status===409?'不可刪除：':'刪除失敗：')+(r.error||''),false);
}
init();
</script>
