<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IE Matrix — ART × Sheet 矩陣</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f0f2f5; color: #1a2744; font-size: 13px; }
  .topbar { background: #1a2744; color: #fff; padding: 12px 20px;
            display: flex; align-items: center; gap: 16px; }
  .topbar h1 { font-size: 16px; font-weight: 600; }
  .topbar a { color: #8fa8d8; text-decoration: none; font-size: 12px; }
  .topbar a:hover { color: #fff; }

  /* Stats */
  .stats { background: #fff; padding: 10px 20px; border-bottom: 1px solid #e0e4ea;
           display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .stat { font-size: 12px; color: #666; }
  .stat strong { color: #1a2744; font-size: 15px; }
  .stat.danger strong { color: #c0392b; }
  .stat.ok strong { color: #27ae60; }
  .stat.warn strong { color: #e67e22; }

  /* No-IE section */
  .no-ie-section { background: #fff8f0; border-bottom: 2px solid #e8a000; padding: 12px 20px; }
  .no-ie-section h2 { font-size: 13px; font-weight: 700; color: #8b4400; margin-bottom: 8px; }
  .no-ie-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .no-ie-tag { background: #fce8c3; border: 1px solid #e8a000; color: #7a3a00;
               border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
  .no-ie-tag span { font-weight: 400; color: #999; font-size: 11px; margin-left: 4px; }

  /* Filter bar */
  .filter-bar { background: #fff; padding: 8px 20px; border-bottom: 1px solid #e0e4ea;
                display: flex; gap: 12px; align-items: center; }
  .filter-bar input { padding: 5px 10px; border: 1px solid #d0d4da; border-radius: 6px;
                      font-size: 12px; width: 200px; }
  .filter-bar label { font-size: 12px; color: #666; display: flex; align-items: center; gap: 4px; }

  /* Table */
  .table-wrap { overflow: auto; max-height: calc(100vh - 200px); padding: 0 4px; }
  table { border-collapse: collapse; white-space: nowrap; margin: 8px; }
  thead th { background: #1a2744; color: #fff; padding: 6px 8px; font-size: 11px;
             font-weight: 600; position: sticky; top: 0; z-index: 10;
             border: 1px solid #2a3a6a; min-width: 80px; }
  thead th:first-child { min-width: 100px; position: sticky; left: 0; z-index: 20; }
  thead th:nth-child(2) { min-width: 70px; position: sticky; left: 100px; z-index: 20; }
  tbody tr:nth-child(even) { background: #f8f9fb; }
  tbody tr:hover { background: #e8eef7; }
  td { padding: 4px 8px; border: 1px solid #e0e4ea; font-size: 12px; }
  td:first-child { position: sticky; left: 0; background: inherit; z-index: 5;
                   font-weight: 600; color: #1a2744; }
  td:nth-child(2) { position: sticky; left: 100px; background: inherit; z-index: 5;
                    color: #666; font-size: 11px; }
  .cell-ok   { background: #d4edda !important; color: #155724; text-align: center; cursor: pointer; }
  .cell-ok:hover { background: #b8dfc5 !important; }
  .cell-miss { background: #f8d7da !important; color: #721c24; text-align: center; font-weight: 700; cursor: pointer; }
  .cell-miss:hover { background: #f0bec2 !important; }
  .cell-na   { background: #f5f5f5 !important; color: #bbb; text-align: center; }

  /* Detail panel */
  .detail-panel { display: none; position: fixed; right: 0; top: 0; width: 360px; height: 100vh;
                  background: #fff; border-left: 2px solid #1a2744;
                  box-shadow: -4px 0 16px rgba(0,0,0,0.12); z-index: 100;
                  overflow-y: auto; padding: 20px; }
  .detail-panel.open { display: block; }
  .detail-close { float: right; cursor: pointer; font-size: 18px; color: #666; }
  .detail-close:hover { color: #c0392b; }
  .detail-art   { font-size: 18px; font-weight: 700; color: #1a2744; margin-bottom: 4px; }
  .detail-model { font-size: 12px; color: #666; margin-bottom: 16px; }
  .detail-section { margin-bottom: 16px; }
  .detail-section h3 { font-size: 13px; font-weight: 600; color: #1a2744;
                       border-bottom: 1px solid #e0e4ea; padding-bottom: 4px; margin-bottom: 8px; }
  .sheet-tag { display: inline-block; padding: 2px 8px; border-radius: 12px;
               font-size: 11px; margin: 2px; }
  .sheet-tag.ok   { background: #d4edda; color: #155724; }
  .sheet-tag.miss { background: #f8d7da; color: #721c24; }
  .pending-badge { background: #fff3cd; border: 1px solid #ffc107; color: #856404;
                   border-radius: 6px; padding: 6px 10px; font-size: 12px; margin-bottom: 8px;
                   display: inline-block; }
  .loading { text-align: center; padding: 40px; color: #888; font-size: 14px; }
  .err { text-align: center; padding: 40px; color: #c0392b; font-size: 14px; }
</style>
</head>
<body>
<div class="topbar">
  <h1>IE Matrix — ART × Sheet 矩陣</h1>
  <a href="/ie">← IE 列表</a>
  <a href="/">← 首頁</a>
</div>

<div class="stats" id="stats-bar">
  <div class="stat">載入中...</div>
</div>

<div id="no-ie-section" style="display:none"></div>

<div class="filter-bar">
  <input type="text" id="filter-art" placeholder="篩選 ART / 鞋型名稱..." oninput="applyFilter()">
  <label><input type="checkbox" id="show-missing-only" onchange="applyFilter()"> 只顯示有缺口的行</label>
</div>

<div class="table-wrap" id="table-wrap">
  <div class="loading" id="loading-msg">載入矩陣資料中…</div>
</div>

<div class="detail-panel" id="detail-panel">
  <span class="detail-close" onclick="closeDetail()">✕</span>
  <div class="detail-art" id="dp-art"></div>
  <div class="detail-model" id="dp-model"></div>
  <div id="dp-pending-badge"></div>
  <div class="detail-section">
    <h3>已有 sheets</h3>
    <div id="dp-has"></div>
  </div>
  <div class="detail-section">
    <h3>缺少 sheets（待補）</h3>
    <div id="dp-miss"></div>
  </div>
  <div class="detail-section">
    <h3>操作</h3>
    <a id="dp-link" href="#" target="_blank" style="font-size:12px;color:#1a5276;">
      → 開啟 IE 詳情頁（新分頁）
    </a>
  </div>
</div>

<script>
let matrixData = null;

async function loadMatrix() {
  try {
    const r = await fetch('/api/ie/matrix');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'API error');
    matrixData = d;
    renderStats(d.stats);
    renderNoIE(d.no_data_arts || []);
    renderTable(d);
  } catch(e) {
    document.getElementById('loading-msg').className = 'err';
    document.getElementById('loading-msg').textContent = '載入失敗: ' + e.message;
  }
}

function renderStats(s) {
  const bar = document.getElementById('stats-bar');
  bar.innerHTML = `
    <div class="stat">總 ART 數：<strong>${s.total_arts}</strong></div>
    <div class="stat danger">無 IE 資料：<strong>${s.no_ie_count}</strong> 個</div>
    <div class="stat warn">缺口：<strong>${s.gaps}</strong> 格</div>
    <div class="stat ok">完成率：<strong>${s.completion_pct}%</strong></div>
  `;
}

function renderNoIE(arts) {
  const sec = document.getElementById('no-ie-section');
  if (!arts.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  const tags = arts.map(a =>
    `<div class="no-ie-tag" title="${a.model}">${a.art}<span>EOLR ${a.eolr}</span></div>`
  ).join('');
  sec.innerHTML = `
    <h2>⚠ 無IE資料清單（${arts.length} 個 ART — 需建整份IE）</h2>
    <div class="no-ie-list">${tags}</div>
  `;
}

function renderTable(d) {
  const wrap = document.getElementById('table-wrap');
  document.getElementById('loading-msg')?.remove();

  const table = document.createElement('table');
  table.id = 'matrix-table';

  // Header row
  const thead = table.createTHead();
  const hrow = thead.insertRow();
  addTh(hrow, 'ART');
  addTh(hrow, 'EOLR');
  d.types.forEach(t => {
    const th = document.createElement('th');
    th.textContent = t.display;
    th.title = t.key;
    hrow.appendChild(th);
  });

  // Body
  const tbody = table.createTBody();
  d.rows.forEach((row, ri) => {
    const tr = tbody.insertRow();
    tr.dataset.ri = ri;
    tr.dataset.art = row.art.toLowerCase();
    tr.dataset.model = (row.model || '').toLowerCase();

    const td1 = tr.insertCell(); td1.textContent = row.art;
    const td2 = tr.insertCell(); td2.textContent = row.eolr;

    let hasMissing = false;
    row.cells.forEach((cell, ci) => {
      const td = tr.insertCell();
      const typeName = d.types[ci].display;
      if (cell.status === 'has_data') {
        td.textContent = '✓';
        td.className = 'cell-ok';
        td.title = `${typeName} — 有資料（點擊開啟IE詳情頁）`;
        td.onclick = () => window.open('/ie/' + row.header_id, '_blank');
      } else if (cell.status === 'missing') {
        td.textContent = '✗';
        td.className = 'cell-miss';
        td.title = `${typeName} — 缺少（點擊查看詳情）`;
        td.onclick = () => openDetail(row, d.types, typeName);
        hasMissing = true;
      } else {
        td.textContent = '－';
        td.className = 'cell-na';
        td.title = `${typeName} — 不適用`;
      }
    });

    tr.dataset.missing = hasMissing ? '1' : '0';
  });

  wrap.innerHTML = '';
  wrap.appendChild(table);
}

function addTh(row, text) {
  const th = document.createElement('th');
  th.textContent = text;
  row.appendChild(th);
}

function applyFilter() {
  if (!matrixData) return;
  const q = document.getElementById('filter-art').value.toLowerCase();
  const missOnly = document.getElementById('show-missing-only').checked;
  const table = document.getElementById('matrix-table');
  if (!table) return;
  Array.from(table.tBodies[0].rows).forEach(tr => {
    const art = tr.dataset.art || '';
    const model = tr.dataset.model || '';
    const missing = tr.dataset.missing === '1';
    let show = true;
    if (q && !art.includes(q) && !model.includes(q)) show = false;
    if (missOnly && !missing) show = false;
    tr.style.display = show ? '' : 'none';
  });
}

function openDetail(row, types, clickedType) {
  document.getElementById('dp-art').textContent = row.art;
  document.getElementById('dp-model').textContent = `${row.model} (EOLR ${row.eolr})`;
  document.getElementById('dp-link').href = '/ie/' + row.header_id;

  const missingTypes = types.filter((t, i) => row.cells[i].status === 'missing').map(t => t.display);
  const badge = document.getElementById('dp-pending-badge');
  if (missingTypes.length) {
    badge.innerHTML = `<span class="pending-badge">待補 ${missingTypes.length} 個 sheet</span>`;
  } else {
    badge.innerHTML = '';
  }

  const hasDiv  = document.getElementById('dp-has');
  const missDiv = document.getElementById('dp-miss');
  hasDiv.innerHTML = '';
  missDiv.innerHTML = '';

  row.cells.forEach((cell, i) => {
    const t = types[i];
    const tag = document.createElement('span');
    tag.className = 'sheet-tag ' + (cell.status === 'has_data' ? 'ok' : cell.status === 'missing' ? 'miss' : '');
    tag.textContent = t.display;
    if (cell.status === 'has_data') hasDiv.appendChild(tag);
    else if (cell.status === 'missing') missDiv.appendChild(tag);
  });

  if (!hasDiv.children.length) hasDiv.textContent = '（無）';
  if (!missDiv.children.length) missDiv.textContent = '（無）';

  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}

loadMatrix();
</script>
</body>
</html>
