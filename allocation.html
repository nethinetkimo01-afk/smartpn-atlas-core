<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>勾選分配系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.topbar{background:#1a2744;color:#fff;padding:9px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.title{font-size:15px;font-weight:700;white-space:nowrap}
.spacer{flex:1}
.who{font-size:11px;background:#243356;border-radius:6px;padding:5px 10px;color:#b0c4de;display:flex;align-items:center;gap:8px}
.who b{color:#fff}
.role-admin{color:#4ade80}.role-unit{color:#fbbf24}
select,.btn{font-family:inherit}
select{background:#0f1e38;color:#fff;border:1px solid #3a4f72;border-radius:5px;padding:5px 8px;font-size:12px;outline:none}
.btn{background:#1d9e6b;color:#fff;border:none;border-radius:5px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.btn:hover{background:#178059}
.btn.red{background:#c62828}.btn.red:hover{background:#b71c1c}
.btn.ghost{background:transparent;border:1px solid #3a4f72;color:#b0c4de}
.btn.ghost:hover{background:#243356}
.btn.orange{background:#e65100;color:#fff}.btn.orange:hover{background:#bf360c}
.toolbar{background:#fff;border-bottom:1px solid #e4e9f2;padding:8px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:44px;z-index:90}
.tl-label{font-size:11px;color:#888;font-weight:600}
.lock-badge{font-size:11px;padding:3px 10px;border-radius:4px;font-weight:600}
.lock-badge.locked{background:#fce4ec;color:#c62828;border:1px solid #f8bbd0}
.lock-badge.unlocked{background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9}

/* Unit tabs */
.unit-tabs{display:flex;gap:0;background:#e8eef8;border-radius:6px;overflow:hidden;border:1px solid #c5d0e0}
.unit-tab{padding:6px 20px;font-size:12px;font-weight:600;cursor:pointer;color:#4a6896;transition:.15s;white-space:nowrap}
.unit-tab.active{background:#1a2744;color:#fff}
.unit-tab.disabled{opacity:.35;cursor:not-allowed}
.unit-tab:not(.active):not(.disabled):hover{background:#d4dff5}

/* content */
.content{padding:14px 18px;display:flex;flex-direction:column;gap:16px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* LEAN group */
.lean-group{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.09);overflow:hidden;margin-bottom:14px}
.lean-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0f1e38;color:#fff;cursor:pointer;user-select:none}
.lean-badge{font-size:13px;font-weight:700;background:#1d9e6b;border-radius:5px;padding:3px 10px}
.lean-head .spacer{flex:1}
.lean-stats{display:flex;gap:18px;font-size:12px}
.lstat{display:flex;flex-direction:column;align-items:flex-end}
.lstat-label{font-size:10px;color:#7a9bcc}
.lstat-val{font-weight:700;font-family:Consolas,monospace}
.lstat.move .lstat-val{color:#4ade80}
.lstat.csa  .lstat-val{color:#fbbf24}
.lean-toggle{font-size:14px;color:#7a9bcc;transition:transform .2s}
.lean-toggle.open{transform:rotate(90deg)}
.lean-body{display:none}
.lean-body.open{display:block}

/* Model section */
.model-sec{border-bottom:1px solid #e4e9f2}
.model-sec:last-child{border-bottom:none}
.model-head{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#f5f7fc;border-bottom:1px solid #e4e9f2;flex-wrap:wrap}
.model-name{font-size:13px;font-weight:700;color:#1a2744}
.art-list{font-size:11px;color:#5a7099}
.badge-out{display:inline-block;font-size:10px;background:#ff9800;color:#fff;border-radius:3px;padding:1px 5px;margin-left:4px}
.order-tag{font-size:11px;color:#555;background:#f0f4ff;border:1px solid #dde3f2;border-radius:4px;padding:2px 8px}
.eolr-tag{font-size:10px;background:#e8eefc;color:#3a5ce7;border-radius:3px;padding:2px 7px;font-weight:600}
.art-stats{margin-left:auto;display:flex;gap:14px;font-size:11px}
.astat{display:flex;flex-direction:column;align-items:flex-end}
.astat-label{font-size:10px;color:#888}
.astat-val{font-weight:700;font-family:Consolas,monospace}
.astat.move .astat-val{color:#1d7340}
.astat.csa  .astat-val{color:#c84b00}

/* Tables */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:600px}
th{background:#243356;color:#c8d8f0;padding:6px 8px;text-align:left;font-size:10px;font-weight:600;white-space:nowrap}
th.num,td.num{text-align:right;font-family:Consolas,monospace}
th.ctr,td.ctr{text-align:center}
td{padding:5px 8px;border-bottom:1px solid #eef1f7;vertical-align:middle}
tr:hover td{background:#f7faff}
.dash{color:#c0c8d8}
.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap}
.chk input{width:14px;height:14px;cursor:pointer;accent-color:#1d7340}
.chk.move{color:#1d7340}.chk.csa{color:#888}
.chk.disabled{opacity:.4;cursor:not-allowed}
.csa-lock{font-size:11px;color:#999;background:#f0f0f0;border-radius:3px;padding:2px 7px}
tr.locked-row td{background:#fafafa;color:#aaa}

/* LEAN footer */
.lean-footer{display:flex;gap:0;background:#0f1e38;font-size:12px}
.lf-cell{padding:9px 18px;display:flex;flex-direction:column}
.lf-label{font-size:10px;color:#7a9bcc;font-weight:600}
.lf-val{font-family:Consolas,monospace;font-weight:700;font-size:13px}
.lf-cell.move .lf-val{color:#4ade80}
.lf-cell.csa  .lf-val{color:#fbbf24}
.lf-sep{width:1px;background:#243356;margin:8px 0}

/* misc */
.empty{padding:40px;text-align:center;color:#999}
.warn{background:#fff8e1;border:1px solid #ffe0a3;border-radius:8px;padding:10px 14px;font-size:12px;color:#8a6d3b;margin:0 0 12px}
.login-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:300}
.login-box{background:#fff;border-radius:12px;padding:24px;width:340px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.login-box h2{font-size:16px;margin-bottom:6px;color:#1a2744}
.login-box p{font-size:12px;color:#888;margin-bottom:16px}
.login-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e4e9f2;border-radius:8px;margin-bottom:8px;cursor:pointer}
.login-user:hover{background:#f5f7fc;border-color:#4a6cf7}
.login-user .lu-name{font-weight:600;font-size:13px}
.login-user .lu-role{font-size:11px;color:#888;margin-left:auto}
</style>
</head>
<body>

<div class="topbar">
  <div class="title">勾選分配系統</div>
  <div class="spacer"></div>
  <div class="who" id="who">未登入</div>
  <button class="btn ghost" id="prefillBtn" style="display:none" onclick="doPrefill()">預填 IE (admin)</button>
  <button class="btn orange" id="lockBtn" style="display:none" onclick="toggleLock()">確認鎖定</button>
  <button class="btn ghost" onclick="logout()">切換身份</button>
</div>

<div class="toolbar">
  <span class="tl-label">月份</span>
  <select id="monthSel" onchange="onMonthChange()"></select>
  <span class="tl-label">LEAN</span>
  <select id="leanSel" onchange="loadAll()"><option value="">全部</option></select>
  <div class="unit-tabs" id="unitTabs">
    <div class="unit-tab" data-unit="同材共裁自動化" onclick="switchTab('同材共裁自動化')">同材共裁</div>
    <div class="unit-tab" data-unit="電腦針車折邊" onclick="switchTab('電腦針車折邊')">電腦針車</div>
    <div class="unit-tab" data-unit="打粗水洗照射" onclick="switchTab('打粗水洗照射')">打粗水洗</div>
  </div>
  <div class="spacer"></div>
  <span id="lockBadge"></span>
</div>

<div class="content">
  <div id="warnArea"></div>
  <div id="tab-同材共裁自動化" class="tab-panel"><div class="empty">載入中…</div></div>
  <div id="tab-電腦針車折邊"   class="tab-panel"><div class="empty">載入中…</div></div>
  <div id="tab-打粗水洗照射"   class="tab-panel"><div class="empty">載入中…</div></div>
</div>

<!-- Login modal -->
<div class="login-modal" id="loginModal" style="display:none">
  <div class="login-box">
    <h2>選擇身份</h2>
    <p>Phase 1 Demo — 直接選身份（無密碼）。部門帳號只能勾選自己部門。</p>
    <div id="loginUsers"></div>
  </div>
</div>

<script>
const USERS = [
  {u:'jim',     name:'Jim',          role:'admin',     unit:null},
  {u:'tongcai', name:'同材共裁自動化', role:'unit_user', unit:'同材共裁自動化'},
  {u:'dianno',  name:'電腦針車折邊',  role:'unit_user', unit:'電腦針車折邊'},
  {u:'dacu',    name:'打粗水洗照射',  role:'unit_user', unit:'打粗水洗照射'},
];
const UNITS = ['同材共裁自動化','電腦針車折邊','打粗水洗照射'];
const F = {credentials:'same-origin'};
let ME = null, MONTH = '2026-06', curUnit = '同材共裁自動化', isLocked = false;

// Month select init
(function(){
  const s = document.getElementById('monthSel');
  ['2026-04','2026-05','2026-06','2026-07'].forEach(m => {
    const o = document.createElement('option'); o.value = m; o.textContent = m;
    if(m===MONTH) o.selected=true; s.appendChild(o);
  });
})();

function api(path, opts){ return fetch(path, Object.assign({},F,opts)).then(r=>r.json().then(j=>({status:r.status,j}))); }

// ─── Login ───
function showLogin(){
  const box=document.getElementById('loginUsers');
  box.innerHTML=USERS.map(u=>`<div class="login-user" onclick="login('${u.u}')">
    <div><div class="lu-name">${u.name}</div><div style="font-size:11px;color:#aaa">${u.u}</div></div>
    <div class="lu-role ${u.role==='admin'?'role-admin':'role-unit'}">${u.role==='admin'?'admin':'unit_user · '+(u.unit||'')}</div>
  </div>`).join('');
  document.getElementById('loginModal').style.display='flex';
}
async function login(u){
  const {j}=await api('/api/allocation/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u})});
  if(j.ok){document.getElementById('loginModal').style.display='none'; await whoami();}
  else alert('登入失敗: '+(j.error||''));
}
async function logout(){ await api('/api/allocation/logout',{method:'POST'}); ME=null; showLogin(); }

async function whoami(){
  const{j}=await api('/api/allocation/me');
  ME=j.user;
  if(!ME){showLogin();return;}
  const rc=ME.role==='admin'?'role-admin':'role-unit';
  document.getElementById('who').innerHTML=`<b>${ME.name}</b> · <span class="${rc}">${ME.role}</span>`;
  document.getElementById('prefillBtn').style.display=ME.role==='admin'?'':'none';
  document.getElementById('lockBtn').style.display=ME.role==='admin'?'':'none';

  // Unit tab visibility
  if(ME.role==='unit_user'){
    curUnit=ME.unit;
    document.querySelectorAll('.unit-tab').forEach(t=>{
      if(t.dataset.unit!==ME.unit) t.classList.add('disabled');
    });
  }
  switchTab(curUnit, true);
  await loadLeans();
  await loadLockStatus();
  loadAll();
}

// ─── Lock ───
async function loadLockStatus(){
  const{j}=await api('/api/allocation/lock?month='+MONTH);
  isLocked=j.locked||false;
  const badge=document.getElementById('lockBadge');
  const btn=document.getElementById('lockBtn');
  if(isLocked){
    badge.innerHTML='<span class="lock-badge locked">🔒 已鎖定</span>';
    btn.textContent='解鎖';btn.classList.add('red');btn.classList.remove('orange');
  } else {
    badge.innerHTML='<span class="lock-badge unlocked">未鎖定</span>';
    btn.textContent='確認鎖定';btn.classList.add('orange');btn.classList.remove('red');
  }
}
async function toggleLock(){
  const action=isLocked?'unlock':'lock';
  if(action==='lock'&&!confirm(`鎖定 ${MONTH} 勾選表？鎖定後各部門無法再修改。`)) return;
  const{j}=await api('/api/allocation/lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,month:MONTH})});
  if(j.ok){await loadLockStatus();loadAll();}
  else alert('失敗: '+(j.error||''));
}

// ─── Tabs ───
function switchTab(unit, init=false){
  if(ME&&ME.role==='unit_user'&&unit!==ME.unit) return;
  curUnit=unit;
  document.querySelectorAll('.unit-tab').forEach(t=>t.classList.toggle('active',t.dataset.unit===unit));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const panel=document.getElementById('tab-'+unit);
  if(panel){panel.classList.add('active');}
  if(!init) loadUnit(unit);
}

// ─── LEAN dropdown ───
async function loadLeans(){
  const{j}=await api('/api/allocation/leans?month='+MONTH);
  const s=document.getElementById('leanSel');
  const cur=s.value;
  s.innerHTML='<option value="">全部</option>'+(j.leans||[]).map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('');
  if(cur) s.value=cur;
}
function onMonthChange(){ MONTH=document.getElementById('monthSel').value; loadLeans(); loadLockStatus(); loadAll(); }

// ─── Prefill ───
async function doPrefill(){
  if(!confirm('從 IE 細表預填所有後製工序勾選清單？')) return;
  const{j}=await api('/api/allocation/prefill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({month:MONTH})});
  if(j.ok){alert(`預填完成：新增 ${j.inserted} 筆`);await loadLeans();loadAll();}
  else alert('預填失敗: '+(j.error||''));
}

// ─── Load all tabs ───
function loadAll(){ UNITS.forEach(u=>loadUnit(u)); }

async function loadUnit(unit){
  const lean=document.getElementById('leanSel').value;
  const panel=document.getElementById('tab-'+unit);
  if(!panel) return;
  panel.innerHTML='<div class="empty">載入中…</div>';
  const q=`/api/allocation/parts?month=${MONTH}&unit=${encodeURIComponent(unit)}&lean=${encodeURIComponent(lean)}`;
  const{j}=await api(q);
  if(!j.ok){panel.innerHTML=`<div class="empty">載入失敗: ${esc(j.error||'')}</div>`;return;}
  if(!j.leans||!j.leans.length){
    panel.innerHTML=`<div class="empty">此月份尚無勾選項目。${ME&&ME.role==='admin'?'點右上「預填」從 IE 細表建立清單。':'請通知 admin 預填。'}</div>`;
    return;
  }
  panel.innerHTML=j.leans.map(lg=>renderLean(lg,unit)).join('');
}

// ─── Render LEAN group ───
function renderLean(lg, unit){
  const label=lg.lean||'—';
  const body=lg.models.map(mg=>renderModel(mg,unit)).filter(Boolean).join('');
  if(!body) return '';
  return `<div class="lean-group">
    <div class="lean-head" onclick="toggleLean(this)">
      <span class="lean-badge">${esc(label)}</span>
      <div class="spacer"></div>
      <div class="lean-stats">
        <div class="lstat move"><span class="lstat-label">外移MP</span><span class="lstat-val">${fmt(lg.allocated_mp)}</span></div>
        <div class="lstat csa"><span class="lstat-label">留CSA</span><span class="lstat-val">${fmt(lg.csa_mp)}</span></div>
      </div>
      <span class="lean-toggle open">▶</span>
    </div>
    <div class="lean-body open">
      ${body}
      <div class="lean-footer">
        <div class="lf-cell move"><span class="lf-label">外移MP合計</span><span class="lf-val">${fmt(lg.allocated_mp)}</span></div>
        <div class="lf-sep"></div>
        <div class="lf-cell csa"><span class="lf-label">留CSA合計</span><span class="lf-val">${fmt(lg.csa_mp)}</span></div>
      </div>
    </div>
  </div>`;
}

function renderModel(mg, unit){
  const canEdit=ME&&(ME.role==='admin'||ME.unit===unit)&&!isLocked;
  const UNIT_ZONES={
    '同材共裁自動化':['ATOM','Laser','EMMA','YINGHUI'],
    '電腦針車折邊':['電腦針車','折边'],
    '打粗水洗照射':['打粗','照射'],
  };
  const zones=UNIT_ZONES[unit]||[];
  const items=mg.items.filter(it=>zones.includes(it.zone));
  if(!items.length) return '';

  let thead='', rows='';
  if(unit==='同材共裁自動化'){
    thead=`<tr><th>部件名稱</th><th>機台</th><th class="num">刀數/H</th><th class="num">層數</th><th class="num">片數/雙</th><th class="num">總片數</th><th class="num">CT(秒)</th><th class="num">Output</th><th class="num">理論人數</th><th class="ctr">勾選</th></tr>`;
    rows=items.map(it=>{
      const chkHtml=buildChk(it,canEdit);
      return `<tr${it.is_csa_locked?' class="locked-row"':''}>
        <td>${esc(it.part_name||'—')}</td>
        <td><span style="font-size:10px;background:#e8eefc;color:#3a5ce7;border-radius:3px;padding:1px 5px">${esc(it.zone)}</span></td>
        <td class="num">${fmtN(it.cut_per_hour)}</td>
        <td class="num">${fmtN(it.layers)}</td>
        <td class="num">${fmtN(it.qty_per_pair)}</td>
        <td class="num">${it.total_pieces!=null?fmtInt(it.total_pieces):'<span class="dash">—</span>'}</td>
        <td class="num">${fmtN(it.ct_sec)}</td>
        <td class="num">${fmtN(it.output)}</td>
        <td class="num">${fmtN(it.theory_mp)}</td>
        <td class="ctr">${chkHtml}</td>
      </tr>`;
    }).join('');
  } else if(unit==='電腦針車折邊'){
    thead=`<tr><th>部件名稱</th><th>機台</th><th class="num">CT(秒)</th><th class="num">理論人數</th><th class="ctr">勾選</th></tr>`;
    rows=items.map(it=>`<tr>
      <td>${esc(it.part_name||'—')}</td>
      <td><span style="font-size:10px;background:#e8eefc;color:#3a5ce7;border-radius:3px;padding:1px 5px">${esc(it.zone)}</span></td>
      <td class="num">${fmtN(it.ct_sec)}</td>
      <td class="num">${fmtN(it.theory_mp)}</td>
      <td class="ctr">${buildChk(it,canEdit)}</td>
    </tr>`).join('');
  } else {
    // 打粗水洗：顯示需求人力
    thead=`<tr><th>流程名稱</th><th>機台</th><th class="num">TCT(秒)</th><th class="num">需求人力</th><th class="ctr">勾選</th></tr>`;
    rows=items.map(it=>{
      const tct=it.ct_sec, qty=mg.order_qty;
      const demand=tct&&qty ? round2(qty*tct/3600/222) : null;
      return `<tr>
        <td>${esc(it.part_name||'—')}</td>
        <td><span style="font-size:10px;background:#e8eefc;color:#3a5ce7;border-radius:3px;padding:1px 5px">${esc(it.zone)}</span></td>
        <td class="num">${fmtN(tct)}</td>
        <td class="num">${demand!=null?demand:'<span class="dash">—</span>'}</td>
        <td class="ctr">${buildChk(it,canEdit)}</td>
      </tr>`;
    }).join('');
  }

  return `<div class="model-sec">
    <div class="model-head">
      <div>
        <span class="model-name">${esc(mg.model_name)}</span>
        ${mg.model_name.trim()!==mg.art?`<span class="art-list"> · ${esc(mg.art)}</span>`:''}
        ${mg.art&&mg.art.includes(',')?' ...':''}
      </div>
      <span class="order-tag">訂單 ${fmtInt(mg.order_qty)} 雙</span>
      <span class="eolr-tag">EOLR ${mg.eolr}</span>
      <div class="art-stats">
        <div class="astat move"><span class="astat-label">外移MP</span><span class="astat-val">${fmt(mg.allocated_mp)}</span></div>
        <div class="astat csa"><span class="astat-label">留CSA</span><span class="astat-val">${fmt(mg.csa_mp)}</span></div>
      </div>
    </div>
    <div class="table-wrap">
      <table><thead>${thead}</thead><tbody>${rows}</tbody></table>
    </div>
  </div>`;
}

function buildChk(it, canEdit){
  if(it.is_csa_locked) return `<span class="csa-lock">留CSA（主裁斷）</span>`;
  const dis=canEdit?'':'disabled';
  const cls=it.is_checked?'move':'csa';
  return `<label class="chk ${cls} ${canEdit?'':'disabled'}">
    <input type="checkbox" ${it.is_checked?'checked':''} ${dis} onchange="toggle(${it.id},this)">
    ${it.is_checked?'外移':'留CSA'}
  </label>`;
}

function toggleLean(head){
  const body=head.nextElementSibling;
  const icon=head.querySelector('.lean-toggle');
  const open=body.classList.toggle('open');
  icon.classList.toggle('open',open);
}

async function toggle(id,el){
  if(isLocked){el.checked=!el.checked;alert('已鎖定，無法修改');return;}
  const checked=el.checked;
  const{status,j}=await api('/api/allocation/check',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id,is_checked:checked?1:0})
  });
  if(!j.ok){
    el.checked=!checked;
    alert((status===403?'⛔ 權限不足：':'失敗：')+(j.error||status));
    return;
  }
  // Refresh current tab
  loadUnit(curUnit);
}

function fmt(v){if(v==null)return '—';const n=Number(v);return isNaN(n)?String(v):Number.isInteger(n)?String(n):n.toFixed(4);}
function fmtN(v){if(v==null)return '<span class="dash">—</span>';const n=Number(v);return isNaN(n)?String(v):Number.isInteger(n)?String(n):n.toFixed(1);}
function fmtInt(v){if(!v)return '0';return Math.round(Number(v)).toLocaleString();}
function round2(v){return Math.round(v*100)/100;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

whoami();
