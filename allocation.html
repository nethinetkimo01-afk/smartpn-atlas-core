<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>勾選分配表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei',Arial,sans-serif;font-size:13px;background:#f5f7fa;color:#333}
.topbar{background:#1e3a5f;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:15px;font-weight:600;margin-right:auto}
.topbar a{color:#adc8f0;text-decoration:none;font-size:12px}
.toolbar{background:#fff;border-bottom:1px solid #dde;padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar label{font-size:12px;color:#666;display:flex;gap:4px;align-items:center}
.toolbar select{padding:4px 8px;border:1px solid #ccd;border-radius:4px;font-size:12px}
.tab-bar{background:#eef3fb;border-bottom:2px solid #c5d0e0;padding:0 16px;display:flex;gap:0}
.tab-btn{padding:8px 20px;border:none;background:none;font-size:13px;font-weight:600;color:#6b8ab0;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s}
.tab-btn.active{color:#1e3a5f;border-bottom-color:#1e3a5f}
.tab-btn:hover:not(:disabled){color:#1e3a5f}
.tab-btn:disabled{opacity:.35;cursor:not-allowed}
.stat-bar{background:#f0f5ff;padding:5px 16px;font-size:12px;color:#555;border-bottom:1px solid #dde;display:flex;align-items:center;gap:16px}
.stat-bar b{color:#1e3a5f}
.lock-badge{background:#c62828;color:#fff;padding:2px 9px;border-radius:3px;font-size:11px;font-weight:700}
.lock-badge.ok{background:#2e7d32}
.content{padding:12px 16px}
.zone-section{margin-bottom:18px;border:1px solid #c5d0e0;border-radius:6px;overflow:hidden}
.zone-header{background:#2d5a9e;color:#fff;padding:7px 14px;font-size:13px;font-weight:700}
.lean-block{border-top:1px solid #e0e8f0}
.lean-label{background:#e8eef8;padding:5px 14px 5px 20px;font-size:12px;font-weight:700;color:#1e3a5f;display:flex;align-items:center;gap:12px}
.lean-label .lean-code{background:#1e3a5f;color:#fff;padding:1px 7px;border-radius:3px;font-family:monospace;font-size:12px}
.lean-label .lean-stat{font-weight:400;color:#6b8ab0;font-size:11px;margin-left:auto}
table{width:100%;border-collapse:collapse}
.shoe-row{background:#f7f9fc;border-top:1px solid #edf0f5}
.shoe-row td{padding:4px 10px 4px 28px;font-size:12px;color:#2d5a9e;font-weight:600}
.part-row td{padding:3px 8px;border-bottom:1px solid #edf0f5;font-size:12px;vertical-align:middle}
.part-row:last-child td{border-bottom:none}
.part-row:hover td{background:#f0f5ff}
.part-row td:first-child{width:28px;text-align:center;padding-left:30px}
.part-row.unchecked td{color:#aaa}
thead th{padding:4px 8px;background:#e8eef8;font-size:11px;font-weight:600;color:#1e3a5f;border-bottom:1px solid #c5d0e0;white-space:nowrap}
thead th:first-child{width:28px;padding-left:30px}
.num{text-align:right}
.mp-val{font-weight:700;color:#2e7d32}
.mp-val.zero{color:#bbb;font-weight:400}
.btn{padding:5px 12px;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600}
.btn-login{background:#2d5a9e;color:#fff}
.btn-confirm{background:#ff6f00;color:#fff}
.btn-confirm.locked{background:#c62828}
.btn-prefill{background:#2e7d32;color:#fff}
.btn-fix{background:#6a1b9a;color:#fff}
.who-badge{background:rgba(255,255,255,.15);padding:2px 10px;border-radius:10px;font-size:12px}
.no-data{text-align:center;padding:40px;color:#999;font-size:13px}
.loading{text-align:center;padding:40px;color:#888}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.login-box{background:#fff;border-radius:8px;padding:24px;width:280px}
.login-box h3{font-size:14px;font-weight:700;color:#1e3a5f;margin-bottom:14px}
.lrow{margin-bottom:10px}
.lrow label{display:block;font-size:11px;color:#666;margin-bottom:3px}
.lrow input{width:100%;padding:6px 8px;border:1px solid #ccd;border-radius:4px;font-size:13px}
.lbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn-cancel{background:#eee;color:#555}
.btn-save{background:#2d5a9e;color:#fff}
.toast{position:fixed;bottom:20px;right:20px;background:#1e3a5f;color:#fff;padding:9px 16px;border-radius:5px;font-size:12px;display:none;z-index:999}
input[type=checkbox]{width:14px;height:14px;cursor:pointer}
</style>
</head>
<body>

<div class="topbar">
  <h1>勾選分配表</h1>
  <span id="whoBadge" class="who-badge"></span>
  <a href="/ds04">DS-04 →</a>
  <a href="/bianche">廠務編制表 →</a>
  <a href="/eolr-settings">EOLR設定 →</a>
  <button id="btnPrefill" class="btn btn-prefill" onclick="prefill()" style="display:none">⚡ 重新預填</button>
  <button id="btnFix" class="btn btn-fix" onclick="fixDefaults()" style="display:none">✔ 全部設為外移</button>
  <button id="btnConfirm" class="btn btn-confirm" onclick="toggleLock()" style="display:none">確認鎖定</button>
  <button class="btn btn-login" onclick="openLogin()">切換身份</button>
</div>

<div class="toolbar">
  <label>月份<select id="selMonth" onchange="onMonthChange()">
    <option value="2026-06">2026-06</option>
    <option value="2026-07">2026-07</option>
    <option value="2026-05">2026-05</option>
  </select></label>
  <label>LEAN<select id="selLean" onchange="loadData()"><option value="">全部</option></select></label>
  <span id="lockBadge"></span>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tab0" onclick="switchTab(0)">同材共裁</button>
  <button class="tab-btn" id="tab1" onclick="switchTab(1)">電腦針車</button>
  <button class="tab-btn" id="tab2" onclick="switchTab(2)">打粗水洗</button>
</div>

<div class="stat-bar">
  <span id="statText">載入中...</span>
</div>

<div class="content" id="content"><div class="loading">載入中...</div></div>

<div class="overlay" id="loginOverlay">
  <div class="login-box">
    <h3>切換身份</h3>
    <div class="lrow"><label>帳號</label><input id="lUser" placeholder="jim / tongcai / dianno / dacu"></div>
    <div class="lrow"><label>密碼</label><input id="lPass" type="password" placeholder="tongcai"></div>
    <div class="lbtns">
      <button class="btn btn-cancel" onclick="closeLogin()">取消</button>
      <button class="btn btn-save" onclick="doLogin()">登入</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LEAN_ORDER = [
  '1A','1B','1C','2A','2B','2C','3A','3B','3C','4A','4B','4C',
  '5A','5B','5C','6A','6B','6C','7A','7B','7C','8A','8B','8C',
  '9A','9B','9C','10A','10B','10C','11A1','11A2','11B1','11B2','11C'
];
function leanKey(l) { const i = LEAN_ORDER.indexOf(l); return i >= 0 ? i : 999; }

const TABS = [
  {
    name: '同材共裁', unit: '同材共裁自動化',
    zones: [
      {key:'ATOM',     label:'ATOM 區'},
      {key:'Laser',    label:'Laser 區'},
      {key:'EMMA',     label:'EMMA 區'},
      {key:'YINGHUI',  label:'YINGHUI 區'},
    ],
    cols: [
      {key:'process_name', label:'部件名稱', cls:''},
      {key:'ct_sec',       label:'CT (秒)',  cls:'num'},
      {key:'_output',      label:'Output',   cls:'num'},
      {key:'theory_mp',    label:'理論人數', cls:'num'},
    ]
  },
  {
    name: '電腦針車', unit: '電腦針車折邊',
    zones: [
      {key:'電腦針車', label:'電腦針車 區'},
      {key:'折边',     label:'折边 區'},
    ],
    cols: [
      {key:'process_name', label:'配件名稱', cls:''},
      {key:'ct_sec',       label:'CT (秒)',  cls:'num'},
      {key:'theory_mp',    label:'理論人數', cls:'num'},
    ]
  },
  {
    name: '打粗水洗', unit: '打粗水洗照射',
    zones: [
      {key:'打粗', label:'打粗 區'},
      {key:'照射', label:'照射 區'},
    ],
    cols: [
      {key:'process_name', label:'流程名稱', cls:''},
      {key:'ct_sec',       label:'TCT (秒)', cls:'num'},
      {key:'_stf_mp',      label:'需求人力', cls:'num'},
    ]
  }
];

let _role=null, _unit=null, _username=null;
let _locked=false, _curTab=0, _allData=null;
let _canEdit=false;   // Task I：只有撥人編輯者(admin/unit_user)可勾選；其餘(含 read_only)全灰

async function init() {
  await checkSession();
  await loadFilters();
  await loadLockStatus();
  loadData();
}

async function checkSession() {
  try {
    const r = await fetch('/api/allocation/me').then(r=>r.json());
    if (r.ok && r.username) { _role=r.role; _unit=r.unit; _username=r.username; }
    else { _role=null; _unit=null; _username=null; }
  } catch { _role=null; }
  updateWhoUI();
}

async function loadFilters() {
  const f = await fetch('/api/ds04/filters').then(r=>r.json());
  const sl = document.getElementById('selLean');
  (f.leans||[]).forEach(l=>{ const o=document.createElement('option'); o.value=l; o.textContent=l; sl.appendChild(o); });
}

function currentMonth(){ return document.getElementById('selMonth').value; }
function currentLean() { return document.getElementById('selLean').value; }

async function loadLockStatus() {
  const r = await fetch(`/api/allocation/lock?month=${currentMonth()}`).then(r=>r.json());
  _locked = r.locked||false;
  updateLockBadge();
}

function updateLockBadge() {
  document.getElementById('lockBadge').innerHTML = _locked
    ? '<span class="lock-badge">🔒 已鎖定</span>'
    : '<span class="lock-badge ok">未鎖定</span>';
  const cb = document.getElementById('btnConfirm');
  if (cb) { cb.textContent=_locked?'🔒 已鎖定（點此解鎖）':'確認鎖定'; cb.className='btn btn-confirm'+(_locked?' locked':''); }
}

function updateWhoUI() {
  const isAdmin = _role==='admin';
  _canEdit = (_role==='admin' || _role==='unit_user');   // Task I：非撥人編輯者→勾選框全灰
  document.getElementById('whoBadge').textContent = _username
    ? `${_username} (${isAdmin?'管理員':_unit||''})`  : '未登入';
  document.getElementById('btnPrefill').style.display = isAdmin?'':'none';
  document.getElementById('btnFix').style.display     = isAdmin?'':'none';
  document.getElementById('btnConfirm').style.display = isAdmin?'':'none';
  TABS.forEach((t,i)=>{
    const btn=document.getElementById('tab'+i);
    btn.disabled = (_role==='unit_user') ? (_unit!==t.unit) : false;
  });
  if (_role==='unit_user' && _unit) {
    const idx=TABS.findIndex(t=>t.unit===_unit);
    if (idx>=0) switchTab(idx);
  }
}

async function onMonthChange(){ _allData=null; await loadLockStatus(); loadData(); }

async function loadData() {
  document.getElementById('content').innerHTML='<div class="loading">載入中...</div>';
  const month=currentMonth(), lean=currentLean();
  let url=`/api/allocation/parts?month=${month}`;
  if(lean) url+=`&lean=${encodeURIComponent(lean)}`;
  const res=await fetch(url).then(r=>r.json());
  _allData=res;
  renderTab(_curTab);
}

function switchTab(idx) {
  _curTab=idx;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  if(_allData) renderTab(idx); else loadData();
}

function renderTab(tabIdx) {
  const tab=TABS[tabIdx];
  const leans=(_allData&&_allData.leans)||[];

  // flatten all items with lean/model metadata
  const flat=[];
  leans.forEach(lg=>{
    lg.models.forEach(mg=>{
      const mname=(mg.model_name||'').split('Target Output')[0].trim();
      mg.items.forEach(item=>{
        flat.push({...item, lean:lg.lean, model_name:mname, art:mg.art,
                   order_qty:mg.order_qty||0, eolr:mg.eolr||120});
      });
    });
  });

  // group: zone → lean → modelKey → {meta, items[]}
  const zoneMap={};
  tab.zones.forEach(z=>{ zoneMap[z.key]={}; });
  flat.forEach(item=>{
    const z=item.zone;
    if(!zoneMap[z]) return;
    const lk=item.lean||'—';
    if(!zoneMap[z][lk]) zoneMap[z][lk]={};
    const mk=(item.art||'')+'||'+(item.model_name||'');
    if(!zoneMap[z][lk][mk]) zoneMap[z][lk][mk]={model_name:item.model_name, art:item.art, order_qty:item.order_qty, eolr:item.eolr, items:[]};
    zoneMap[z][lk][mk].items.push(item);
  });

  const tabFlat=flat.filter(i=>tab.zones.some(z=>z.key===i.zone));
  const movedMP=tabFlat.filter(i=>i.is_checked).reduce((s,i)=>s+(i.theory_mp||0),0);
  const csaMP  =tabFlat.filter(i=>!i.is_checked).reduce((s,i)=>s+(i.theory_mp||0),0);
  document.getElementById('statText').innerHTML=
    `${tab.name}　外移MP: <b>${movedMP.toFixed(2)}</b>　留CSA: <b>${csaMP.toFixed(2)}</b>　共 <b>${tabFlat.length}</b> 筆`;

  const ncols=tab.cols.length+1;
  let html='';

  tab.zones.forEach(zone=>{
    const leanMap=zoneMap[zone.key]||{};
    const hasData=Object.keys(leanMap).some(lk=>Object.keys(leanMap[lk]).length>0);
    html+=`<div class="zone-section"><div class="zone-header">${esc(zone.label)}`;
    if(!hasData) html+=' <span style="font-size:11px;opacity:.6;font-weight:400">（無資料）</span>';
    html+='</div>';

    const sortedLeans=Object.keys(leanMap).sort((a,b)=>leanKey(a)-leanKey(b));
    sortedLeans.forEach(lean=>{
      const modelMap=leanMap[lean];
      const leanItems=Object.values(modelMap).flatMap(m=>m.items);
      const lMoved=leanItems.filter(i=>i.is_checked).reduce((s,i)=>s+(i.theory_mp||0),0);
      const lCsa  =leanItems.filter(i=>!i.is_checked).reduce((s,i)=>s+(i.theory_mp||0),0);

      html+=`<div class="lean-block">
        <div class="lean-label">
          <span class="lean-code">${esc(lean)}</span>
          <span class="lean-stat">外移 ${lMoved.toFixed(2)} MP　留CSA ${lCsa.toFixed(2)} MP</span>
        </div>
        <table><thead><tr><th></th>`;
      tab.cols.forEach(c=>{ html+=`<th class="${c.cls}">${esc(c.label)}</th>`; });
      html+='</tr></thead><tbody>';

      Object.values(modelMap).forEach(mg=>{
        html+=`<tr class="shoe-row"><td colspan="${ncols}">
          ▸ ${esc(mg.model_name)}
          <span style="color:#777;font-weight:400;margin-left:6px">${esc(mg.art)}</span>
          <span style="color:#999;font-size:11px;margin-left:8px">訂單 ${(mg.order_qty||0).toLocaleString()} 雙</span>
        </td></tr>`;

        mg.items.forEach(item=>{
          const chk=item.is_checked?1:0;
          const dis=(_locked || !_canEdit)?'disabled':'';   // Task I：無編輯權→勾選框禁用(全灰)
          const ct=item.ct_sec;
          const outVal=ct?(3600/ct).toFixed(1):'—';
          const stfMp=(ct&&mg.order_qty>0)?(mg.order_qty/(3600/ct)/222).toFixed(3):'—';
          const mpv=item.theory_mp;

          html+=`<tr class="part-row${chk?'':' unchecked'}">
            <td><input type="checkbox" ${chk?'checked':''} ${dis} onchange="toggle(${item.id},this)"></td>`;
          tab.cols.forEach(c=>{
            let v;
            if     (c.key==='process_name') v=esc(item.process_name||item.part_name||'');
            else if(c.key==='ct_sec')       v=ct?ct.toFixed(1):'—';
            else if(c.key==='_output')      v=outVal;
            else if(c.key==='_stf_mp')      v=stfMp;
            else if(c.key==='theory_mp')    v=mpv!=null?`<span class="mp-val${(!mpv||mpv===0)?' zero':''}">${mpv.toFixed(4)}</span>`:'—';
            else v=esc(String(item[c.key]||'—'));
            html+=`<td class="${c.cls}">${v}</td>`;
          });
          html+='</tr>';
        });
      });
      html+='</tbody></table></div>';
    });
    html+='</div>';
  });

  if(!html) html='<div class="no-data">無資料（請先執行「重新預填」）</div>';
  document.getElementById('content').innerHTML=html;
}

async function toggle(itemId, el) {
  if(!_canEdit){ el.checked=!el.checked; showToast('唯讀，無法修改'); return; }   // Task I 防線
  if(_locked){ el.checked=!el.checked; showToast('已鎖定，無法修改'); return; }
  const checked=el.checked?1:0;
  const r=await fetch('/api/allocation/check',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:itemId, is_checked:checked})
  }).then(r=>r.json());
  if(!r.ok){ el.checked=!el.checked; showToast('錯誤: '+(r.error||'')); return; }
  // update cache
  const leans=(_allData&&_allData.leans)||[];
  outer: for(const lg of leans) for(const mg of lg.models) for(const item of mg.items)
    if(item.id===itemId){ item.is_checked=checked; break outer; }
  renderTab(_curTab);
}

async function prefill(){
  if(!confirm('重新預填將從IE資料刷新分配項目，確定？')) return;
  const r=await fetch('/api/allocation/prefill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({month:currentMonth()})}).then(r=>r.json());
  if(r.ok){ showToast(`預填完成：${r.inserted} 筆`); _allData=null; loadData(); }
  else showToast('錯誤: '+(r.error||''));
}

async function fixDefaults(){
  if(!confirm('將本月所有非裁斷機部件設為「外移」？')) return;
  const r=await fetch('/api/allocation/fix_defaults',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({month:currentMonth()})}).then(r=>r.json());
  if(r.ok){ showToast(`已更新 ${r.updated} 筆為外移`); _allData=null; loadData(); }
  else showToast('錯誤: '+(r.error||''));
}

async function toggleLock(){
  const month=currentMonth();
  if(_locked){
    if(!confirm(`解鎖 ${month}？`)) return;
    const r=await fetch('/api/allocation/lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'unlock',month})}).then(r=>r.json());
    if(r.ok){ _locked=false; updateLockBadge(); showToast('已解鎖'); }
    else showToast('錯誤: '+(r.error||''));
  } else {
    if(!confirm(`確認鎖定 ${month}？鎖定後外移資料送入廠務編制計算。`)) return;
    const r=await fetch('/api/allocation/lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({month})}).then(r=>r.json());
    if(r.ok){ _locked=true; updateLockBadge(); showToast(`${month} 已鎖定`); }
    else showToast('錯誤: '+(r.error||''));
  }
}

function openLogin(){ document.getElementById('loginOverlay').classList.add('show'); }
function closeLogin(){ document.getElementById('loginOverlay').classList.remove('show'); }
async function doLogin(){
  const u=document.getElementById('lUser').value.trim();
  const p=document.getElementById('lPass').value;
  const r=await fetch('/api/allocation/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}).then(r=>r.json());
  if(r.ok){ _role=r.role; _unit=r.unit; _username=r.username; closeLogin(); updateWhoUI(); showToast(`已切換：${r.name}`); _allData=null; loadData(); }
  else showToast('登入失敗: '+(r.error||''));
}
document.getElementById('loginOverlay').addEventListener('click',function(e){if(e.target===this)closeLogin();});
document.getElementById('lPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._tm);t._tm=setTimeout(()=>{t.style.display='none';},2500);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

init();
</script>
</body>
</html>
