<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>廠務組織編制表</title>
<style>
/* ── Identical to ie_cell_detail.html CSS ───────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;background:#FFFFFF;color:#1C1C1E;min-height:100vh}
.topbar{background:#F5F5F7;color:#1D1D1F;padding:9px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;border-bottom:1px solid #E5E5EA;flex-wrap:wrap}
.topbar-title{font-size:14px;font-weight:700;white-space:nowrap}
.topbar-spacer{flex:1}
.back-link{color:#1D1D1F;text-decoration:none;font-size:11px;display:flex;align-items:center;gap:4px}
.back-link:hover{color:#0066CC}
.btn-sm{background:#007AFF;color:#fff;border:none;border-radius:5px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.btn-sm:hover{background:#0066CC}
.btn-outline{background:transparent;color:#1D1D1F;border:1px solid #C7C7CC;border-radius:5px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn-outline:hover{background:#E5E5EA}
.stage-select{background:#F5F5F7;color:#1D1D1F;border:1px solid #C7C7CC;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;min-width:110px}
.content{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.zone-card{background:#fff;border-radius:8px;border:1px solid #E5E5EA;overflow:hidden}
.zone-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#F5F5F7;border-bottom:1px solid #E5E5EA}
.zone-name{font-size:12px;font-weight:700;color:#1C1C1E}
.zone-count{font-size:10px;color:#8E8E93;margin-left:6px}
.zone-actions{display:flex;align-items:center;gap:6px}
.zone-body{overflow-x:auto}
.proc-table{border-collapse:collapse;width:100%;font-size:11px;border:1px solid #E5E5EA}
.proc-table th{background:#1C1C1E;color:#fff;padding:5px 8px;text-align:center;font-size:10px;font-weight:600;white-space:nowrap;border:1px solid #3A3A3C}
.proc-table th.left{text-align:left}
.proc-table td{padding:4px 8px;border:1px solid #E5E5EA;vertical-align:middle;white-space:nowrap;color:#1C1C1E;background:#fff}
.proc-table td.left{text-align:left;max-width:220px;white-space:normal;line-height:1.4}
.proc-table td.num{text-align:right;color:#1C1C1E;font-family:Consolas,monospace}
.formula-cell{color:#000000;text-align:right;font-family:Consolas,monospace;cursor:default;background:transparent!important;border:none!important}
.actual-cell{color:#1C1C1E;text-align:right;font-family:Consolas,monospace;font-weight:600;background:#fff;border:1px solid #C7C7CC;padding:0}
.bz-inp{width:100%;border:none;border-radius:0;padding:3px 6px;font-size:11px;font-family:Consolas,monospace;text-align:right;outline:none;background:#fff;color:#1C1C1E;-moz-appearance:textfield}
.bz-inp:focus{box-shadow:inset 0 0 0 2px #007AFF}
.bz-inp::-webkit-outer-spin-button,.bz-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.subtotal-row td{background:#FFFFFF;font-weight:700}
.total-row td{background:#FFFFFF;font-weight:700;border-top:2px solid #C7C7CC}
.lean-card{background:#fff;border-radius:8px;border:1px solid #E5E5EA;overflow:hidden;margin-bottom:10px}
.lean-hdr{display:flex;align-items:center;padding:7px 12px;background:#F5F5F7;border-bottom:1px solid #E5E5EA;cursor:pointer;user-select:none;gap:10px}
.lean-hdr:hover{background:#EBEBEF}
.lean-label{font-size:12px;font-weight:700;color:#1C1C1E;min-width:44px}
.lean-total-bz{font-size:11px;color:#8E8E93;font-family:Consolas,monospace}
.lean-total-k{font-size:10px;color:#8E8E93;font-family:Consolas,monospace}
.lean-collapse-arrow{margin-left:auto;color:#8E8E93;font-size:12px;transition:transform .15s}
.lean-body{overflow-x:auto}
.lean-major-hdr{background:#1C1C1E;color:#fff;padding:5px 12px;font-size:11px;font-weight:700;border-bottom:1px solid #3A3A3C}
.no-data{padding:40px;text-align:center;color:#8E8E93;font-size:13px}
.loading-msg{padding:40px;text-align:center;color:#8E8E93;font-size:13px}
.error-msg{padding:20px;color:#FF3B30;font-size:12px}
.toast{position:fixed;bottom:20px;right:20px;background:#1C1C1E;color:#fff;padding:8px 16px;border-radius:6px;font-size:12px;display:none;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.monthly-table{width:100%;border-collapse:collapse}
.monthly-table td{padding:5px 10px;border-bottom:1px solid #E5E5EA;font-size:11px;vertical-align:middle}
.monthly-table td:first-child{color:#8E8E93;font-weight:600;min-width:160px;white-space:nowrap}
.monthly-table td:last-child{text-align:right;font-family:Consolas,monospace;color:#1C1C1E}
.monthly-table tr:last-child td{border-bottom:none}
.mval-formula{color:#000000}
.mval-strong{font-weight:700;color:#000000}
.badge-outsource{background:#FFF3E0;color:#E65100;font-size:9px;padding:1px 5px;border-radius:3px;margin-left:4px;font-weight:600}
.badge-noie{background:#F2F2F7;color:#8E8E93;font-size:9px;padding:1px 5px;border-radius:3px;margin-left:4px}
</style>
</head>
<body>
<div class="topbar">
  <a class="back-link" href="/ds04">← DS-04</a>
  <div class="topbar-title">廠務組織編制表</div>
  <label style="font-size:11px;color:#8E8E93;display:flex;align-items:center;gap:4px">月份
    <select class="stage-select" id="selMonth" onchange="loadAll()">
      <option value="2026-05">2026-05</option>
      <option value="2026-06" selected>2026-06</option>
      <option value="2026-07">2026-07</option>
    </select>
  </label>
  <div class="topbar-spacer"></div>
  <a href="/admin/users" class="btn-outline" id="btn-admin-users" style="display:none">帳號管理</a>
  <a href="/eolr-settings" style="font-size:11px;color:#8E8E93;text-decoration:none">EOLR設定</a>
  <a href="/allocation"    style="font-size:11px;color:#8E8E93;text-decoration:none">勾選表</a>
  <button class="btn-sm"  onclick="exportXlsx()">⬇ 匯出</button>
  <label class="btn-outline" style="cursor:pointer;font-size:12px">⬆ 匯入
    <input type="file" accept=".xlsx" style="display:none" onchange="importXlsx(this)">
  </label>
</div>

<!-- Task Y：編制表五步流程列（常駐頁頂，狀態可見、可回退、卡關灰掉並說明） -->
<div id="flow-bar" style="margin:12px 18px 0;padding:10px 12px;border-radius:8px;border:1px solid #E5E5EA;background:#fff;display:flex;align-items:stretch;gap:6px;overflow-x:auto">
  <span style="color:#8E8E93;font-size:12px;padding:8px">流程載入中…</span>
</div>
<div id="flow-recalc" style="display:none;margin:8px 18px 0;padding:7px 12px;border-radius:6px;background:#FFF6E5;border:1px solid #f0d98a;color:#B26A00;font-size:12px">
  ⚠ 已回退上游步驟——下游步驟（計算/導出）如資料有變動需重算。
</div>

<!-- Task S-2：頁頂顯著狀態列（當前月份 + N 單位有資料 / M 單位本月未匯入） -->
<div id="bz-status" style="margin:12px 18px 0;padding:10px 14px;border-radius:8px;border:1px solid #E5E5EA;background:#F5F5F7;font-size:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
  <span style="color:#8E8E93">狀態載入中…</span>
</div>

<!-- Task Y：步驟①②③ 以 iframe 內嵌（不跳出頁簽）；④=下方原編制內容；⑤=導出動作 -->
<div id="flow-embed-wrap" style="display:none;margin:12px 18px 0;border:1px solid #E5E5EA;border-radius:8px;overflow:hidden">
  <div style="background:#F5F5F7;padding:6px 12px;font-size:12px;color:#1C1C1E;border-bottom:1px solid #E5E5EA;display:flex;align-items:center;gap:10px">
    <span id="flow-embed-title" style="font-weight:700"></span>
    <span style="flex:1"></span>
    <button class="btn-outline" style="font-size:11px;padding:3px 10px" onclick="gotoStep(4)">← 回計算編制</button>
  </div>
  <iframe id="flow-embed" style="width:100%;height:calc(100vh - 220px);border:none;display:block;background:#fff"></iframe>
</div>

<div class="content">
  <!-- ══ 上半：各單位編制總表 ══ -->
  <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">
    <!-- 單位表 -->
    <div class="zone-card" style="flex:1;min-width:480px">
      <div class="zone-header">
        <span class="zone-name">各單位編制總表</span>
        <span class="zone-count" id="summaryMonth"></span>
      </div>
      <div class="zone-body">
        <table class="proc-table" id="unitTable">
          <thead>
            <tr>
              <th class="left" rowspan="2">單位</th>
              <th colspan="2">直工</th>
              <th colspan="2">間工</th>
              <th colspan="2">直間比</th>
            </tr>
            <tr>
              <th>上月</th><th>本月</th>
              <th>上月</th><th>本月</th>
              <th>上月</th><th>本月</th>
            </tr>
          </thead>
          <tbody id="unitTableBody">
            <tr><td colspan="7" class="loading-msg" style="padding:20px">載入中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 月度數字 -->
    <div class="zone-card" style="min-width:300px">
      <div class="zone-header"><span class="zone-name">月度數字</span></div>
      <div class="zone-body" id="monthlyPanel">
        <div class="loading-msg" style="padding:20px">載入中…</div>
      </div>
    </div>
  </div>

  <!-- ══ 下半：CSA LEAN 明細 ══ -->
  <div class="zone-card">
    <div class="zone-header">
      <span class="zone-name">CSA 明細</span>
      <span class="zone-count" id="detailCount"></span>
    </div>
    <div id="csaDetailContainer" style="padding:10px 14px">
      <div class="loading-msg">載入中…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MONTH_KEYS = ['avg_lc','working_hours','external_hours','deduct_hours','actual_direct'];
const MONTH_LABELS = {
  total_qty:       '本月進度表總量',
  avg_lc:          '本月平均LC',
  direct_planned:  '本月預計直工數',
  working_hours:   '本月平均上班時數',
  total_manhours:  '預計總工時',
  external_hours:  '本月預計發外工時',
  deduct_hours:    '本月預計扣減工時',
  planned_eff:     '本月預計效率',
  target80_direct: '達80%效率需直工數',
  actual_direct:   '本月實際直工數',
  actual_eff:      '本月實際效率',
};
const MANUAL_MONTH_KEYS = new Set(['avg_lc','working_hours','external_hours','deduct_hours','actual_direct']);
const MANUAL_UNIT_FIELDS = new Set(['direct_last','indirect_last','indirect_this']); // direct_this for non-CSA
const FORMULA_UNITS = new Set(['CSA','C2B合計','合計']);

let _summaryData = null, _detailData = null, _CAN_EDIT = false;

function month(){ return document.getElementById('selMonth').value; }

// Task S-2：明確錯誤區塊 + 重試鈕（不得靜默空白/殘缺）
function errBlock(msg, colspan) {
  const btn = `<button class="btn-sm" style="background:#FF3B30;margin-left:10px" onclick="loadAll()">↻ 重試</button>`;
  const inner = `<span style="color:#FF3B30;font-weight:600">⚠ ${esc(msg||'載入失敗')}</span>${btn}`;
  return colspan ? `<tr><td colspan="${colspan}" style="padding:18px;text-align:center">${inner}</td></tr>`
                 : `<div class="error-msg" style="display:flex;align-items:center;justify-content:center;padding:24px">${inner}</div>`;
}
function renderBzStatus(sumR, state) {
  const el = document.getElementById('bz-status'); if (!el) return;
  if (state === 'loading') { el.style.background='#F5F5F7'; el.innerHTML = `<span style="color:#8E8E93">月份 <b>${esc(month())}</b> · 狀態載入中…</span>`; return; }
  if (state === 'error') {
    el.style.background='#FDECEA';
    el.innerHTML = `<span style="color:#B71C1C;font-weight:700">⚠ 本月狀態載入失敗（${esc((sumR&&sumR.error)||'API 錯誤')}）</span>`
      + `<button class="btn-sm" style="background:#FF3B30" onclick="loadAll()">↻ 重試</button>`;
    return;
  }
  const withN = sumR.units_with_data, total = sumR.units_total, missing = sumR.units_missing || [];
  const ok = missing.length === 0;
  el.style.background = ok ? '#E8F6EC' : '#FFF6E5';
  el.innerHTML =
    `<span style="font-weight:700;color:#1C1C1E">當前月份 <b>${esc(month())}</b></span>`
    + `<span style="color:#1D7340;font-weight:600">✓ ${withN}/${total} 單位有資料</span>`
    + (missing.length
        ? `<span style="color:#B26A00;font-weight:600">⚠ ${missing.length} 單位本月未匯入：${esc(missing.join('、'))}</span>`
        : `<span style="color:#1D7340">全部單位已匯入</span>`);
}

// ── Task Y：五步流程列 ────────────────────────────────────────────────────────
const FLOW_STEP_STATES = {
  todo:   {label:'未開始', bg:'#F2F2F7', fg:'#8E8E93', dot:'#C7C7CC'},
  doing:  {label:'進行中', bg:'#EAF3FF', fg:'#0066CC', dot:'#007AFF'},
  locked: {label:'已鎖定', bg:'#E8F6EC', fg:'#1D7340', dot:'#34C759'},
  error:  {label:'有誤',   bg:'#FDECEA', fg:'#B71C1C', dot:'#FF3B30'},
  ready:  {label:'可執行', bg:'#E8F6EC', fg:'#1D7340', dot:'#34C759'},
};
let _FLOW = null, _curStep = 4, _recalcNeeded = false;

async function loadFlow() {
  const bar = document.getElementById('flow-bar');
  const r = await fetch(`/api/bianzhi/flow_state?month=${month()}`).then(r=>r.json()).catch(()=>({ok:false,error:'流程狀態載入失敗'}));
  if (!r.ok) {
    bar.innerHTML = `<span style="color:#FF3B30;font-weight:600;padding:8px">⚠ ${esc(r.error||'流程載入失敗')}</span>`
      + `<button class="btn-sm" style="background:#FF3B30;margin:6px" onclick="loadFlow()">↻ 重試</button>`;
    return;
  }
  _FLOW = r;
  const reach = reachableMax(r.steps);
  bar.innerHTML = r.steps.map((s,i)=>{
    const stt = FLOW_STEP_STATES[s.status] || FLOW_STEP_STATES.todo;
    const gated = (s.id > reach);
    const isCur = (s.id === _curStep);
    const recalcTag = (_recalcNeeded && s.id >= 4) ? '<div style="font-size:9px;color:#B26A00;font-weight:700;margin-top:2px">需重算</div>' : '';
    const reason = gated ? gateReason(r.steps, s.id) : '';
    return `<div onclick="${gated?`flowGateMsg('${esc(reason)}')`:`gotoStep(${s.id})`}"
        title="${esc(gated?reason:s.detail)}"
        style="flex:1;min-width:132px;cursor:${gated?'not-allowed':'pointer'};opacity:${gated?0.5:1};
        border:2px solid ${isCur?stt.dot:'transparent'};border-radius:8px;background:${stt.bg};padding:8px 10px">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="width:8px;height:8px;border-radius:50%;background:${stt.dot};flex-shrink:0"></span>
        <span style="font-size:12px;font-weight:700;color:${stt.fg}">${s.id}. ${esc(s.name)}</span>
      </div>
      <div style="font-size:10px;color:${stt.fg};margin-top:3px">${stt.label}${gated?'（鎖）':''}</div>
      <div style="font-size:10px;color:#8E8E93;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.detail)}</div>
      ${recalcTag}
    </div>`;
  }).join('');
  document.getElementById('flow-recalc').style.display = _recalcNeeded ? '' : 'none';
}
function reachableMax(steps){
  // 已鎖定/有誤/可執行 = 完成；第一個未完成步驟為可進入的前緣，其後鎖住
  for (const s of steps) {
    if (!['locked','error','ready'].includes(s.status)) return s.id;
  }
  return steps.length;
}
function gateReason(steps, id){
  const prev = steps.find(s=>s.id===id-1);
  return prev ? `需先完成第 ${prev.id} 步「${prev.name}」（目前：${(FLOW_STEP_STATES[prev.status]||{}).label||prev.status}）` : '尚未解鎖';
}
function flowGateMsg(msg){ showToast('🔒 ' + msg, 3000); }

function gotoStep(n){
  if (!_FLOW) return;
  const reach = reachableMax(_FLOW.steps);
  if (n > reach) { flowGateMsg(gateReason(_FLOW.steps, n)); return; }
  // 回退到上游輸入步驟(①②③) → 標記下游需重算
  if (n < _curStep && n <= 3) _recalcNeeded = true;
  _curStep = n;
  const step = _FLOW.steps.find(s=>s.id===n);
  const embedWrap = document.getElementById('flow-embed-wrap');
  const embed = document.getElementById('flow-embed');
  const nativeEls = [document.getElementById('bz-status'), document.querySelector('.content')];
  if (n === 5) {                       // 導出：留在計算視圖並觸發匯出
    embedWrap.style.display = 'none';
    nativeEls.forEach(e=>{ if(e) e.style.display=''; });
    exportXlsx();
    loadFlow();
    return;
  }
  if (step && step.page) {             // ①②③：iframe 內嵌，不跳出頁簽
    document.getElementById('flow-embed-title').textContent = `${step.id}. ${step.name}`;
    embed.src = step.page;
    embedWrap.style.display = '';
    nativeEls.forEach(e=>{ if(e) e.style.display='none'; });
  } else {                             // ④ 計算編制：原生內容
    embedWrap.style.display = 'none';
    nativeEls.forEach(e=>{ if(e) e.style.display=''; });
  }
  loadFlow();
}

async function loadAll() {
  // 切月份/重載：回到計算編制(④)原生視圖、清回退旗標（狀態隨月重derived，不殘留）
  _curStep = 4; _recalcNeeded = false;
  document.getElementById('flow-embed-wrap').style.display = 'none';
  const _st = document.getElementById('bz-status'); if (_st) _st.style.display = '';
  const _ct = document.querySelector('.content'); if (_ct) _ct.style.display = '';
  loadFlow();
  document.getElementById('unitTableBody').innerHTML = '<tr><td colspan="7" style="padding:20px;text-align:center;color:#8E8E93">載入中…</td></tr>';
  document.getElementById('monthlyPanel').innerHTML = '<div class="loading-msg" style="padding:20px">載入中…</div>';
  document.getElementById('csaDetailContainer').innerHTML = '<div class="loading-msg">載入中…</div>';
  document.getElementById('summaryMonth').textContent = month();
  renderBzStatus(null, 'loading');

  const [sumR, detR, ceR] = await Promise.all([
    fetch(`/api/bianzhi/summary?month=${month()}`).then(r=>r.json()).catch(()=>({ok:false,error:'網路/伺服器錯誤'})),
    fetch(`/api/bianzhi/detail?month=${month()}`).then(r=>r.json()).catch(()=>({ok:false,error:'網路/伺服器錯誤'})),
    fetch('/api/bianzhi/can_edit').then(r=>r.json()).catch(()=>({can_edit:false})),
  ]);
  _CAN_EDIT = (ceR && ceR.can_edit === true);

  if (sumR.ok) { _summaryData = sumR; renderSummary(sumR); renderBzStatus(sumR, 'ok'); }
  else {
    // 不得靜默空白：三個彙總區塊都給明確錯誤 + 重試
    document.getElementById('unitTableBody').innerHTML = errBlock(sumR.error, 7);
    document.getElementById('monthlyPanel').innerHTML = errBlock(sumR.error);
    renderBzStatus(sumR, 'error');
  }

  if (detR.ok) { _detailData = detR; renderDetail(detR); }
  else document.getElementById('csaDetailContainer').innerHTML = errBlock(detR.error);
}

// ══ SUMMARY ══
function renderSummary(data) {
  const units = data.units || [];
  let tbody = '';
  for (const u of units) {
    const isSubtotal = u.is_subtotal;
    const isTotal    = u.is_total;
    const cls = isTotal ? 'total-row' : (isSubtotal ? 'subtotal-row' : '');

    const dtCell = (u.unit==='CSA' || u.formula_direct)
      ? `<td class="formula-cell">${fmtN(u.direct_this)}</td>`
      : (isSubtotal||isTotal)
        ? `<td class="formula-cell">${fmtN(u.direct_this)}</td>`
        : `<td class="actual-cell"><input class="bz-inp" type="number" step="1" value="${u.direct_this??''}" placeholder=""
             onblur="saveUnitField('${esc(u.unit)}','direct_this',this)" ${_CAN_EDIT?'':'disabled'}></td>`;

    tbody += `<tr class="${cls}">
      <td class="left">${esc(u.unit)}</td>
      <td class="actual-cell"><input class="bz-inp" type="number" step="1" value="${u.direct_last??''}" placeholder=""
        onblur="saveUnitField('${esc(u.unit)}','direct_last',this)" ${_CAN_EDIT&&!isSubtotal&&!isTotal?'':'disabled'}></td>
      ${dtCell}
      <td class="actual-cell"><input class="bz-inp" type="number" step="1" value="${u.indirect_last??''}" placeholder=""
        onblur="saveUnitField('${esc(u.unit)}','indirect_last',this)" ${_CAN_EDIT&&!isSubtotal&&!isTotal?'':'disabled'}></td>
      <td class="actual-cell"><input class="bz-inp" type="number" step="1" value="${u.indirect_this??''}" placeholder=""
        onblur="saveUnitField('${esc(u.unit)}','indirect_this',this)" ${_CAN_EDIT&&!isSubtotal&&!isTotal?'':'disabled'}></td>
      <td class="formula-cell">${fmtRatio(u.ratio_last)}</td>
      <td class="formula-cell">${fmtRatio(u.ratio_this)}</td>
    </tr>`;
  }
  document.getElementById('unitTableBody').innerHTML = tbody;

  // Monthly
  const m = data.monthly || {};
  let mhtml = '<table class="monthly-table">';
  for (const [k, label] of Object.entries(MONTH_LABELS)) {
    const val = m[k];
    const isManual = MANUAL_MONTH_KEYS.has(k);
    let cell;
    if (isManual) {
      cell = `<td><input class="bz-inp" type="number" step="0.01" style="width:90px;border:1px solid #C7C7CC;border-radius:3px;text-align:right"
        value="${val??''}" onblur="saveMonthlyKey('${k}',this)" ${_CAN_EDIT?'':'disabled'}></td>`;
    } else {
      cell = `<td class="mval-formula">${fmtM(k,val)}</td>`;
    }
    mhtml += `<tr><td>${esc(label)}</td>${cell}</tr>`;
  }
  mhtml += '</table>';
  document.getElementById('monthlyPanel').innerHTML = mhtml;
}

function fmtRatio(v) {
  if (v == null || v === '-') return '<span style="color:#C7C7CC">—</span>';
  if (typeof v === 'string') return v;
  return parseFloat(v).toFixed(2);
}
function fmtM(key, v) {
  if (v == null) return '<span style="color:#C7C7CC">—</span>';
  if (key === 'planned_eff' || key === 'actual_eff') return `<span class="mval-strong">${(v*100).toFixed(2)}%</span>`;
  if (key === 'total_qty' || key === 'total_manhours') return Math.round(v).toLocaleString();
  if (key === 'target80_direct' || key === 'direct_planned') return `<span class="mval-strong">${Math.round(v)}</span>`;
  return String(v);
}

// ══ DETAIL ══
function renderDetail(data) {
  const leans = data.leans || [];
  if (!leans.length) {
    document.getElementById('csaDetailContainer').innerHTML = '<div class="no-data">無資料（DS-04 尚無已排程訂單）</div>';
    document.getElementById('detailCount').textContent = '';
    return;
  }

  // Group by lean_major
  const majors = {};
  for (const lg of leans) {
    const maj = lg.lean_major || '?';
    if (!majors[maj]) majors[maj] = [];
    majors[maj].push(lg);
  }

  let html = '';
  let totalModels = 0;
  for (const [maj, leanGroups] of Object.entries(majors).sort((a,b)=>+a[0]-(+b[0]))) {
    html += `<div class="lean-major-hdr">LEAN ${maj}</div>`;
    for (const lg of leanGroups) {
      const leanId = 'lean-' + lg.lean.replace(/[^a-zA-Z0-9]/g,'_');
      totalModels += lg.models.length;
      html += `<div class="lean-card" id="${leanId}">
        <div class="lean-hdr" onclick="toggleLean('${esc(lg.lean)}')">
          <span class="lean-label">${esc(lg.lean)}</span>
          <span style="font-size:10px;color:#8E8E93">EOLR ${lg.eolr}</span>
          <span class="lean-total-bz">編制 <b>${fmtN(lg.total_bianzhi)}</b></span>
          <span class="lean-collapse-arrow" id="arr-${leanId}">▼</span>
        </div>
        <div class="lean-body" id="body-${leanId}">
          ${renderLeanTable(lg)}
        </div>
      </div>`;
    }
  }
  document.getElementById('csaDetailContainer').innerHTML = html;
  document.getElementById('detailCount').textContent = `${leans.length} 個LEAN組 / ${totalModels} 款`;
}

function toggleLean(lean) {
  const leanId = 'lean-' + lean.replace(/[^a-zA-Z0-9]/g,'_');
  const body = document.getElementById('body-' + leanId);
  const arr  = document.getElementById('arr-' + leanId);
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if (arr) arr.style.transform = hidden ? '' : 'rotate(-90deg)';
}

function renderLeanTable(lg) {
  const rows = lg.models || [];
  if (!rows.length) return '<div class="no-data" style="padding:16px">無訂單</div>';
  let h = `<table class="proc-table">
    <thead><tr>
      <th class="left" style="min-width:160px">鞋型 / ART</th>
      <th>訂單量</th>
      <th>裁斷</th><th>針車</th><th>成型</th>
      <th>合計K</th>
      <th style="min-width:70px">編制</th>
      <th title="同材共裁/自動裁斷/折邊">外移P</th>
      <th title="電腦針車">外移Q</th>
      <th title="大底課">外移R</th>
      <th>C2B</th>
    </tr></thead><tbody>`;

  const sumFields = ['qty','cutting','stitching','assembly','total_k','p_ext','q_ext','r_ext','c2b'];
  const sums = {};
  for (const f of sumFields) sums[f] = 0;

  for (const r of rows) {
    const noIe = !r.has_ie;
    // 版本控制 Step 4a: 沒鎖定版 → MP 格空+紅底+tooltip
    const noLock = (r.has_locked === false);
    const LOCK_TIP = '此鞋型 IE 尚未設定鎖定版，請先鎖定';
    const mp = (v, dflt='') => noLock
      ? `<td class="formula-cell" style="background:#FDECEA" title="${LOCK_TIP}"></td>`
      : `<td class="formula-cell">${fmtN(v) || dflt}</td>`;
    h += `<tr>
      <td class="left">${esc(r.model_name)}${r.is_outsource?'<span class="badge-outsource">外包</span>':''}${noLock?'<span class="badge-noie" style="background:#FDECEA;color:#B71C1C" title="'+LOCK_TIP+'">未鎖定</span>':(noIe?'<span class="badge-noie">無IE</span>':'')}<div style="font-size:9px;color:#8E8E93;margin-top:1px">${esc(r.arts)}</div></td>
      <td class="formula-cell">${r.qty?r.qty.toLocaleString():''}</td>
      ${mp(r.cutting)}
      ${mp(r.stitching)}
      ${mp(r.assembly)}
      ${mp(r.total_k)}
      <td class="actual-cell"><input class="bz-inp" type="number" step="0.5"
        value="${r.bianzhi??''}" placeholder=""
        onblur="saveBianzhi('${esc(lg.lean)}','${esc(r.model_name)}',this)"
        ${_CAN_EDIT?'':'disabled'}></td>
      ${mp(r.p_ext, '0')}
      ${mp(r.q_ext, '0')}
      ${mp(r.r_ext, '0')}
      ${mp(r.c2b)}
    </tr>`;
    for (const f of sumFields) sums[f] += Number(r[f]) || 0;
  }

  const st = 'border-top:2px solid #C7C7CC;background:#FFFFFF;font-weight:600';
  const sc = 'class="formula-cell" style="font-weight:600"';
  h += `<tr class="sum-row" style="${st}">
    <td class="left" style="font-weight:700">合計</td>
    <td ${sc}>${sums.qty ? sums.qty.toLocaleString() : '0'}</td>
    <td ${sc}>${fmtN(sums.cutting)||'0'}</td>
    <td ${sc}>${fmtN(sums.stitching)||'0'}</td>
    <td ${sc}>${fmtN(sums.assembly)||'0'}</td>
    <td ${sc}>${fmtN(sums.total_k)||'0'}</td>
    <td class="actual-cell"></td>
    <td ${sc}>${fmtN(sums.p_ext)||'0'}</td>
    <td ${sc}>${fmtN(sums.q_ext)||'0'}</td>
    <td ${sc}>${fmtN(sums.r_ext)||'0'}</td>
    <td ${sc}>${fmtN(sums.c2b)||'0'}</td>
  </tr>`;
  h += '</tbody></table>';
  return h;
}

// ══ Save functions ══
async function saveUnitField(unit, field, inp) {
  const val = parseFloat(inp.value);
  const r = await fetch('/api/bianzhi/unit_manual', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({month:month(), unit, field, value: isNaN(val)?null:val})
  }).then(r=>r.json()).catch(()=>({ok:false}));
  if (r.ok) { inp.style.boxShadow=''; showToast('已儲存'); loadSummaryOnly(); }
  else { inp.style.boxShadow='inset 0 0 0 2px #FF3B30'; showToast('儲存失敗'); }
}

async function saveMonthlyKey(key, inp) {
  const val = parseFloat(inp.value);
  const r = await fetch('/api/bianzhi/monthly_manual', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({month:month(), key, value: isNaN(val)?0:val})
  }).then(r=>r.json()).catch(()=>({ok:false}));
  if (r.ok) { inp.style.boxShadow=''; showToast('已儲存'); loadSummaryOnly(); }
  else { inp.style.boxShadow='inset 0 0 0 2px #FF3B30'; showToast('儲存失敗'); }
}

async function saveBianzhi(lean, modelName, inp) {
  const val = parseFloat(inp.value);
  const r = await fetch('/api/bianzhi/lean_bianzhi', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({lean, model_name:modelName, month:month(), bianzhi: isNaN(val)?null:val})
  }).then(r=>r.json()).catch(()=>({ok:false}));
  if (r.ok) { inp.style.boxShadow=''; showToast('已儲存'); loadSummaryOnly(); }
  else { inp.style.boxShadow='inset 0 0 0 2px #FF3B30'; showToast('儲存失敗'); }
}

async function loadSummaryOnly() {
  const sumR = await fetch(`/api/bianzhi/summary?month=${month()}`).then(r=>r.json()).catch(()=>({ok:false}));
  if (sumR.ok) renderSummary(sumR);
}

// ══ Export / Import ══
function exportXlsx() { window.location = '/api/bianche/export?month=' + month(); }
async function importXlsx(inp) {
  if (!inp.files[0]) return;
  const fd = new FormData();
  fd.append('file', inp.files[0]);
  fd.append('month', month());
  const r = await fetch('/api/bianche/import_manual', {method:'POST', body:fd}).then(r=>r.json());
  inp.value = '';
  if (r.ok) { showToast(`導入完成`); loadAll(); }
  else alert('導入失敗: ' + (r.error||''));
}

// ══ Utils ══
function fmtN(v) {
  if (v == null) return '';
  const n = Number(v);
  if (isNaN(n)) return String(v);
  return Number.isInteger(n) ? String(n) : parseFloat(n.toFixed(1)).toString();
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg, ms=2000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(()=>t.style.display='none', ms);
}

loadAll();
(async () => {
  try {
    const r = await fetch('/api/me');
    const d = await r.json();
    if (d.ok && d.user && ['admin','manager'].includes(d.user.role)) {
      const btn = document.getElementById('btn-admin-users');
      if (btn) btn.style.display = 'inline-block';
    }
  } catch {}
})();
</script>
