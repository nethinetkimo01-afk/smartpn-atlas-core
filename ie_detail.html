<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IE 明細</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:13px;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
:root{--ph-h:40px;--info-h:60px}

/* ── Page header ─────────────────────────────────── */
.page-header{background:#1a2744;color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.page-header h1{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}
.header-right{display:flex;gap:8px;align-items:center;flex-shrink:0}
.version{font-size:11px;color:#7a9bcc;background:#243356;padding:3px 8px;border-radius:4px}
.btn-link{background:#5c6bc0;color:#fff;text-decoration:none;padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:none}.btn-link:hover{background:#3949ab}
.btn-export{background:#1d9e6b;color:#fff;text-decoration:none;padding:5px 12px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:none;white-space:nowrap}.btn-export:hover{background:#178059}

/* ── Info bar ────────────────────────────────────── */
.info-bar{background:#fff;border-bottom:1px solid #e4e9f2;padding:10px 20px;display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.info-section{display:flex;flex-direction:column;gap:3px;min-width:0}
.info-label{font-size:10px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.info-value{font-size:14px;font-weight:700;color:#1a2744}
.eolr-badge{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:2px 8px;margin-right:4px}
.eolr-60{background:#fff3e0;color:#e65100}.eolr-120{background:#e8f5e9;color:#2e7d32}.eolr-other{background:#f3e5f5;color:#7b1fa2}
.arts-wrap{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.art-chip{display:inline-flex;align-items:center;gap:3px;background:#e8f0fe;color:#1a2744;border-radius:10px;padding:2px 8px 2px 10px;font-size:11px;font-weight:600}
.art-remove{background:none;border:none;color:#7a8fc0;font-size:12px;line-height:1;cursor:pointer;padding:0 1px}.art-remove:hover{color:#cc2222}
.art-add-wrap{display:flex;gap:4px;align-items:center;margin-top:2px}
.art-add-inp{border:1px solid #d0d5e0;border-radius:4px;padding:3px 8px;font-size:11px;width:84px;outline:none}
.art-add-inp:focus{border-color:#4a6cf7}
.btn-art-add{background:#4a6cf7;color:#fff;border:none;border-radius:4px;padding:3px 10px;font-size:11px;cursor:pointer;font-weight:500}.btn-art-add:hover{background:#3a5ce7}
.art-msg{font-size:11px;margin-left:4px}.art-ok{color:#1a7a40}.art-err{color:#cc2222}

/* ── Tab bar ─────────────────────────────────────── */
.tab-bar{background:#fff;border-bottom:2px solid #e4e9f2;padding:0 20px;display:flex;gap:0;overflow-x:auto;position:sticky;top:var(--ph-h);z-index:90;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tab-bar::-webkit-scrollbar{height:3px}.tab-bar::-webkit-scrollbar-thumb{background:#c0c8d8;border-radius:2px}
.tab-btn{padding:9px 14px;border:none;background:transparent;font-size:11px;font-weight:600;color:#777;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .12s,border-color .12s}
.tab-btn:hover{color:#4a6cf7}.tab-btn.active{color:#4a6cf7;border-bottom-color:#4a6cf7}
.tab-divider{width:1px;background:#e4e9f2;margin:8px 4px;align-self:stretch;flex-shrink:0}

/* ── Content ─────────────────────────────────────── */
.content{padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.section-title{font-size:12px;font-weight:700;color:#1a2744;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid #e4e9f2}

/* ── Grid panel ──────────────────────────────────── */
.grid-panel{background:#fff;border-radius:8px;box-shadow:0 1px 8px rgba(0,0,0,.08);overflow:hidden}
.grid-wrap{overflow:auto;max-height:calc(100vh - var(--ph-h) - 200px);position:relative}
.ie-grid{border-collapse:collapse;font-size:11px;font-family:'Consolas','Courier New',monospace;white-space:nowrap}
.ie-grid .rn-cell{background:#e8ecf4;color:#7a8fc0;font-weight:600;font-size:10px;text-align:right;padding:3px 6px;border:1px solid #dce1ec;position:sticky;left:0;z-index:2;min-width:36px;white-space:nowrap}
.ie-grid thead .rn-cell{top:0;z-index:3}
.ie-grid .cn-cell{background:#1a2744;color:#c8d8f0;font-weight:700;font-size:10px;text-align:center;padding:3px 6px;border:1px solid #2e3d5c;position:sticky;top:0;z-index:2;min-width:80px;white-space:nowrap}
.ie-grid .ie-cell{padding:3px 7px;border:1px solid #e8ecf4;min-width:80px;max-width:200px;overflow:hidden;text-overflow:ellipsis;vertical-align:top;background:#fff;color:#1a1a2e;position:relative}
.ie-grid .ie-cell.num{text-align:right;color:#1a4a7a}
.ie-grid .ie-cell.has-f{background:#fffde7}
.ie-grid .ie-cell.has-f .f-mark{font-size:8px;color:#f9a825;position:absolute;top:1px;right:2px;font-style:italic;line-height:1}
.ie-grid tr:hover .ie-cell{background:#f0f4ff}
.ie-grid tr:hover .ie-cell.has-f{background:#fff8d6}
.grid-loading{padding:30px;text-align:center;color:#888;font-size:12px}

/* ── MP Summary ──────────────────────────────────── */
.mp-summary{background:#fff;border-radius:8px;box-shadow:0 1px 8px rgba(0,0,0,.08);padding:14px 20px}
.mp-grid{display:flex;gap:16px;flex-wrap:wrap}
.mp-eolr-block{background:#f7f9fc;border-radius:8px;padding:10px 14px;min-width:260px}
.mp-eolr-header{margin-bottom:8px}
.mp-row{display:flex;gap:8px;flex-wrap:wrap}
.mp-item{display:flex;flex-direction:column;align-items:center;background:#fff;border:1px solid #e4e9f2;border-radius:6px;padding:6px 12px;min-width:64px}
.mp-item-label{font-size:10px;color:#888;font-weight:600;white-space:nowrap}
.mp-item-val{font-size:16px;font-weight:700;color:#1a2744;margin-top:2px}
.mp-item-val.missing{color:#e05252}
.mp-source{font-size:10px;color:#aaa;margin-top:6px}

/* States */
.loading-full{display:flex;align-items:center;justify-content:center;height:40vh;font-size:14px;color:#888}
.error-box{background:#fff3f3;border:1px solid #ffcccc;border-radius:8px;padding:20px;color:#cc2222;font-size:13px}
.placeholder-box{background:#fff;border:1px dashed #c0c8d8;border-radius:8px;padding:30px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#aaa;text-align:center}
.ph-title{font-size:13px;font-weight:600;color:#666}.ph-sub{font-size:12px}
</style>
</head>
<body>

<!-- PAGE HEADER -->
<div class="page-header" id="page-header">
  <h1 id="page-title">IE 明細</h1>
  <div class="header-right">
    <button class="btn-export" id="btn-export" onclick="exportExcel()" style="display:none">⬇ Excel</button>
    <a href="/ie" class="btn-link">← IE 列表</a>
    <div id="status-dot" title="伺服器狀態" style="width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block;flex-shrink:0;cursor:default"></div>
    <button id="btn-reconnect" onclick="reconnect()" style="display:none;background:#ef4444;color:#fff;border:none;border-radius:4px;padding:3px 9px;font-size:11px;cursor:pointer;font-weight:500">重新連線</button>
    <span class="version">v1.2</span>
  </div>
</div>

<!-- INFO BAR -->
<div class="info-bar" id="info-bar" style="display:none">
  <div class="info-section">
    <div class="info-label">鞋型</div>
    <div class="info-value" id="info-model">—</div>
  </div>
  <div class="info-section">
    <div class="info-label">EOLR</div>
    <div class="info-value" id="info-eolr">—</div>
  </div>
  <div class="info-section" style="flex:1;min-width:220px">
    <div class="info-label">ART 列表</div>
    <div class="arts-wrap" id="info-arts">—</div>
    <div class="art-add-wrap" id="art-add-area" style="display:none">
      <input id="art-add-inp" class="art-add-inp" type="text" placeholder="新增 ART" maxlength="10"
             onkeydown="if(event.key==='Enter')addArt()">
      <button class="btn-art-add" onclick="addArt()">+ 新增</button>
      <span class="art-msg" id="art-msg"></span>
    </div>
  </div>
</div>

<!-- TAB BAR (dynamic) -->
<div class="tab-bar" id="tab-bar" style="display:none"></div>

<!-- CONTENT -->
<div class="content" id="content" style="display:none">
  <!-- Active sheet grid -->
  <div class="grid-panel" id="grid-panel">
    <div id="grid-wrap-inner" class="grid-wrap">
      <div class="grid-loading">選擇上方 Sheet 標籤顯示資料</div>
    </div>
  </div>
  <!-- MP Summary -->
  <div class="mp-summary">
    <div class="section-title">MP 彙總（唯讀 · 來自 ob_epph）</div>
    <div class="mp-grid" id="mp-grid">—</div>
  </div>
</div>

<!-- Loading / Error -->
<div class="loading-full" id="loading">載入中...</div>

<script>
let modelData  = null;
let headerId   = null;
let sheetCache = {};   // sheet_name -> grid data (cached after first fetch)
let activeSheet = null;

function getHeaderId(){
  const parts = window.location.pathname.split('/');
  return parseInt(parts[parts.length-1]) || null;
}

// ── Helpers ───────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function eolrBadge(eolr){
  const cls = eolr===60?'eolr-60':eolr===120?'eolr-120':'eolr-other';
  return `<span class="eolr-badge ${cls}">${eolr}</span>`;
}

function fmtMP(v){
  if(v===null||v===undefined||parseFloat(v)===0)
    return '<span class="mp-item-val missing">—</span>';
  return `<span class="mp-item-val">${parseFloat(v).toFixed(1)}</span>`;
}

function colLetter(n){
  let s='';
  while(n>0){ s=String.fromCharCode(64+(n%26||26))+s; n=Math.floor((n-1)/26); }
  return s;
}

function isNumericStr(s){
  if(s===null||s===undefined||s==='') return false;
  return !isNaN(parseFloat(s)) && isFinite(s);
}

function cleanModel(name){
  return (name||'').replace(/\s+Target Output.*$/i,'').replace(/\s{2,}/g,' ').trim() || '—';
}

// ── Tab management ────────────────────────────────
function buildTabBar(sheets){
  const bar = document.getElementById('tab-bar');
  // Two groups: "IE Sheets" and "MP Summary"
  let html = '';
  sheets.forEach((sn, i)=>{
    const label = sn.trim() || `Sheet${i+1}`;
    html += `<button class="tab-btn${i===0?' active':''}" data-sheet="${esc(sn)}" onclick="switchTab(this)">${esc(label)}</button>`;
  });
  // Divider + MP summary tab
  if(sheets.length){
    html += '<div class="tab-divider"></div>';
  }
  html += `<button class="tab-btn${!sheets.length?' active':''}" data-tab="mp" onclick="switchTabMP(this)">MP 彙總</button>`;
  bar.innerHTML = html;
  bar.style.display = 'flex';

  // Auto-load first sheet
  if(sheets.length){
    loadSheet(sheets[0]);
    document.getElementById('grid-panel').style.display='block';
    document.getElementById('mp-grid').closest('.mp-summary').style.display='none';
  }
}

function switchTab(btn){
  document.querySelectorAll('#tab-bar .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const sn = btn.dataset.sheet;
  document.getElementById('grid-panel').style.display='block';
  document.getElementById('mp-grid').closest('.mp-summary').style.display='none';
  loadSheet(sn);
}

function switchTabMP(btn){
  document.querySelectorAll('#tab-bar .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('grid-panel').style.display='none';
  document.getElementById('mp-grid').closest('.mp-summary').style.display='block';
}

// ── Sheet grid loading ────────────────────────────
async function loadSheet(sheetName){
  if(sheetCache[sheetName]){
    renderGrid(sheetCache[sheetName]);
    return;
  }
  const wrap = document.getElementById('grid-wrap-inner');
  wrap.innerHTML='<div class="grid-loading">載入 '+esc(sheetName)+' ...</div>';
  activeSheet = sheetName;
  try{
    const res = await fetch('/api/ie/'+headerId+'/sheet?name='+encodeURIComponent(sheetName));
    const data = await res.json();
    if(!data.ok){ wrap.innerHTML='<div class="grid-loading" style="color:#e05252">錯誤: '+esc(data.error)+'</div>'; return; }
    sheetCache[sheetName] = data;
    if(activeSheet===sheetName) renderGrid(data);
  }catch(e){
    wrap.innerHTML='<div class="grid-loading" style="color:#e05252">載入失敗</div>';
  }
}

// ── Grid render ───────────────────────────────────
function renderGrid(data){
  const wrap = document.getElementById('grid-wrap-inner');
  const {grid, max_row, max_col} = data;

  if(!max_row || !max_col){
    wrap.innerHTML='<div class="grid-loading" style="color:#aaa">此 Sheet 無資料</div>';
    return;
  }

  // Convert grid keys from string (JSON) to int lookup
  // grid[row][col] = {v, f}
  const g = {};
  for(const rk of Object.keys(grid)){
    const ri = parseInt(rk);
    g[ri] = {};
    for(const ck of Object.keys(grid[rk])){
      g[ri][parseInt(ck)] = grid[rk][ck];
    }
  }

  let html = '<table class="ie-grid"><thead><tr>';
  html += '<th class="rn-cell cn-cell"></th>';
  for(let c=1; c<=max_col; c++) html += `<th class="cn-cell">${colLetter(c)}</th>`;
  html += '</tr></thead><tbody>';

  for(let r=1; r<=max_row; r++){
    const rowData = g[r];
    if(!rowData && r > 1) {
      // Skip fully empty rows but keep row numbers contiguous
      html += `<tr><td class="rn-cell">${r}</td>`;
      for(let c=1; c<=max_col; c++) html += '<td class="ie-cell"></td>';
      html += '</tr>';
      continue;
    }
    html += `<tr><td class="rn-cell">${r}</td>`;
    for(let c=1; c<=max_col; c++){
      const cell = (rowData && rowData[c]) ? rowData[c] : null;
      if(!cell){
        html += '<td class="ie-cell"></td>';
      } else {
        const v = cell.v !== null && cell.v !== undefined ? cell.v : '';
        const f = cell.f || '';
        const hasF = !!f;
        const isNum = isNumericStr(v);
        const cls = 'ie-cell'+(isNum?' num':'')+(hasF?' has-f':'');
        const title = hasF ? ` title="${esc(f)}"` : '';
        html += `<td class="${cls}"${title}>${esc(v)}${hasF?'<span class="f-mark">ƒ</span>':''}</td>`;
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

// ── Main load ─────────────────────────────────────
async function loadDetail(){
  headerId = getHeaderId();
  if(!headerId){
    document.getElementById('loading').innerHTML='<div class="error-box">URL 格式錯誤</div>';
    return;
  }
  try{
    const res = await fetch('/api/ie/detail/'+headerId);
    const detail = await res.json();

    if(!detail.ok){
      document.getElementById('loading').innerHTML=`<div class="error-box">錯誤：${esc(detail.error)}</div>`;
      return;
    }
    modelData = detail;

    const h = detail.header;
    const shortName = cleanModel(h.model_name);
    document.getElementById('page-title').textContent = shortName+' · IE 明細';
    document.title = shortName+' · IE 明細';
    document.getElementById('info-model').textContent = shortName;
    document.getElementById('info-eolr').innerHTML = eolrBadge(h.eolr);
    renderArts(detail);
    renderMPSummary(detail);

    const sheets = h.sheets || [];
    buildTabBar(sheets);

    if(!sheets.length){
      document.getElementById('grid-panel').style.display='none';
      document.getElementById('mp-grid').closest('.mp-summary').style.display='block';
    }

    document.getElementById('loading').style.display     = 'none';
    document.getElementById('info-bar').style.display    = 'flex';
    document.getElementById('art-add-area').style.display= 'flex';
    document.getElementById('content').style.display     = 'flex';
    document.getElementById('btn-export').style.display  = 'inline-flex';

    const ph = document.getElementById('page-header').getBoundingClientRect().height;
    document.documentElement.style.setProperty('--ph-h', Math.round(ph)+'px');
  }catch(e){
    document.getElementById('loading').innerHTML='<div class="error-box">伺服器離線，請確認 Flask 服務正在運行</div>';
  }
}

// ── ART management ────────────────────────────────
function renderArts(data){
  const allArts = data.header.arts || [];
  const chips = allArts.map(a=>`
    <span class="art-chip">${esc(a)}<button class="art-remove" title="移除 ${esc(a)}" onclick="removeArt('${esc(a)}')">×</button></span>`).join('');
  document.getElementById('info-arts').innerHTML = chips||'<span style="color:#aaa;font-size:11px">—</span>';
}

async function addArt(){
  const art = document.getElementById('art-add-inp').value.trim().toUpperCase();
  const msg = document.getElementById('art-msg');
  if(!art) return;
  const hid = modelData.header.id;
  try{
    const r = await fetch('/api/ds03/add_art',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({art, header_id:hid})}).then(x=>x.json());
    if(r.ok || String(r.error||'').toLowerCase().includes('already')){
      document.getElementById('art-add-inp').value='';
      if(!modelData.header.arts.includes(art)) modelData.header.arts.push(art);
      renderArts(modelData);
      msg.className='art-msg art-ok'; msg.textContent='已新增'; setTimeout(()=>msg.textContent='',1500);
    }else{
      msg.className='art-msg art-err'; msg.textContent=r.error;
    }
  }catch(e){ msg.className='art-msg art-err'; msg.textContent='伺服器離線'; }
}

async function removeArt(art){
  if(!confirm(`確定移除 ART「${art}」？`)) return;
  const hid = modelData.header.id;
  try{
    const r = await fetch('/api/ie/remove_art',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({art, header_id:hid})}).then(x=>x.json());
    if(r.deleted_header){
      alert('已移除最後一個 ART，鞋型記錄已刪除，返回列表');
      window.location.href='/ie'; return;
    }
    modelData.header.arts = modelData.header.arts.filter(a=>a!==art);
    renderArts(modelData);
  }catch(e){ alert('伺服器離線'); }
}

// ── MP Summary ────────────────────────────────────
function renderMPSummary(data){
  const grid = document.getElementById('mp-grid');
  const h = data.header;
  if(!h){ grid.innerHTML='<span style="color:#aaa;font-size:12px">無資料</span>'; return; }
  const e = h.epph||{};
  grid.innerHTML = `<div class="mp-eolr-block">
    <div class="mp-eolr-header">${eolrBadge(h.eolr)}</div>
    <div class="mp-row">
      <div class="mp-item"><div class="mp-item-label">裁斷MP</div>${fmtMP(e.cutting)}</div>
      <div class="mp-item"><div class="mp-item-label">針車MP</div>${fmtMP(e.stitching)}</div>
      <div class="mp-item"><div class="mp-item-label">成型MP</div>${fmtMP(e.assembly)}</div>
      <div class="mp-item"><div class="mp-item-label">庫存MP</div>${fmtMP(e.stock)}</div>
    </div>
    <div class="mp-source">來源：${esc(e.source||'N/A')}</div>
  </div>`;
}

// ── Export ────────────────────────────────────────
function exportExcel(){ if(headerId) window.location.href='/api/ie/export/'+headerId; }

// ── Health check / status dot ─────────────────────
let _healthTimer = null;

async function _doFetch(){
  const ctrl = new AbortController();
  const tid = setTimeout(()=>ctrl.abort(), 5000);
  try{
    const r = await fetch('/api/health', {signal: ctrl.signal});
    clearTimeout(tid);
    const d = await r.json();
    return !!d.ok;
  }catch(e){ clearTimeout(tid); return false; }
}

async function checkHealth(){
  let ok = await _doFetch();
  if(!ok){
    await new Promise(r=>setTimeout(r, 2000));
    ok = await _doFetch();
  }
  const dot = document.getElementById('status-dot');
  const btn = document.getElementById('btn-reconnect');
  dot.style.background = ok ? '#22c55e' : '#ef4444';
  dot.title = ok ? '伺服器正常' : '伺服器離線';
  if(btn) btn.style.display = ok ? 'none' : 'inline-block';
  if(_healthTimer) clearTimeout(_healthTimer);
  _healthTimer = setTimeout(checkHealth, 30000);
}

async function reconnect(){
  const dot = document.getElementById('status-dot');
  const btn = document.getElementById('btn-reconnect');
  dot.style.background = '#f59e0b';
  dot.title = '連線中...';
  if(btn) btn.style.display = 'none';
  await checkHealth();
}

loadDetail();
checkHealth();
</script>
</body>
</html>
