<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPN Atlas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;background:#F5F5F7;color:#1D1D1F;-webkit-font-smoothing:antialiased;font-size:15px}
.topbar{display:flex;align-items:center;padding:0 40px;height:52px;background:rgba(255,255,255,0.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:0.5px solid #D2D2D7;position:sticky;top:0;z-index:10}
.brand{font-size:17px;font-weight:600;letter-spacing:-0.3px}
.content{max-width:800px;margin:0 auto;padding:72px 40px 80px;display:flex;flex-direction:column;align-items:center}
.hero-title{font-size:40px;font-weight:700;letter-spacing:-1.2px;text-align:center;margin-bottom:10px}
.hero-sub{font-size:16px;color:#86868B;text-align:center;margin-bottom:56px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
@media(max-width:640px){.demo-grid{grid-template-columns:1fr}}
.demo-card{background:#FFFFFF;border:0.5px solid #D2D2D7;border-radius:18px;padding:32px 32px 28px;display:flex;flex-direction:column;gap:20px;transition:box-shadow 0.15s,transform 0.15s}
.demo-card:hover{box-shadow:0 8px 32px rgba(0,0,0,0.09);transform:translateY(-2px)}
.demo-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.demo-icon.brand-icon{background:#0071E3}
.demo-icon.sup-icon{background:#1D1D1F}
.demo-title{font-size:20px;font-weight:600;letter-spacing:-0.4px;color:#1D1D1F}
.demo-desc{font-size:14px;color:#86868B;line-height:1.6}
.demo-cta{display:inline-flex;align-items:center;gap:6px;background:#0071E3;color:#FFFFFF;font-size:14px;font-weight:500;padding:10px 20px;border-radius:20px;text-decoration:none;width:fit-content;transition:opacity 0.1s}
.demo-cta:hover{opacity:0.85}
.demo-cta.dark{background:#1D1D1F}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">SmartPN Atlas</span>
</div>
<div class="content">
  <div class="hero-title">SmartPN Atlas</div>
  <div class="hero-sub">Material Intelligence Platform</div>
  <div class="demo-grid">
    <!-- Brand Demo -->
    <div class="demo-card">
      <div class="demo-icon brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="demo-title">Brand Portal</div>
        <div class="demo-desc" style="margin-top:6px">Search, compare, and source materials. FSM, DPP, ratings, and supplier profiles.</div>
      </div>
      <a class="demo-cta" href="SMARTPN_DEMO.html">Open Brand Demo</a>
    </div>
    <!-- Supplier Demo -->
    <div class="demo-card">
      <div class="demo-icon sup-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="6" width="18" height="13" rx="2" stroke="white" stroke-width="1.5"/>
          <path d="M8 6V5a4 4 0 018 0v1" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="demo-title">Supplier Portal</div>
        <div class="demo-desc" style="margin-top:6px">Create and manage materials. Boss BI, quote tracking, and who-viewed analytics.</div>
      </div>
      <a class="demo-cta dark" href="SMARTPN_DEMO_SUPPLIER.html">Open Supplier Demo</a>
    </div>
  </div>
</div>
</body>
</html>
