<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartPN Atlas — Factory Workspace</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;background:#F5F5F7;color:#1D1D1F}
.topnav{display:flex;align-items:center;gap:14px;background:#1D1D1F;color:#fff;padding:10px 18px}
.nav-brand{font-size:15px;font-weight:600;letter-spacing:-0.2px;white-space:nowrap}
.nav-sub-title{font-size:12px;color:#8E8E93}
.nav-spacer{flex:1}
.nav-actions{display:flex;align-items:center;gap:6px}
.layout{display:flex;align-items:flex-start;gap:16px;padding:16px}
.sidebar{width:220px;background:#fff;border:1px solid #E5E5EA;border-radius:10px;overflow:hidden;flex-shrink:0}
.sidebar-section{font-size:11px;color:#86868B;padding:9px 14px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:14px;color:#1D1D1F;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;border-bottom:0.5px solid #EFEFF4}
.nav-item:hover{background:#F5F5F7}
.nav-item-on{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:14px;width:100%;text-align:left;font-family:inherit;border-bottom:0.5px solid #EFEFF4;background:#F0F7FF;color:#0071E3;font-weight:600;cursor:default}
.nav-chev{margin-left:auto;color:#C7C7CC}
.main{flex:1;min-width:0}
.view{display:none}
.view.active{display:block}
.card{background:#fff;border:1px solid #E5E5EA;border-radius:10px;overflow:hidden;margin-bottom:14px}
.card-hd{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F5F5F7;border-bottom:1px solid #E5E5EA;font-weight:600;font-size:13px}
.card-body{padding:12px 14px;overflow-x:auto}
.page-title{font-size:21px;font-weight:700;letter-spacing:-0.4px}
.page-sub{font-size:12px;color:#86868B;margin-top:2px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;background:#F0F0F2;padding:6px 8px;border:0.5px solid #E3E3E6;font-weight:600;white-space:nowrap}
td{padding:6px 8px;border:0.5px solid #E9E9EC;vertical-align:top}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-block}
.b-open{background:#E7F5EC;color:#1D7340}
.b-granted{background:#E7F0FB;color:#0071E3}
.b-private{background:#FBEFE0;color:#B26A00}
.b-diff{background:#FBEFE0;color:#B26A00}
.b-same{background:#E7F5EC;color:#1D7340}
.btn{font-size:12px;border:1px solid #D2D2D7;background:#fff;color:#1D1D1F;border-radius:7px;padding:4px 11px;cursor:pointer;font-family:inherit}
.btn:hover{background:#F5F5F7}
.btn-on{font-size:12px;border:1px solid #0071E3;background:#0071E3;color:#fff;border-radius:7px;padding:4px 11px;cursor:default;font-family:inherit;display:inline-block}
.state{font-size:12px;color:#86868B;margin-right:4px}
.mono{font-family:Consolas,ui-monospace,monospace}
.note{font-size:11px;color:#86868B;margin-top:8px}
</style>
</head>
<body>

<nav class="topnav">
  <span class="nav-brand">SmartPN Atlas</span>
  <span class="nav-sub-title">Factory Workspace · Apex Factory (factory-01)</span>
  <div class="nav-spacer"></div>
  <div class="nav-actions">
    <span id="acctSwitch"></span>
    <button id="lang-toggle" class="btn" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)" onclick="toggleLang()">中文</button>
  </div>
</nav>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-section" data-i18n="s_brand">Brand</div>
    <div class="nav-group">
      <button class="nav-item" data-view="bom" onclick="showView('bom',this)"><span>🧾</span><span data-i18n="m_bom">品牌 BOM（授權可見）</span><span class="nav-chev">›</span></button>
      <button class="nav-item" data-view="diff" onclick="showView('diff',this)"><span>🔍</span><span data-i18n="m_diff">Shared vs Actual BOM</span><span class="nav-chev">›</span></button>
    </div>
    <div class="sidebar-section" data-i18n="s_mine">Factory</div>
    <div class="nav-group">
      <button class="nav-item" data-view="secondary" onclick="showView('secondary',this)"><span>🏭</span><span data-i18n="m_secondary">我的二次加工編碼</span><span class="nav-chev">›</span></button>
      <button class="nav-item" data-view="mapping" onclick="showView('mapping',this)"><span>🔗</span><span data-i18n="m_mapping">與供應商料號對映</span><span class="nav-chev">›</span></button>
      <button class="nav-item" data-view="excess" onclick="showView('excess',this)"><span>📦</span><span data-i18n="m_excess">餘料處置</span><span class="nav-chev">›</span></button>
    </div>
  </div>

  <div class="main">
    <div class="view active" id="view-bom"></div>
    <div class="view" id="view-diff"></div>
    <div class="view" id="view-secondary"></div>
    <div class="view" id="view-mapping"></div>
    <div class="view" id="view-excess"></div>
  </div>
</div>

<script>
const MOCK_WORLD = (function () {
  const SUP = [
    { id:'FV', name:'Formosa Vietnam Co.', mode:'api', country:'Vietnam', certs:[{name:'OEKO-TEX Standard 100',by:'OEKO-TEX',exp:'2027-03-31'},{name:'GRS',by:'Control Union',exp:'2026-11-30'}] },
    { id:'AP', name:'Apex Textile Co.', mode:'api', country:'Taiwan', certs:[{name:'ISO 9001',by:'BSI',exp:'2027-06-30'},{name:'OEKO-TEX Standard 100',by:'OEKO-TEX',exp:'2026-09-30'}] },
    { id:'SS', name:'Sunrise Synthetics', mode:'smartpn', country:'Vietnam', certs:[{name:'ISO 9001',by:'Intertek',exp:'2026-10-31'}] },
  ];
  const NAMES = { FV:['Recycled Poly Mesh 220g','PU Synthetic Leather 1.2mm','Ripstop Nylon 70D','GRS Knit Upper 380g','TPU Mesh Laminate','Recycled Twill 180g','Eco Sandwich Mesh','Bonded Tricot 150g'],
    AP:['Full Grain Cow Leather','Microfiber Suede 1.0mm','Jacquard Knit 380g','Nubuck Leather 1.4mm','Woven Label Tape','Engineered Mesh 300g','PU Coated Canvas','Ballistic Nylon 1680D'],
    SS:['Commodity Mesh 200g','Poly Oxford 300D','Basic Tricot 120g','PVC Film 0.20mm','Nylon Taffeta 210T','Cotton Canvas 12oz','Foam Sheet EVA 3mm','Non-woven Lining'] };
  const CAT=['Textile','Synthetic Leather','Leather','Film','Mesh','Trim']; const pick=(a,i)=>a[i%a.length]; const materials=[];
  SUP.forEach((s,si)=>{ NAMES[s.id].forEach((nm,mi)=>{ const gi=si*10+mi, spn='SPA-'+s.id+'-'+(1000+gi), pe=3.20+(gi%9)*0.55;
    const src=(a)=>({system:s.mode==='api'?(s.name+' ERP'):'SmartPN',authority:a,sync:(5+gi%40)+' min ago',cached:s.mode!=='api'});
    const fields=[{k:'Category',v:pick(CAT,gi),perm:'public',src:src('Supplier')},{k:'Weight',v:(120+(gi%12)*20)+' g/m²',perm:'public',src:src('Supplier')},{k:'Width',v:(140+(gi%3)*8)+' cm',perm:'public',src:src('Supplier')},{k:'GRS Content',v:(60+(gi%4)*10)+'%',perm:(gi%5===0?'granted':'public'),grantedTo:['Brand-A · R&D'],src:src('Supplier')},{k:'Compliance docs',v:'REACH / SVHC declaration',perm:(gi%4===0?'private':'public'),src:src('Supplier')},{k:'Financial terms',v:'Net 60 · FOB HCMC',perm:'private',src:src('Supplier')}];
    const quotes=[{customer:'Brand-A',tier:'Standard',price:+(pe).toFixed(2),exp:'2026-08-31'},{customer:'Brand-B',tier:'Volume 30k+',price:+(pe-0.35).toFixed(2),exp:'2026-09-15'}];
    const history=[{date:'2026-06-18',field:'GRS Content',old:(50+(gi%4)*10)+'%',new:(60+(gi%4)*10)+'%',by:'Supplier'},{date:'2026-05-30',field:'Weight',old:(110+(gi%12)*20)+' g/m²',new:(120+(gi%12)*20)+' g/m²',by:'Supplier'},{date:'2026-05-12',field:'Width',old:(138+(gi%3)*8)+' cm',new:(140+(gi%3)*8)+' cm',by:'Supplier'}];
    materials.push({id:spn,spn,name:nm,sup:s.id,cat:pick(CAT,gi),mode:s.mode,dppComplete:10+(gi%5),dppTotal:14,fields,quotes,history,reviews:[],threads:[]}); });});
  const byId=id=>materials.find(m=>m.id===id); const gm=byId('SPA-FV-1003'); if(gm)gm.grantedOnly=true;
  const accounts=[{id:'A',name:'Brand-A',visibleIds:['SPA-FV-1000','SPA-FV-1002','SPA-FV-1003','SPA-AP-1010','SPA-SS-1020']},{id:'B',name:'Brand-B',visibleIds:['SPA-FV-1000','SPA-AP-1010','SPA-SS-1020']}];
  const mappingBatches=[{name:'財務 Financial',fields:'單價 / 付款條件 / 幣別',status:'signed',signedBy:'T. Kim',signedAt:'2026-06-10'},{name:'關務 Customs',fields:'HS Code / 原產地 / 稅則',status:'pending',signedBy:null,signedAt:null},{name:'物性 Physical',fields:'成分 / 規格 / 認證欄位',status:'unsubmitted',signedBy:null,signedAt:null}];
  const evidenceRecords=[{ts:'2026-06-19 09:12',event:'exchange.authorized',party:'Brand-A · R&D',batch:'財務 Financial',ref:'EVX-4471'},{ts:'2026-06-18 14:03',event:'exchange.synced',party:'Factory Group B',batch:'關務 Customs',ref:'EVX-4468'},{ts:'2026-06-15 11:47',event:'grant.revoked',party:'Brand-C · 材料部',batch:'物性 Physical',ref:'EVX-4455'}];
  function visibleTo(acc){ const set=new Set(acc.visibleIds); return materials.filter(m=>set.has(m.id)); }
  // ── Task X / 44號檔：交換機制資料模型（六群/狀態機/物性單位/交換事件/API對映）──
  const fieldGroups = [
    {key:'IDENTITY',   label:'料號身份', fields:['spn','name','category','supplier'], defaultPerm:'PUBLIC'},
    {key:'PHYSICAL',   label:'物性',     fields:['weight','width','thickness','composition','colorfastness'], defaultPerm:'PRIVATE'},
    {key:'PROCESS',    label:'工藝',     fields:['method','secondary_chain','yield'], defaultPerm:'PRIVATE'},
    {key:'COMPLIANCE', label:'認證',     fields:['cert','expiry','report_no'], defaultPerm:'PRIVATE'},
    {key:'CUSTOMS',    label:'關務',     fields:['hs_code','origin','customs_code'], defaultPerm:'PRIVATE'},
    {key:'FINANCE',    label:'財務',     fields:['price','currency','payment_terms','moq_tier'], defaultPerm:'PRIVATE'},
  ];
  const units = {
    weight:        {base:'g/m2', options:[{u:'g/m2',f:1},{u:'oz/yd2',f:0.02949}]},
    width:         {base:'cm',   options:[{u:'cm',f:1},{u:'inch',f:0.3937}]},
    thickness:     {base:'mm',   options:[{u:'mm',f:1},{u:'inch',f:0.03937}]},
    composition:   {base:'%',    options:[{u:'%',f:1}]},
    colorfastness: {base:'grade',options:[{u:'grade',f:1}]},
  };
  const requiredByCategory = {
    Textile:['weight','width','composition','colorfastness'],
    Leather:['thickness','area','tanning'],
    Chemical:['solid_content','viscosity','voc'],
  };
  const _methods = ['ASTM D3776','ISO 3801','GB/T 4669'];
  const properties = {};
  materials.forEach((m,i)=>{ properties[m.id] = [
    {key:'weight',      value:120+(i%12)*20, unit:'g/m2', method:_methods[i%3],     tolerance:'±5%',  source:{system:'Supplier ERP',authority:'supplier',sync_at:(5+i%40)+' min ago',cached:false}},
    {key:'width',       value:140+(i%3)*8,   unit:'cm',   method:_methods[(i+1)%3], tolerance:'±1cm', source:{system:'Supplier ERP',authority:'supplier',sync_at:(5+i%40)+' min ago',cached:false}},
    {key:'composition', value:[{material:'Recycled PET',pct:60},{material:'Nylon',pct:40}], unit:'%', method:'', tolerance:'', source:{system:'SmartPN',authority:'supplier',sync_at:'—',cached:true}},
  ]; });
  let _arId=4470;
  const accessRequests = [
    {id:'AR-'+(_arId++), requester:{company:'Brand-A',unit:'R&D',user:'Alice'},  owner:'FV', scope:'SPA-FV-1000', groups:['PHYSICAL'],   purpose:'開發評估', duration:90, created_at:'2026-06-10', status:'ACTIVE'},
    {id:'AR-'+(_arId++), requester:{company:'Brand-A',unit:'採購',user:'Bob'},   owner:'AP', scope:'SPA-AP-1010', groups:['FINANCE'],    purpose:'報價比對', duration:30, created_at:'2026-06-14', status:'REQUESTED'},
    {id:'AR-'+(_arId++), requester:{company:'Brand-B',unit:'材料部',user:'Cara'}, owner:'SS', scope:'全目錄',      groups:['COMPLIANCE'], purpose:'稽核',   duration:60, created_at:'2026-06-12', status:'CONDITIONAL', conditions:['僅COMPLIANCE','限60天','不得轉授']},
  ];
  const grants = [
    {id:'GR-9001', request_id:accessRequests[0].id, groups:['PHYSICAL'], scope:'SPA-FV-1000', expires_at:'2026-09-10', transferable:false, conditions:[]},
  ];
  function _h(s){ let h=5381; s=String(s); for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;} return 'sha256:'+h.toString(16).padStart(8,'0'); }
  const exchanges = [
    {id:'EVX-4471', grant_id:'GR-9001', from:'FV', to:'Brand-A · R&D', material_ids:['SPA-FV-1000'], groups:['PHYSICAL'], mode:'PULL', field_count:5, at:'2026-06-19 09:12', payload_hash:_h('SPA-FV-1000|PHYSICAL|v1'), source_system:'Supplier ERP', initiated_by:'Brand-A'},
  ];
  const apiSpec = {
    auth:{ type:'api_key+secret', scope:'材料集×欄位群×讀寫', revocable:true, rotatable:true },
    endpoints:['GET /v1/materials?updated_since=','GET /v1/materials/{spn}/fields?groups=PHYSICAL,COMPLIANCE','POST /v1/materials/{spn}/fields','GET /v1/grants','POST /v1/access-requests','GET /v1/exchange-events?since='],
    failure:{ pull_fail:'回上次快照+stale=true', conflict:'authority 高者勝(供應商>工廠>品牌快取)', no_api:'CACHED+人工上傳+新鮮度警示' },
  };
  const mappings = [
    {their:'MAT_WT_GSM', ours:'PHYSICAL.weight', unit_from:'g/m2', transform:null, batch:'物性 Physical', signed:false},
    {their:'ITEM_NO',    ours:'IDENTITY.spn',    match:'exact',    batch:'物性 Physical', signed:false},
    {their:'PRICE_USD',  ours:'FINANCE.price',   currency:'USD',   requires_grant:true, batch:'財務 Financial', signed:true},
    {their:'HS_CODE',    ours:'CUSTOMS.hs_code', match:'exact',    batch:'關務 Customs', signed:false},
  ];
  return { suppliers:SUP, materials, accounts, mappingBatches, evidenceRecords, visibleTo,
    fieldGroups, units, requiredByCategory, properties, accessRequests, grants, exchanges, apiSpec, mappings, _h };
})();

/* ═══ 工廠視角 demo（Task E / G-09 候選②）═══
   工廠看到的畫面＝①被授權可見的品牌 BOM/材料 ②自己的二次加工編碼 ③與供應商的料號對映。
   邊界（依 16 號規格）：工廠看不到供應商的私密欄位（價格/財務），也看不到未授權的品牌 BOM。
   一律不呼叫既有兩檔的函式——本檔自帶 chrome，只沿用共用 MOCK_WORLD 與場景面板。 */

let LANG='en';
const STR={
  s_brand:{en:'Brand',zh:'品牌'}, s_mine:{en:'Factory',zh:'工廠'},
  m_bom:{en:'Brand BOM (authorized)',zh:'品牌 BOM（授權可見）'},
  m_diff:{en:'Shared vs Actual BOM',zh:'Shared vs Actual BOM'},
  m_secondary:{en:'My secondary-process codes',zh:'我的二次加工編碼'},
  m_mapping:{en:'Supplier PN mapping',zh:'與供應商料號對映'},
  m_excess:{en:'Excess material',zh:'餘料處置'},
};
function T(k){return (STR[k]||{})[LANG]||k;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* 這家工廠（依 16 號規格 S07/S11：factory-01 / FAC-* 本地碼） */
const FACTORY={id:'factory-01', name:'Apex Factory'};
/* 工廠被授權可見的品牌 BOM（未授權者不進此清單——授權邊界看得見） */
const BOM=[
  {brand:'Brand-A', line:'Upper mesh panel', shared:'SPA-COMP-0101', name:'Laminated black mesh',
   src:['SPA-MAT-0001','SPA-MAT-0002'], local:'FAC-COMP-7008', perm:'granted'},
  {brand:'Brand-A', line:'Tongue foam',      shared:'SPA-COMP-0102', name:'PU foam 3mm',
   src:['SPA-MAT-0011'],                local:'FAC-COMP-7012', perm:'open'},
  {brand:'Brand-A', line:'Outsole film',     shared:'SPA-COMP-0103', name:'TPU laminating film 0.15mm',
   src:['SPA-MAT-0002'],                local:'FAC-COMP-7020', perm:'granted'},
  {brand:'Brand-B', line:'Upper knit panel', shared:'SPB-COMP-0201', name:'Recycled knit upper',
   src:['SPA-MAT-0001'],                local:'FAC-COMP-8110', perm:'granted'},
  {brand:'Brand-B', line:'Heel counter',     shared:'SPB-COMP-0202', name:'TPU heel counter',
   src:['SPA-MAT-0002'],                local:'FAC-COMP-8115', perm:'open'},
];
/* 我的二次加工編碼（工廠自有，SmartPN 統一碼並存——本地碼不被取代） */
const SEC=[
  {local:'FAC-2ND-3301', spn:'SPA-SEC-2001', proc:'Laminating 貼合',  base:'SPA-MAT-0001', out:'Laminated black mesh (2nd)', lt:5},
  {local:'FAC-2ND-3302', spn:'SPA-SEC-2002', proc:'Hot pressing 熱壓', base:'SPA-MAT-0002', out:'Pressed film panel',        lt:3},
  {local:'FAC-2ND-3303', spn:'SPA-SEC-2003', proc:'Skiving 削皮',      base:'SPA-MAT-0011', out:'Skived foam',               lt:2},
];
/* 與供應商的料號對映（S07：三方本地碼保留，統一碼消除歧義）
   品牌本地碼本來就因品牌而異 → 依品牌授權視角分開 */
const MAP={
  'Brand-A':[
    {spn:'SPA-MAT-0001', mine:'FAC-M-2039',  brand:'BR-MAT-7781', sup:'SUP-A-991', supCo:'Formosa Vietnam Co.', status:'confirmed'},
    {spn:'SPA-MAT-0002', mine:'FAC-FILM-445',brand:'BR-FILM-4420',sup:'SUP-B-330', supCo:'Apex Textile Co.',    status:'confirmed'},
    {spn:'SPA-MAT-0011', mine:'FAC-F-1180',  brand:'BR-FOAM-2210',sup:'SUP-C-104', supCo:'Sunrise Synthetics',  status:'pending'},
  ],
  'Brand-B':[
    {spn:'SPA-MAT-0001', mine:'FAC-M-2039',  brand:'B-KNIT-5501', sup:'SUP-A-991', supCo:'Formosa Vietnam Co.', status:'confirmed'},
    {spn:'SPB-MAT-0300', mine:'FAC-TPU-9020',brand:'B-TPU-5510',  sup:'SUP-B-330', supCo:'Apex Textile Co.',    status:'pending'},
  ],
};
/* Shared BOM vs 各廠 Actual BOM（S05）——Shared BOM 是「某個品牌」發的 → 依品牌授權視角分開 */
const ACTUAL={
  'Brand-A':{ shared:'SPA-COMP-0101', s1:'SPA-MAT-0001', s2:'SPA-MAT-0002', line:'Upper mesh panel',
    f:{'Factory A':{combined:'SPA-COMP-0101',  s1:'SPA-MAT-0001', s2:'SPA-MAT-0002', diff:false},
       'Factory B':{combined:'SPA-COMP-0101-B',s1:'SPA-MAT-0001', s2:'SPA-MAT-0048', diff:true}}},
  'Brand-B':{ shared:'SPB-COMP-0201', s1:'SPA-MAT-0001', s2:'SPB-MAT-0300', line:'Upper knit panel',
    f:{'Factory A':{combined:'SPB-COMP-0201',  s1:'SPA-MAT-0001', s2:'SPB-MAT-0300', diff:false},
       'Factory B':{combined:'SPB-COMP-0201',  s1:'SPA-MAT-0001', s2:'SPB-MAT-0300', diff:false}}},
};
/* 餘料處置（S11）：本廠只看得到自己的餘料 */
const EXCESS=[
  {id:'unified-01', spn:'SPA-MAT-0001', local:'factory-code', name:'unified name 01', qty:1, unit:'roll'},
];

const permBadge=p=> p==='open' ? '<span class="badge b-open">OPEN</span>'
                  : p==='granted' ? '<span class="badge b-granted">GRANTED</span>'
                  : '<span class="badge b-private">PRIVATE</span>';
const tbl=(head,rows)=>`<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

/* ── 路由級 lazy mount：只掛載目前視圖的內容（點導覽＝內容真的重繪，非只切 class）── */
let currentView='bom';
const VIEW_RENDER={bom:renderBom, diff:renderDiff, secondary:renderSecondary, mapping:renderMapping, excess:renderExcess};
function showView(id, el){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const t=document.getElementById('view-'+id); if(t) t.classList.add('active');
  currentView=id;
  document.querySelectorAll('.view').forEach(v=>{ if(v.id!=='view-'+id) v.innerHTML=''; });   // 卸載
  (VIEW_RENDER[id]||function(){})();                                                          // 掛載＝真的渲染
  syncNav();
  if(typeof renderAcctSwitch==='function') renderAcctSwitch();   // 品牌切換器只在有品牌脈絡的視圖出現
  window.scrollTo(0,0);
}
/* 套用中的導覽項＝狀態指示(非按鈕)——對已在的頁再按一次本就不會有效果 */
function _swap(el,tag,cls,onclick){
  const n=document.createElement(tag); n.className=cls; n.innerHTML=el.innerHTML;
  const v=el.getAttribute('data-view'); if(v) n.setAttribute('data-view',v);
  if(onclick) n.setAttribute('onclick',onclick); else n.setAttribute('aria-current','true');
  el.replaceWith(n); return n;
}
function syncNav(){
  document.querySelectorAll('[data-view]').forEach(el=>{
    const v=el.getAttribute('data-view'), on=(v===currentView);
    if(on && el.tagName==='BUTTON') _swap(el,'div','nav-item-on',null);
    else if(!on && el.tagName!=='BUTTON') _swap(el,'button','nav-item',`showView('${v}',this)`);
  });
}

      :'Brand issues the same Shared BOM to different factories. Factory may substitute a source if brand-approved. DPP should be based on factory actual BOM.'}</div>

const BRAND_SCOPED=['bom','diff','mapping'];

function renderAcctSwitch(){
  const h=document.getElementById('acctSwitch'); if(!h) return;
  if(BRAND_SCOPED.indexOf(currentView)<0){ h.innerHTML=''; return; }
  h.innerHTML=(MOCK_WORLD.accounts||[]).map(a=>a.id===(PREVIEW||{}).id
    ? `<span aria-current="true" style="font-size:11px;padding:4px 9px;background:#0071E3;color:#fff;display:inline-block">${esc(a.name)}</span>`
    : `<button class="btn" style="font-size:11px;padding:4px 9px;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)" onclick="setAccount('${a.id}')">${esc(a.name)}</button>`).join('');

function setAccount(id){
  PREVIEW=(MOCK_WORLD.accounts||[]).find(a=>a.id===id)||PREVIEW;
  renderAcctSwitch();
  (VIEW_RENDER[currentView]||function(){})();
}

let _gi=0;
function startGuide(){ _gi=0; showGuide(); }
function showGuide(){
  let o=document.getElementById('guideOv');
  if(!o){ o=document.createElement('div'); o.id='guideOv';
    o.style.cssText='position:fixed;right:20px;bottom:72px;z-index:9999;max-width:340px;background:#1D1D1F;color:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.3);font-size:13px;line-height:1.6';
    document.body.appendChild(o); }
  const g=GUIDE[_gi];
  showView(g.v);                       // 每步真的導覽到該視圖 → 畫面內容真的不同
  o.innerHTML=`<div style="font-weight:600;margin-bottom:6px">${LANG==='zh'?'演示流程':'Guided demo'} · ${_gi+1}/${GUIDE.length}</div><div>${LANG==='zh'?g.zh:g.en}</div>
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
      <button onclick="endGuide()" style="font-size:12px;border:none;background:rgba(255,255,255,.15);color:#fff;border-radius:7px;padding:5px 12px;cursor:pointer">${LANG==='zh'?'跳過':'Skip'}</button>
      <button onclick="nextGuide()" style="font-size:12px;border:none;background:#0071E3;color:#fff;border-radius:7px;padding:5px 12px;cursor:pointer">${_gi<GUIDE.length-1?(LANG==='zh'?'下一步':'Next'):(LANG==='zh'?'完成':'Done')}</button></div>`;
}
function nextGuide(){ if(_gi<GUIDE.length-1){ _gi++; showGuide(); } else endGuide(); }
function endGuide(){ const o=document.getElementById('guideOv'); if(o) o.remove(); }
(function guideBtn(){ const b=document.createElement('button'); b.id='guideBtn';
  b.style.cssText='position:fixed;right:20px;bottom:20px;z-index:9998;background:#1D7340;color:#fff;border:none;border-radius:22px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2);font-family:inherit';
  b.textContent='▶ 演示流程 / Guided'; b.onclick=startGuide; document.body.appendChild(b); })();

     views:{'brand-01 (same company)':tbl(['Material','Supplier','Rating','Reason','Visibility'],[['unified name 01','supplier-01','<b>5 stars</b>','stable quality/delivery','private to brand-01'],['unified name 01','supplier-02','<b>1 star</b>','unstable quality/delivery','private to brand-01']]),
            'other company':'<div style="padding:8px;color:#86868B">⛔ 私密評論：private comments not visible to another company</div>'},
     tok:['5 stars','1 star','supplier-01','supplier-02','private','unified name 01']},
  ];
  window.__SCN = SCN;
  let _cur = null, _state = {};
  function ensurePanel(){
    let p = document.getElementById('scnPanel');
    if (!p){ p = document.createElement('div'); p.id='scnPanel';
      p.style.cssText='position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 12px';
      p.innerHTML='<div style="background:#fff;border-radius:14px;max-width:860px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)">'
        +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><b style="font-size:16px">情境 S02–S17（可操作）</b><span style="flex:1"></span>'
        +'<button onclick="closeScenarios()" style="border:none;background:#F0F0F2;border-radius:8px;padding:6px 12px;cursor:pointer">✕ 關閉</button></div>'
        +'<div id="scnList" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px"></div>'
        +'<div id="scnView" style="border-top:1px solid #E3E3E6;padding-top:12px;min-height:120px"></div></div>';
      document.body.appendChild(p);
      document.getElementById('scnList').innerHTML = SCN.map(s=>`<button class="scn-btn" id="scn-btn-${s.id}" onclick="showScn('${s.id}')" style="border:1px solid #D2D2D7;background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;font-weight:600">${s.id}</button>`).join('');
    }
    return p;
  }
  window.openScenarios = function(){ ensurePanel().style.display='flex'; if(!_cur) showScn('S02'); };
  window.closeScenarios = function(){ const p=document.getElementById('scnPanel'); if(p) p.style.display='none'; };
  window.showScn = function(id){
    _cur=id; ensurePanel().style.display='flex';
    document.querySelectorAll('.scn-btn').forEach(b=>b.style.background = (b.id==='scn-btn-'+id)?'#0071E3':'#fff');
    document.querySelectorAll('.scn-btn').forEach(b=>b.style.color = (b.id==='scn-btn-'+id)?'#fff':'#1D1D1F');
    renderScn(id);
  };
  function renderScn(id){
    const s = SCN.find(x=>x.id===id); const v=document.getElementById('scnView'); if(!s||!v) return;
    let ctrl='', bodyKey='';
    if (s.cur!=null){ // Current / After toggle
      const st=_state[id]||'after';
      // Task D：套用中的態＝狀態指示(span,非按鈕)——對已選的態再按一次本來就不會有任何效果
      const _cw=(val,label,col)=> st===val
        ? `<span aria-current="true" style="border:1px solid ${col};background:${col};color:#fff;border-radius:7px;padding:4px 12px;font-size:12px;cursor:default;display:inline-block">${label}</span>`
        : `<button class="scn-ctrl" onclick="scnSet('${id}','${val}')" style="border:1px solid #D2D2D7;background:#fff;color:#1D1D1F;border-radius:7px;padding:4px 12px;font-size:12px;cursor:pointer">${label}</button>`;
      ctrl=`<div style="display:flex;gap:6px;margin-bottom:8px">
        <span style="font-size:12px;color:#86868B;align-self:center;margin-right:2px">檢視：${st==='cur'?'Current':'After (SmartPN)'}</span>
        ${_cw('cur','Current','#1D1D1F')}${_cw('after','After (SmartPN)','#0071E3')}</div>`;
      bodyKey = (st==='cur') ? s.cur : s.aft;
    } else if (s.sel){ // selector
      const st=_state[id]||s.sel[0];
      ctrl=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        <span style="font-size:12px;color:#86868B;align-self:center;margin-right:2px">目前：${st}</span>
        ${s.sel.map(o=> o===st
          ? `<span aria-current="true" style="border:1px solid #0071E3;background:#0071E3;color:#fff;border-radius:7px;padding:4px 12px;font-size:12px;cursor:default;display:inline-block">${o}</span>`
          : `<button class="scn-ctrl" onclick="scnSet('${id}','${o}')" style="border:1px solid #D2D2D7;background:#fff;color:#1D1D1F;border-radius:7px;padding:4px 12px;font-size:12px;cursor:pointer">${o}</button>`).join('')}</div>`;
      bodyKey = s.views[st] || '';
    } else if (s.wf){ // workflow stepper + role visibility
      const step=_state[id]!=null?_state[id]:0;
      const _mk=(i)=> i<step?'✓':(i===step?'▶':'○');
      const steps = `<span style="font-size:12px;color:#86868B;margin-right:6px">步驟 ${step+1}/${s.wf.length}</span>`
        + s.wf.map((w,i)=>`<span style="padding:4px 9px;border-radius:7px;font-size:12px;${i<=step?'background:#1D7340;color:#fff':'background:#F0F0F2;color:#86868B'}">${_mk(i)} ${i+1}.${w}</span>`).join(' <span style="color:#C7C7CC">→</span> ');
      const done = step>=s.wf.length-1;
      const roles = Object.entries(s.roles).map(([r,txt])=>`<div style="font-size:12px;margin:3px 0">${r}：${done?txt:'（尚未發布）'}</div>`).join('');
      ctrl=`<div style="margin-bottom:8px">${steps}</div><button class="scn-ctrl" onclick="scnStep('${id}')" style="border:none;background:#0071E3;color:#fff;border-radius:7px;padding:5px 14px;font-size:12px;cursor:pointer;font-weight:600">${done?'↺ 重來':'下一步 →'}</button>`;
      bodyKey = `<div style="margin-top:10px">${roles}</div><div style="font-size:11px;color:#86868B;margin-top:6px">${(s.tok||[]).join(' · ')}</div>`;
    }
    v.innerHTML = `<div style="font-weight:700;margin-bottom:8px">${s.id} · ${s.t}</div>${ctrl}<div id="scnBody">${bodyKey}</div>${s.note?`<div style="font-size:11px;color:#86868B;margin-top:6px">${s.note}</div>`:''}`;
  }
  window.scnSet = function(id,val){ _state[id]=val; renderScn(id); };
  window.scnStep = function(id){ const s=SCN.find(x=>x.id===id); const cur=_state[id]!=null?_state[id]:0; _state[id]=(cur>=s.wf.length-1)?0:cur+1; renderScn(id); };
  // 導覽入口（品牌 topnav / 供應商 sidebar 皆補一顆）
  (function injectEntry(){
    const b=document.createElement('button'); b.id='scnEntry'; b.textContent='情境 S02–S17';
    b.onclick=window.openScenarios;
    b.style.cssText='position:fixed;left:20px;bottom:20px;z-index:9001;background:#5E5CE6;color:#fff;border:none;border-radius:22px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2);font-family:inherit';
    document.body.appendChild(b);
  })();
})();

/* ─ 測試鉤子 + V1_PARITY（工廠視角公開函式）─ */
window.MOCK_WORLD = MOCK_WORLD;
window.getVisibleMaterials = ()=>MOCK_WORLD.visibleTo(PREVIEW);
window.setLang = (lg)=>{ if(lg && ((lg==='zh')!==(LANG==='zh'))) toggleLang(); };
window.V1_PARITY = ['T','esc','showView','syncNav','renderBom','renderDiff','renderSecondary','renderMapping',
  'renderExcess','setDiff','setEx','setAccount','renderAcctSwitch','toggleLang','startGuide','showGuide',
  'nextGuide','endGuide','permBadge','tbl'];

/* INIT：預設落地＝品牌 BOM（真實首頁，非 splash；側欄可導回） */
PREVIEW = MOCK_WORLD.accounts[0];
renderAcctSwitch();
showView('bom');
</script>
