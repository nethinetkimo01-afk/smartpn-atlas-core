<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartPN Atlas — S09 Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'SF Pro Text', Arial, sans-serif; background: #fff; color: #1A1A1A; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 0.5px solid #E5E5E5; }
    .brand { font-size: 15px; font-weight: 500; color: #54463A; }
    .scenario-tag { font-size: 12px; color: #888; border: 0.5px solid #E5E5E5; border-radius: 20px; padding: 4px 12px; }
    .section-bar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 0.5px solid #E5E5E5; }
    .role-label { font-size: 12px; color: #999; }
    .role-btns { display: flex; gap: 6px; }
    .role-btn { font-size: 11px; padding: 5px 14px; border-radius: 20px; border: 0.5px solid #E5E5E5; background: transparent; color: #666; cursor: pointer; }
    .role-btn.active { background: #54463A; color: #fff; border-color: #54463A; }
    .content { padding: 20px 24px; }
    .workflow { display: flex; align-items: center; gap: 0; margin-bottom: 24px; flex-wrap: wrap; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 100px; }
    .step-circle { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #E5E5E5; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #999; transition: all 0.3s; }
    .step-circle.done { background: #54463A; border-color: #54463A; color: #fff; }
    .step-circle.active { background: #FAFAF8; border-color: #54463A; color: #54463A; }
    .step-label { font-size: 11px; color: #888; text-align: center; }
    .step-by { font-size: 10px; color: #BBB; text-align: center; }
    .arrow { font-size: 16px; color: #E5E5E5; padding: 0 4px; margin-bottom: 20px; }
    .card { border: 0.5px solid #E5E5E5; border-radius: 10px; overflow: hidden; }
    .card-header { padding: 10px 16px; background: #FAFAF8; border-bottom: 0.5px solid #E5E5E5; font-size: 12px; font-weight: 500; color: #54463A; text-transform: uppercase; letter-spacing: 0.04em; }
    table { width: 100%; border-collapse: collapse; }
    thead th { font-size: 11px; font-weight: 500; color: #999; text-align: left; padding: 0 14px 10px; border-bottom: 0.5px solid #E5E5E5; letter-spacing: 0.04em; text-transform: uppercase; }
    tbody tr { border-bottom: 0.5px solid #F0F0F0; }
    tbody td { font-size: 13px; padding: 11px 14px; }
    .status-draft { background: #F5F5F5; color: #888; }
    .status-pending { background: #FFF8E6; color: #8A6A00; }
    .status-approved { background: #E8F0FB; color: #1A6ABA; }
    .status-published { background: #EAF3DE; color: #3B6D11; }
    .badge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; display: inline-block; }
    .note { font-size: 12px; color: #666; padding: 10px 14px; background: #FAFAF8; border-radius: 8px; border-left: 2px solid #54463A; margin-top: 16px; }
    .not-visible { text-align: center; padding: 32px; color: #999; font-size: 13px; }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="brand">SmartPN Atlas</span>
    <span class="scenario-tag">S09 — Supplier Controls Publishing</span>
  </div>

  <div class="section-bar">
    <span class="role-label">View as:</span>
    <div class="role-btns">
      <button class="role-btn active" onclick="setRole('editor', this)">Supplier Editor</button>
      <button class="role-btn" onclick="setRole('reviewer', this)">Supplier Reviewer</button>
      <button class="role-btn" onclick="setRole('publisher', this)">Supplier Publisher</button>
      <button class="role-btn" onclick="setRole('brand', this)">Brand User</button>
      <button class="role-btn" onclick="setRole('nonbrand', this)">Non-Brand User</button>
    </div>
  </div>

  <div class="content">
    <div class="workflow">
      <div class="step"><div class="step-circle" id="step1">1</div><div class="step-label">Draft</div><div class="step-by">editor-01</div></div>
      <span class="arrow">›</span>
      <div class="step"><div class="step-circle" id="step2">2</div><div class="step-label">Pending Review</div><div class="step-by">editor-01</div></div>
      <span class="arrow">›</span>
      <div class="step"><div class="step-circle" id="step3">3</div><div class="step-label">Approved</div><div class="step-by">reviewer-01</div></div>
      <span class="arrow">›</span>
      <div class="step"><div class="step-circle" id="step4">4</div><div class="step-label">Published</div><div class="step-by">publisher-01</div></div>
    </div>

    <div class="card">
      <div class="card-header" id="card-title">Material Record</div>
      <div id="card-body"></div>
    </div>

    <div class="note" id="bottom-note"></div>
  </div>

  <script>
    const roles = {
      editor: {
        step: 2,
        rows: [
          { field: 'Local ID', val: 'supplier-code', src: 'Supplier system' },
          { field: 'Unified ID', val: 'unified-01', src: 'SmartPN Atlas' },
          { field: 'Material Name', val: 'unified name 01', src: 'SmartPN Atlas' },
          { field: 'Status', val: '<span class="badge status-pending">Pending Review</span>', src: '' },
        ],
        note: 'editor-01: edits material fields, saves draft, submits for review. Current status: Pending Review.',
      },
      reviewer: {
        step: 3,
        rows: [
          { field: 'Local ID', val: 'supplier-code', src: 'Supplier system' },
          { field: 'Unified ID', val: 'unified-01', src: 'SmartPN Atlas' },
          { field: 'Material Name', val: 'unified name 01', src: 'SmartPN Atlas' },
          { field: 'Status', val: '<span class="badge status-approved">Approved</span>', src: '' },
        ],
        note: 'reviewer-01: reviews submission, approves. Status advances to Approved.',
      },
      publisher: {
        step: 4,
        rows: [
          { field: 'Local ID', val: 'supplier-code', src: 'Supplier system' },
          { field: 'Unified ID', val: 'unified-01', src: 'SmartPN Atlas' },
          { field: 'Material Name', val: 'unified name 01', src: 'SmartPN Atlas' },
          { field: 'Status', val: '<span class="badge status-published">Published</span>', src: '' },
          { field: 'Visible to', val: 'Brand users (authorized)', src: '' },
        ],
        note: 'publisher-01: publishes material, manages permission settings.',
      },
      brand: {
        step: 4,
        rows: [
          { field: 'Unified ID', val: 'unified-01', src: 'SmartPN Atlas' },
          { field: 'Material Name', val: 'unified name 01', src: '' },
          { field: 'Status', val: '<span class="badge status-published">Published</span>', src: '' },
        ],
        note: 'Brand user sees published material after supplier opens visibility.',
      },
      nonbrand: {
        step: 4,
        rows: null,
        note: 'Non-authorized user: material is not visible.',
      },
    };

    function setRole(role, btn) {
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const d = roles[role];

      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById('step' + i);
        el.className = 'step-circle' + (i < d.step ? ' done' : i === d.step ? ' active' : '');
      }

      const body = document.getElementById('card-body');
      if (!d.rows) {
        body.innerHTML = '<div class="not-visible">No materials visible with current permissions.</div>';
      } else {
        body.innerHTML = `<table>
          <thead><tr><th>Field</th><th>Value</th><th>Source</th></tr></thead>
          <tbody>${d.rows.map(r => `<tr><td style="color:#888">${r.field}</td><td>${r.val}</td><td style="color:#888;font-size:12px">${r.src}</td></tr>`).join('')}</tbody>
        </table>`;
      }

      document.getElementById('bottom-note').textContent = d.note;
    }

    setRole('editor', document.querySelector('.role-btn'));
  </script>
</body>
</html>
