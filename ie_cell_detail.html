<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IE 細表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;background:#FFFFFF;color:#1C1C1E;min-height:100vh}

/* ── Topbar ───────────────────────────────────────── */
.topbar{background:#F5F5F7;color:#1D1D1F;padding:9px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;border-bottom:1px solid #E5E5EA;flex-wrap:wrap}
.topbar-model{font-size:14px;font-weight:700;white-space:nowrap}
.topbar-meta{font-size:11px;color:#8E8E93;white-space:nowrap}
.eolr-badge{font-size:10px;background:#F5F5F7;color:#1D1D1F;border:1px solid #C7C7CC;border-radius:4px;padding:2px 7px;font-weight:700;white-space:nowrap}
.topbar-spacer{flex:1}
.stage-select{background:#F5F5F7;color:#1D1D1F;border:1px solid #C7C7CC;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;min-width:90px}
.stage-select option{background:#fff;color:#1D1D1F}
.toggle-group{display:flex;gap:2px;background:#E5E5EA;border-radius:6px;padding:3px}
.tg-btn{background:transparent;color:#8E8E93;border:none;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.tg-btn.active{background:#007AFF;color:#fff}
.tg-btn.lang-active{background:#34C759;color:#fff}
.btn-sm{background:#007AFF;color:#fff;border:none;border-radius:5px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.btn-sm:hover{background:#0066CC}
.btn-outline{background:transparent;color:#1D1D1F;border:1px solid #C7C7CC;border-radius:5px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn-outline:hover{background:#E5E5EA;color:#1D1D1F}
.back-link{color:#1D1D1F;text-decoration:none;font-size:11px;display:flex;align-items:center;gap:4px}
.back-link:hover{color:#0066CC}

/* ── Tab bar ──────────────────────────────────────── */
.tab-bar{background:#fff;border-bottom:1px solid #E5E5EA;padding:0 18px;display:flex;overflow-x:auto;position:sticky;top:46px;z-index:90}
.tab-btn{padding:9px 16px;border:none;background:transparent;font-size:12px;font-weight:600;color:#8E8E93;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .12s,border-color .12s}
.tab-btn:hover{color:#007AFF}
.tab-btn.active{color:#007AFF;border-bottom-color:#007AFF}

/* ── Content / Zone ───────────────────────────────── */
.content{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.zone-card{background:#fff;border-radius:8px;border:1px solid #E5E5EA;overflow:hidden}
.zone-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#F5F5F7;border-bottom:1px solid #E5E5EA}
.zone-header.ws{background:#F5F5F7;border-bottom-color:#E5E5EA}
.zone-header.offline{background:#F5F5F7;border-bottom-color:#E5E5EA}
.zone-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zone-name{font-size:12px;font-weight:700;color:#1C1C1E}
.zone-header.ws .zone-name{color:#1C1C1E}
.zone-header.offline .zone-name{color:#1C1C1E}
.zone-count{font-size:10px;color:#8E8E93}
.badge{font-size:10px;border-radius:3px;padding:1px 6px;font-weight:600}
.badge-lock{background:#F2F2F7;color:#8E8E93}
.badge-ws{background:#F2F2F7;color:#3A3A3C}
.badge-off{background:#F2F2F7;color:#3A3A3C}
.badge-pend{background:#FFF3E0;color:#E65100}
.zone-actions{display:flex;align-items:center;gap:6px}
.btn-add{background:#007AFF;color:#fff;border:none;border-radius:4px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer}
.btn-add:hover{background:#0066CC}
.btn-group{background:#007AFF;color:#fff;border:none;border-radius:4px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer}
.btn-group:hover{background:#0066CC}
.zone-body{overflow-x:auto}

/* ── proc-table ───────────────────────────────────── */
.proc-table{border-collapse:collapse;width:100%;font-size:11px;border:1px solid #E5E5EA}
.proc-table th{background:#1C1C1E;color:#fff;padding:5px 8px;text-align:center;font-size:10px;font-weight:600;white-space:nowrap;border:1px solid #3A3A3C}
.proc-table th.left{text-align:left}
.proc-table th.th-theory{background:#1C1C1E;color:#8E8E93}
.proc-table th.th-actual{background:#1C1C1E;color:#fff}
.proc-table td{padding:4px 8px;border:1px solid #E5E5EA;vertical-align:middle;white-space:nowrap;color:#1C1C1E;background:#fff}
.proc-table tr:hover td{background:#fff}
.proc-table td.seq{text-align:center;color:#8E8E93;font-weight:600;min-width:30px}
.proc-table td.name{text-align:left;min-width:120px;max-width:220px;white-space:normal;line-height:1.4;color:#1C1C1E}

/* 手工格：黑字 + 中灰邊框，點擊後藍框 */
.proc-table td.num{text-align:right;min-width:60px;color:#1C1C1E;font-family:Consolas,monospace;background:#fff;border:1px solid #C7C7CC;cursor:text;padding:1px 2px!important}
.proc-table td.num:focus-within{border-color:#007AFF}

/* 公式格：無框、無底色，純文字顯示（黑字與手工格同） */
.formula-cell{color:#000000;text-align:right;min-width:60px;font-family:Consolas,monospace;cursor:default;background:transparent!important;border:none!important}

/* 實際人數格（手工） */
.actual-cell{color:#1C1C1E;text-align:right;min-width:60px;font-family:Consolas,monospace;font-weight:600;background:#fff;border:1px solid #C7C7CC;padding:1px 2px!important}
.actual-cell.clickable{cursor:text}
.actual-cell input{width:100%;box-sizing:border-box;border:1px solid #C7C7CC;border-radius:2px;padding:1px 4px;font-size:11px;font-family:Consolas,monospace;text-align:right;outline:none;background:#fff;-moz-appearance:textfield}
.actual-cell input:focus{border-color:#007AFF}
.actual-cell input::-webkit-outer-spin-button,.actual-cell input::-webkit-inner-spin-button{-webkit-appearance:none}
.cut-act-inp{border:1px solid #C7C7CC;border-radius:2px;padding:1px 3px;font-size:10px;text-align:right;outline:none;width:44px;background:#fff;-moz-appearance:textfield}
.cut-act-inp:focus{border-color:#007AFF}
.cut-act-inp::-webkit-outer-spin-button,.cut-act-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.cut-merge-btn{background:transparent;border:1px solid #C7C7CC;border-radius:2px;color:#000000;font-size:9px;cursor:pointer;padding:1px 3px;flex-shrink:0;line-height:1.4}
.cut-merge-btn:hover{border-color:#007AFF;color:#007AFF}
/* 常駐顯示手工輸入格 */
.cell-inp{width:100%;box-sizing:border-box;border:1px solid #C7C7CC;padding:2px 4px;font-size:11px;font-family:Consolas,monospace;text-align:right;outline:none;background:#fff;color:#000000;-moz-appearance:textfield}
.cell-inp:focus{border-color:#007AFF}
.cell-inp::-webkit-outer-spin-button,.cell-inp::-webkit-inner-spin-button{-webkit-appearance:none}

/* 鎖定格：同公式格樣式（灰字） */
.locked-cell{background:#fff;color:#8E8E93;cursor:default;border:1px solid #E5E5EA!important}

/* 刪除格 */
.del-cell{width:22px;text-align:center;padding:2px 4px;border:1px solid #E5E5EA}
.btn-del{background:transparent;border:none;color:#000000;font-size:14px;cursor:pointer;padding:0 2px;border-radius:3px;line-height:1}
.btn-del:hover{color:#FF3B30;background:#FFF2F1}

/* 合併格 */
.group-cell{background:#fff;color:#1C1C1E;font-weight:700;text-align:right;font-family:Consolas,monospace;border:1px solid #C7C7CC}
.group-badge{font-size:9px;background:#F2F2F7;color:#8E8E93;border-radius:3px;padding:0 4px;margin-left:4px;font-weight:600}

/* 手工小計列 */
.hand-total{padding:10px 14px;background:#FFFFFF;border-top:1px solid #E5E5EA;display:flex;align-items:center;gap:12px}
.hand-total-label{font-size:12px;font-weight:700;color:#1C1C1E}
.hand-total-val{font-size:18px;font-weight:700;color:#1C1C1E;font-family:Consolas,monospace}

/* ── Save bar ─────────────────────────────────────── */
.save-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #E5E5EA;padding:10px 18px;display:flex;gap:10px;align-items:center;z-index:80;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.save-bar-msg{flex:1;font-size:12px;color:#8E8E93}
.pdot{display:inline-block;width:8px;height:8px;background:#FF9F0A;border-radius:50%;margin-right:4px}
.btn-save-all{background:#007AFF;color:#fff;border:none;border-radius:6px;padding:7px 18px;font-size:12px;font-weight:700;cursor:pointer}
.btn-save-all:hover{background:#0066CC}
.btn-save-all:disabled{background:#C7C7CC;cursor:not-allowed}

/* ── Modals ───────────────────────────────────────── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:12px;padding:24px;min-width:380px;max-width:520px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-title{font-size:14px;font-weight:700;color:#1C1C1E;margin-bottom:16px}
.modal-label{font-size:11px;color:#8E8E93;font-weight:600;margin-bottom:4px;display:block}
.modal-input{width:100%;border:1px solid #C7C7CC;border-radius:6px;padding:6px 10px;font-size:12px;margin-bottom:12px;outline:none}
.modal-input:focus{border-color:#007AFF}
.proc-check-list{border:1px solid #E5E5EA;border-radius:6px;padding:8px;max-height:220px;overflow-y:auto;margin-bottom:12px}
.proc-check-item{display:flex;align-items:flex-start;gap:8px;padding:4px 0;border-bottom:1px solid #F2F2F7;font-size:11px}
.proc-check-item:last-child{border-bottom:none}
.proc-check-item input{margin-top:2px;flex-shrink:0}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn-mcancel{background:transparent;border:1px solid #C7C7CC;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;color:#1C1C1E}
.btn-mok{background:#007AFF;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}

/* ── Loading / Error ──────────────────────────────── */
.loading-msg{padding:40px;text-align:center;color:#8E8E93;font-size:13px}
.error-msg{padding:20px;color:#FF3B30;font-size:12px}

/* ── cut-table (Cutting 段 4 列表頭) ──────────────── */
.cut-table th{background:#1C1C1E;color:#fff;padding:3px 5px;text-align:center;font-size:9px;font-weight:600;white-space:nowrap;border:1px solid #3A3A3C}
.cut-table th.left{text-align:left}
.th-cut-group{background:#1C1C1E;color:#fff;text-align:center;font-size:10px;font-weight:700}
.th-post-group{background:#1C1C1E;color:#fff;text-align:center;font-size:10px;font-weight:700}
.th-vi{background:#1C1C1E;color:#6E6E73;font-size:9px;font-weight:400;font-style:italic}
.th-en{background:#1C1C1E;color:#6E6E73;font-size:9px;font-weight:400;font-style:italic}
.th-zh{background:#1C1C1E;color:#fff;font-size:9px;font-weight:600}
.th-zh.th-formula-col{background:#1C1C1E;color:#8E8E93}
.th-zh.th-theory-col{background:#1C1C1E;color:#8E8E93}
.th-zh.th-actual-col{background:#1C1C1E;color:#fff;font-weight:700}
.name-zh{font-size:9px;color:#000000;margin-top:1px}

/* ── Inline add row ───────────────────────────────── */
.add-row-inline td{background:#FFFFFF!important;padding:2px 3px}
.add-inp{width:100%;border:1px solid #C7C7CC;border-radius:2px;padding:1px 3px;font-size:10px;background:#fff;outline:none}
.add-inp:focus{border-color:#007AFF}
.btn-inline-ok{background:#007AFF;color:#fff;border:none;border-radius:3px;padding:2px 7px;font-size:10px;cursor:pointer;font-weight:700}
.btn-inline-ok:hover{background:#0066CC}
.btn-inline-cancel{background:#F2F2F7;color:#1C1C1E;border:none;border-radius:3px;padding:2px 5px;font-size:10px;cursor:pointer;margin-left:2px}

/* ── + trigger row ────────────────────────────────── */
.add-trigger-row td{background:transparent;border:none;padding:0}
.add-trigger-cell{text-align:center;padding:1px 2px!important;width:22px;min-width:22px}
.btn-add-zone{background:transparent;border:1px dashed #C7C7CC;border-radius:3px;color:#000000;font-size:13px;font-weight:700;cursor:pointer;padding:1px 6px;line-height:1.6}
.btn-add-zone:hover{color:#007AFF;border-color:#007AFF;background:#F0F7FF}

/* ── Group-action mini popup ──────────────────────── */
.group-action-popup{position:fixed;background:#fff;border:1px solid #E5E5EA;border-radius:8px;padding:10px;z-index:400;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:170px}
.gap-title{font-size:11px;font-weight:700;color:#1C1C1E;margin-bottom:8px}
.gap-row{display:flex;gap:4px;margin-bottom:6px;align-items:center}
.gap-label{font-size:10px;color:#8E8E93;white-space:nowrap}
.gap-inp{width:64px;border:1px solid #C7C7CC;border-radius:4px;padding:3px 6px;font-size:11px;font-family:Consolas,monospace;text-align:right;outline:none}
.gap-inp:focus{border-color:#007AFF}
.gap-btn-save{background:#1C1C1E;color:#fff;border:none;border-radius:4px;padding:4px 8px;font-size:10px;cursor:pointer;flex-shrink:0}
.gap-btn-del{background:transparent;color:#FF3B30;border:1px solid #FFCCCC;border-radius:4px;padding:5px;font-size:10px;cursor:pointer;width:100%;margin-top:4px}
.gap-btn-del:hover{background:#FFF2F1}

/* ── Custom tooltip ───────────────────────────────── */
#cellTip{position:fixed;background:#1C1C1E;color:#fff;font-size:10px;padding:2px 8px;border-radius:4px;pointer-events:none;z-index:500;display:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* ── Save dropdown ────────────────────────────────── */
.save-dropdown{position:relative;display:inline-block}
.save-dropdown-menu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid #C7C7CC;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:300;min-width:140px;padding:4px 0}
.save-dropdown-menu button{display:block;width:100%;padding:8px 16px;border:none;background:transparent;text-align:left;font-size:12px;cursor:pointer;color:#1D1D1F;white-space:nowrap}
.save-dropdown-menu button:hover{background:#F5F5F7}
</style>
</head>
<body>
<div id="cellTip"></div>

<div class="topbar">
  <a class="back-link" href="/ie">← 返回列表</a>
  <div class="topbar-model" id="modelName">載入中…</div>
  <div class="eolr-badge" id="eolrBadge">EOLR 120</div>
  <div class="topbar-meta" id="modelMeta"></div>
  <div class="topbar-spacer"></div>
  <select class="stage-select" id="stageSelect" onchange="switchStage(this.value)">
    <option value="">— 版本 —</option>
  </select>
  <div class="toggle-group">
    <button class="tg-btn" id="langZH" onclick="setLang('zh')">中</button>
    <button class="tg-btn" id="langVI"  onclick="setLang('vi')">越</button>
  </div>
  <div class="toggle-group">
    <button class="tg-btn" id="eolr60"  onclick="setEolr(60)">EOLR 60</button>
    <button class="tg-btn active" id="eolr120" onclick="setEolr(120)">EOLR 120</button>
  </div>
  <a href="/admin/users" class="btn-outline" id="btn-admin-users" style="display:none">帳號管理</a>
  <div class="save-dropdown" id="saveDropdown">
    <button class="btn-sm" onclick="toggleSaveDropdown()">儲存 ▼</button>
    <div class="save-dropdown-menu" id="saveDropdownMenu" style="display:none">
      <button onclick="saveSilent();closeSaveDropdown()">儲存</button>
      <button onclick="newStage();closeSaveDropdown()">另存新階段</button>
    </div>
  </div>
  <button class="btn-outline" id="btn-submit-review" onclick="submitForReview()" style="display:none;border-color:#1d9e6b;color:#1d9e6b">送審</button>
  <button class="btn-sm" id="btn-approve-stage" onclick="approveCurrentStage()" style="display:none;background:#1d9e6b">✓ 設為合格版</button>
  <span id="review-status-badge" style="font-size:11px;padding:3px 8px;border-radius:10px;display:none"></span>
  <button id="btn-update" onclick="doUpdate()" style="display:none;border:none;border-radius:5px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;background:#aaa;color:#fff" title="程式版本狀態">已是最新</button>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-seg="cutting"  onclick="switchSeg('cutting')">裁斷 Cutting</button>
  <button class="tab-btn" data-seg="stitching" onclick="switchSeg('stitching')">針車 Stitching</button>
  <button class="tab-btn" data-seg="assembly"  onclick="switchSeg('assembly')">成型 Assembly</button>
  <button class="tab-btn" data-seg="stf"       onclick="switchSeg('stf')">STF</button>
</div>

<div class="content" id="mainContent">
  <div class="loading-msg">載入中…</div>
</div>

<div class="save-bar" id="saveBar" style="display:none">
  <div class="save-bar-msg" id="saveBarMsg"><span class="pdot"></span>有 <span id="pendingCount">0</span> 項待儲存</div>
  <button class="btn-save-all" id="btnSaveAll" onclick="saveSilent()">儲存</button>
</div>

<!-- 合併實際人數 Modal（Cutting段） -->
<div class="modal-overlay" id="mergeModal">
  <div class="modal-box">
    <div class="modal-title" id="mergeModalTitle">設定實際人數</div>
    <div style="font-size:11px;color:#666;margin-bottom:10px">勾選需合併的工序，填入合計人數；只選一個工序 = 單獨設定</div>
    <label class="modal-label">本區工序清單</label>
    <div class="proc-check-list" id="mergeProcList"></div>
    <label class="modal-label">合計人數</label>
    <input class="modal-input" type="text" id="mergeHeadcount" placeholder="例如: 2"
      onkeydown="if(event.key==='Enter')submitMerge()">
    <div class="modal-footer">
      <button class="btn-mcancel" onclick="closeMergeModal()">取消</button>
      <button class="btn-mok" onclick="submitMerge()">儲存</button>
    </div>
  </div>
</div>

<!-- 新增工序 Modal（非cutting段用） -->
<div class="modal-overlay" id="addRowModal">
  <div class="modal-box">
    <div class="modal-title" id="addRowTitle">新增工序</div>
    <label class="modal-label">工序名稱 *</label>
    <input class="modal-input" type="text" id="addProcessName" placeholder="例: 車縫鞋頭">
    <label class="modal-label">部件名稱（選填）</label>
    <input class="modal-input" type="text" id="addPartName" placeholder="例: 鞋頭面料">
    <label class="modal-label">TCT 秒/雙（選填）</label>
    <input class="modal-input" type="text" id="addTCT" placeholder="例: 30">
    <div class="modal-footer">
      <button class="btn-mcancel" onclick="closeAddModal()">取消</button>
      <button class="btn-mok" onclick="submitAddRow()">新增</button>
    </div>
  </div>
</div>

<script>
const PATH = window.location.pathname;
const HID  = parseInt(PATH.split('/')[2]) || 0;
let EOLR   = 120;
let SEG    = 'cutting';
let STAGE  = null;
let DATA   = null;
let EDITS  = {};
let _storedLang = localStorage.getItem('ie_lang') || 'zh';
let LANG   = (_storedLang === 'en') ? 'zh' : _storedLang; // ie_cell only supports ZH/VI
let ZONE_ROWS = {};
let CAN_EDIT  = false;
let ADD_ZONE   = null;

const MACHINE_ZONES = new Set(['裁斷機','ATOM','Laser','EMMA','YINGHUI','移印','轉印']);
const WS = '水蜘蛛';
const OFFLINE_MAP = {
  cutting:   ['水蜘蛛'],
  stitching: ['電腦針車','水蜘蛛'],
  assembly:  ['水蜘蛛','成型UV'],
  stf:       ['水蜘蛛'],
};
const COL_LABELS = {
  seq:'#', process_name:'工序名稱', part_name:'部件/素材',
  cut_per_hour:'刀數/H', qty_per_pair:'件數/雙', layers_per_cut:'層數',
  normal_time:'正常時間', allowance_pct:'寬放%', standard_time:'標準時間',
  production_target:'生産目標',
  theory_operators:'理論人數', actual_operators:'實際人數',
};
const EDITABLE_COLS = new Set(['cut_per_hour','normal_time','qty_per_pair','layers_per_cut']);

// Cutting zones WITHOUT post-process data (ATOM/Laser/YINGHUI use normal_time formula)
const CUTTING_NO_POST = new Set(['ATOM','Laser','YINGHUI']);

function getZoneCols(seg, zone) {
  if (zone === '_summary') return null;
  if (zone === WS) return ['seq','process_name','actual_operators'];
  if (seg === 'cutting') {
    if (zone === '裁斷機') {
      return ['seq','process_name','part_name','layers_per_cut','qty_per_pair','cut_per_hour','standard_time','theory_operators','actual_operators'];
    }
    return ['seq','process_name','standard_time','actual_operators'];
  }
  if (seg === 'stitching' || seg === 'assembly') {
    return ['seq','process_name','normal_time','allowance_pct','standard_time','production_target','theory_operators','actual_operators'];
  }
  if (seg === 'stf') {
    if (zone === '水洗') return ['seq','process_name','actual_operators'];
    if (zone === '貼底') return ['seq','process_name','normal_time','standard_time','theory_operators','actual_operators'];
    return ['seq','process_name','standard_time','actual_operators']; // 打粗/照射: TCT manual
  }
  return ['seq','process_name','standard_time','theory_operators','actual_operators'];
}

let CELL_USER = null;

async function initCellAuth() {
  try {
    const r = await fetch('/api/me');
    const d = await r.json();
    CELL_USER = d.ok ? d.user : null;
  } catch { CELL_USER = null; }
  if (CELL_USER) {
    if (CELL_USER.role === 'data_entry') {
      document.getElementById('btn-submit-review').style.display = 'inline-block';
    }
    if (CELL_USER.role === 'admin') {
      document.getElementById('btn-approve-stage').style.display = 'inline-block';
    }
    if (['admin','manager'].includes(CELL_USER.role)) {
      checkVersionStatus();
      setInterval(checkVersionStatus, 5*60*1000);
      const adminBtn = document.getElementById('btn-admin-users');
      if (adminBtn) adminBtn.style.display = 'inline-block';
    }
  }
  loadReviewStatus();
}

async function checkVersionStatus(){
  const btn = document.getElementById('btn-update');
  if(!btn) return;
  try{
    const r = await fetch('/api/system/version_status');
    const d = await r.json();
    if(!d.ok) return;
    btn.style.display = 'inline-block';
    if(d.up_to_date){
      btn.textContent = '已是最新';
      btn.style.background = '#aaa';
    } else {
      btn.textContent = '有新版本，點擊更新';
      btn.style.background = '#f97316';
    }
  }catch{}
}

async function doUpdate(){
  const btn = document.getElementById('btn-update');
  if(!confirm('確認更新程式並重啟伺服器？')) return;
  btn.disabled = true;
  btn.textContent = '更新中…';
  try{
    const r = await fetch('/api/system/update',{method:'POST'});
    const d = await r.json();
    if(d.ok){
      btn.textContent = '更新完成，重啟中，請稍候…';
      btn.style.background = '#22c55e';
      setTimeout(()=>location.reload(), 4000);
    } else {
      alert('更新失敗：' + (d.error||'未知錯誤'));
      btn.disabled = false;
      btn.textContent = '有新版本，點擊更新';
    }
  }catch(e){
    alert('更新失敗：' + e);
    btn.disabled = false;
  }
}

async function loadReviewStatus() {
  try {
    const r = await fetch('/api/ie/review/list?header_id=' + HID);
    const d = await r.json();
    const reviews = (d.reviews || []);
    const pending = reviews.find(rv => rv.status === 'pending');
    const last    = reviews[0];
    const badge   = document.getElementById('review-status-badge');
    if (pending) {
      badge.textContent = '審核中';
      badge.style.cssText = 'display:inline-block;background:#fff3e0;color:#e65100;font-size:11px;padding:3px 8px;border-radius:10px';
    } else if (last && last.status === 'rejected') {
      badge.textContent = '已退回：' + (last.reject_reason || '');
      badge.style.cssText = 'display:inline-block;background:#fce4ec;color:#c62828;font-size:11px;padding:3px 8px;border-radius:10px';
    } else if (last && last.status === 'approved') {
      badge.textContent = '已核准';
      badge.style.cssText = 'display:inline-block;background:#e8f5e9;color:#1b5e20;font-size:11px;padding:3px 8px;border-radius:10px';
    } else {
      badge.style.display = 'none';
    }
  } catch {}
}

async function submitForReview() {
  if (!confirm('確認送審？')) return;
  const r = await fetch('/api/ie/review/submit', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({header_id: HID, stage_id: STAGE?.id})
  });
  const j = await r.json();
  if (j.ok) { alert('已送審，等待核准'); loadReviewStatus(); }
  else alert('送審失敗：' + (j.error || ''));
}

async function approveCurrentStage() {
  if (!STAGE) { alert('請先選擇版本'); return; }
  if (!confirm(`確認將版本「${STAGE.stage_name}」設為合格版？`)) return;
  const r = await fetch(`/api/ie/stages/${HID}/${STAGE.id}/approve`, {method: 'POST'});
  const j = await r.json();
  if (j.ok) { alert('已設為合格版 ✓'); }
  else alert('操作失敗：' + (j.error || ''));
}

// ── Render dispatcher ──────────────────────────────────────────────────────────
const CUTTING_ZONE_ORDER = ['裁斷機','ATOM','EMMA','Laser','YINGHUI','移印','轉印'];

function renderZones(data) {
  ZONE_ROWS = {};
  for (const z of data.zones) {
    ZONE_ROWS[z.zone] = z.rows.map(r => ({
      id: r.id,
      name: (LANG === 'vi' && r.process_name_vi) ? r.process_name_vi : (r.process_name || ''),
    }));
  }
  let html = data.segment === 'cutting'
    ? renderCuttingTab(data)
    : (() => { let h = ''; for (const z of data.zones) h += renderZoneCard(z, data.segment, data.eolr); return h; })();

  if (!CAN_EDIT) applyReadOnlyDOM();
}

// ── renderCuttingTab ── 七個區固定顯示，照 xlsx Cutting_TC B-T欄 ─────────────
function renderCuttingTab(data) {
  const eolr    = data.eolr || EOLR;
  const zoneMap = new Map((data.zones || []).map(z => [z.zone, z]));
  let h = '';
  for (const name of CUTTING_ZONE_ORDER) {
    h += renderCuttingZoneCard(zoneMap.get(name) || { zone: name, rows: [] }, eolr);
  }
  const smry = zoneMap.get('_summary');
  if (smry) h += renderZoneCard(smry, 'cutting', eolr);
  h += renderZoneCard(zoneMap.get(WS) || { zone: WS, rows: [] }, 'cutting', eolr);
  return h;
}

// ── Cutting zone card — 各區欄位照 27_WORKING_RULES.md 定案 ──────────────────
// A=裁斷機(19) B=ATOM/EMMA(18) C=Laser(8) D=YINGHUI(12) E=移印/轉印(5)
const CUTTING_ZONE_NUM  = {'裁斷機':'①','ATOM':'②','EMMA':'③','Laser':'④','YINGHUI':'⑤','移印':'⑥','轉印':'⑦'};
const CUTTING_ZONE_TYPE = {'裁斷機':'A','ATOM':'B','EMMA':'B','Laser':'C','YINGHUI':'D','移印':'E','轉印':'E'};

function renderCuttingZoneCard(z, eolr) {
  const zone  = z.zone;
  const zoneJ = esc(JSON.stringify(zone));
  const num   = CUTTING_ZONE_NUM[zone] || '';
  const type  = CUTTING_ZONE_TYPE[zone] || 'A';
  const rows  = z.rows || [];
  let h = `<div class="zone-card">
  <div class="zone-header">
    <div class="zone-left">
      <span class="zone-name">${num ? num + ' ' : ''}${esc(zone)}</span>
      <span class="zone-count">${rows.length} 道</span>
    </div>
    <div class="zone-actions"></div>
  </div>
  <div class="zone-body"><table class="proc-table cut-table">
  <thead>${_cutHead(type)}</thead>
  <tbody id="tbody-cut-${esc(zone)}">`;
  // Pre-compute group sizes for rowspan
  const groupSize = new Map(), groupFirstId = new Map();
  for (const row of rows) {
    if (row.group_info) {
      const gid = row.group_info.group_id;
      if (!groupFirstId.has(gid)) groupFirstId.set(gid, row.id);
      groupSize.set(gid, (groupSize.get(gid) || 0) + 1);
    }
  }
  for (const row of rows) h += renderCuttingRow(row, zone, type, eolr, groupFirstId, groupSize);
  h += renderAddTriggerRow(zone, 'cutting');
  h += '</tbody></table></div></div>';
  return h;
}

// ── 表頭生成器 (R3 群組行 + R4越文 + R5英文 + R6中文) ────────────────────────
function _cutHead(type) {
  const G  = (n, t) => `<th colspan="${n}" class="th-cut-group">${t}</th>`;
  const GP = (n, t) => `<th colspan="${n}" class="th-post-group">${t}</th>`;
  const GB = ()     => `<th class="th-cut-group" style="background:#1C1C1E;color:#3A3A3C"></th>`;
  const vi = (t)    => `<th class="th-vi">${t}</th>`;
  const en = (t)    => `<th class="th-en">${t}</th>`;
  const zh = (t, c) => `<th class="th-zh${c ? ' '+c : ''}">${t}</th>`;
  const DEL = '<th rowspan="4" style="width:22px;padding:2px"></th>';
  const B3  = GB()+GB()+'<th class="th-cut-group left" style="background:#1C1C1E;color:#3A3A3C;min-width:110px"></th>';
  const V3  = vi('Phân loại<br>NL')+vi('STT')+`<th class="th-vi left">Tên phối kiện</th>`;
  const E3  = en('Classification<br>Material')+en('Seq.<br>No')+`<th class="th-en left">Name of Parts</th>`;
  const Z3  = zh('材料類別','')+zh('序號','')+zh('部件名稱','left');
  const P5G = GP(2,'印线/画线')+GP(2,'削皮')+GP(2,'贴补强')+GP(2,'涂边/烘毛边')+GP(2,'热压');
  const P5V = (vi('TC<br>thời gian')+vi('Số người<br>lý luận')).repeat(5);
  const P5E = (en('Std time<br>(Secs)')+en('Operators<br>theory')).repeat(5);
  const P5Z = (zh('標准時間','th-formula-col')+zh('理論人數','th-theory-col')).repeat(5);
  const CV  = vi('Số<br>lớp')+vi('Số pk<br>/đôi')+vi('TC<br>thời gian')+vi('Số người<br>lý luận')+vi('Yêu cầu<br>máy cắt');
  const CE  = en('No.of<br>Layer')+en('Qty<br>(1Prs)')+en('Std time<br>(Secs)')+en('Operators<br>theory')+en('No.of<br>Oper.');
  const CZ  = zh('層數','')+zh('件數','')+zh('標准時間','')+zh('理論人數','th-theory-col')+zh('裁機<br>要求人數','th-actual-col');
  let r3,r4,r5,r6;
  if (type === 'A') {
    r3 = DEL+B3+G(6,'裁断')+P5G;
    r4 = V3+vi('Số<br>lớp')+vi('Số pk<br>/đôi')+vi('Số<br>dao/H')+vi('TC<br>thời gian')+vi('Số người<br>lý luận')+vi('Yêu cầu<br>máy cắt')+P5V;
    r5 = E3+en('No.of<br>Layer')+en('Qty<br>(1Prs)')+en('Cut<br>(Pr/H)')+en('Std time<br>(Secs)')+en('Operators<br>theory')+en('No.of<br>Oper.')+P5E;
    r6 = Z3+zh('層數','')+zh('件數','')+zh('刀數/H','')+zh('標准時間<br><span style="font-size:8px;font-weight:400">(秒/雙)</span>','th-formula-col')+zh('理論人數','th-theory-col')+zh('裁機<br>要求人數','th-actual-col')+P5Z;
  } else if (type === 'B') {
    r3 = DEL+B3+G(5,'裁断')+P5G;
    r4 = V3+CV+P5V; r5 = E3+CE+P5E; r6 = Z3+CZ+P5Z;
  } else if (type === 'C') {
    r3 = DEL+B3+G(5,'裁断');
    r4 = V3+CV; r5 = E3+CE; r6 = Z3+CZ;
  } else if (type === 'D') {
    r3 = DEL+B3+G(5,'裁断')+GP(2,'烘鞋垫')+GP(2,'轉印鞋垫');
    r4 = V3+CV+vi('TC<br>thời gian')+vi('Số người<br>lý luận')+vi('TC<br>thời gian')+vi('Số người<br>lý luận');
    r5 = E3+CE+en('Std time<br>(Secs)')+en('Operators<br>theory')+en('Std time<br>(Secs)')+en('Operators<br>theory');
    r6 = Z3+CZ+zh('烘鞋垫<br>標時','th-formula-col')+zh('理論人數','th-theory-col')+zh('轉印鞋垫<br>標時','th-formula-col')+zh('理論人數','th-theory-col');
  } else {
    r3 = DEL+B3+G(2,'裁断');
    r4 = V3+vi('TC<br>thời gian')+vi('Số người<br>lý luận');
    r5 = E3+en('Std time<br>(Secs)')+en('Operators<br>theory');
    r6 = Z3+zh('標准時間','')+zh('理論人數','th-theory-col');
  }
  return `<tr>${r3}</tr><tr>${r4}</tr><tr>${r5}</tr><tr>${r6}</tr>`;
}

// ── 資料行渲染 — 依 type 決定欄位 ───────────────────────────────────────────
function renderCuttingRow(row, zone, type, eolr, groupFirstId, groupSize) {
  const pid     = row.id;
  const divisor = 3600 / eolr;
  const dv  = (v)   => (v != null && v !== '') ? fmtNum(v) : '';
  const ops = (std) => { const s = parseFloat(std); return (!isNaN(s)&&s>0) ? fmtNum(parseFloat((s/divisor).toFixed(4))) : ''; };
  const edM = (fld, v) => `<td class="num" style="padding:0"><input class="cell-inp" value="${dv(v)}" onblur="commitEditStatic(this,${pid},'${fld}')" onkeydown="if(event.key==='Enter')this.blur()"></td>`;
  const fmC = (v)      => `<td class="formula-cell">${dv(v)}</td>`;
  const thC = (std)    => `<td class="formula-cell theory-cell" data-stdtime="${std??''}" data-zone="${esc(zone)}">${ops(std)}</td>`;
  const zoneJ = esc(JSON.stringify(zone));
  const actC = () => {
    if (row.group_info) {
      const gi = row.group_info;
      const gid = gi.group_id;
      const isFirst = groupFirstId?.get(gid) === row.id;
      if (!isFirst) return renderGroupPlaceholder();
      const n = groupSize?.get(gid) || 1;
      return renderGroupActualCell(gi, n, zone, 'cutting');
    }
    return `<td class="actual-cell" style="padding:2px 4px">
      <div style="display:flex;align-items:center;gap:2px;justify-content:flex-end">
        <input type="text" class="cut-act-inp" data-pid="${pid}"
          value="${row.actual_operators ?? ''}" placeholder=""
          onblur="saveSingleActual(this,${pid})"
          onkeydown="if(event.key==='Enter')this.blur()">
        <button class="cut-merge-btn" onclick="openMergeModal(${zoneJ},${pid},'cutting')" title="合併多工序">合</button>
      </div></td>`;
  };
  const post5 = () => ['post_marking_std','post_skiving_std','post_attach_std','post_edge_std','post_heat_std'].map(sc => {
    const ps = row[sc];
    return edM(sc,ps)+`<td class="formula-cell th-post-ops-cell" data-poststd="${ps??''}">${ops(ps)}</td>`;
  }).join('');
  const std = row.standard_time;
  const zhN  = esc(row.process_name||row.process_name_zh||'');
  const vi2  = esc(row.process_name_vi||'');
  const viet = (LANG==='vi'&&vi2) ? vi2 : zhN;
  const zh2  = esc(row.process_name_zh||'');
  const nmC  = zh2
    ? `<td class="name left" style="white-space:normal" data-pid="${pid}" data-zh="${zhN}" data-vi="${vi2}">${viet}<div class="name-zh">${zh2}</div></td>`
    : `<td class="name left" style="white-space:normal" data-pid="${pid}" data-zh="${zhN}" data-vi="${vi2}">${viet}</td>`;
  let h = '<tr>';
  h += `<td class="del-cell"><button class="btn-del" onclick="deleteRow(${pid})">×</button></td>`;
  h += `<td class="num" style="cursor:text;font-size:9px;min-width:50px" onclick="startTextEdit(this,${pid},'mat_cat')" data-tip="點擊編輯">${esc(row.mat_cat||'')}</td>`;
  h += `<td class="seq">${row.seq??''}</td>`;
  h += nmC;
  const act = actC();
  if (type === 'A') {
    h += edM('layers_per_cut',row.layers_per_cut)+edM('qty_per_pair',row.qty_per_pair)+edM('cut_per_hour',row.cut_per_hour)+fmC(std)+thC(std)+(act||'')+post5();
  } else if (type === 'B') {
    h += edM('layers_per_cut',row.layers_per_cut)+edM('qty_per_pair',row.qty_per_pair)+edM('standard_time',std)+thC(std)+(act||'')+post5();
  } else if (type === 'C') {
    h += edM('layers_per_cut',row.layers_per_cut)+edM('qty_per_pair',row.qty_per_pair)+edM('standard_time',std)+thC(std)+(act||'');
  } else if (type === 'D') {
    const pk = row.post_marking_std, ps2 = row.post_skiving_std;
    h += edM('layers_per_cut',row.layers_per_cut)+edM('qty_per_pair',row.qty_per_pair)+edM('standard_time',std)+thC(std)+(act||'');
    h += edM('post_marking_std',pk)+`<td class="formula-cell th-post-ops-cell">${ops(pk)}</td>`;
    h += edM('post_skiving_std',ps2)+`<td class="formula-cell th-post-ops-cell">${ops(ps2)}</td>`;
  } else {
    h += edM('standard_time',std)+thC(std);
  }
  h += '</tr>';
  return h;
}

// ── Inline 新增行 — 依 zone type 顯示對應欄位 ────────────────────────────────
function addCuttingRow(zone) {
  const tbody = document.getElementById('tbody-cut-'+zone);

  let c = `<td class="del-cell"><button class="btn-del" onclick="cancelAddCuttingRow(${zJ})" title="取消">✕</button></td><td><input class="add-inp" id="add-mat-${zE}" placeholder="材料" style="min-width:46px;font-size:10px"></td><td></td><td><input class="add-inp" id="add-name-${zE}" placeholder="部件名稱" style="min-width:90px"></td>`;
  if (type === 'A') {
    c += ni('add-lay-'+zE,'層')+ni('add-qty-'+zE,'件')+ni('add-cph-'+zE,'刀/H')+fm()+fm()+ni('add-act-'+zE,'人');
    c += `<td colspan="10" style="background:#f1f8e9;text-align:center;font-size:9px;color:#aaa;border:1px dashed #c8e6c9">後製工序（新增後填入）</td>`;
  } else if (type === 'B') {
    c += ni('add-lay-'+zE,'層')+ni('add-qty-'+zE,'件')+ni('add-std-'+zE,'標時')+fm()+ni('add-act-'+zE,'人');
    c += `<td colspan="10" style="background:#f1f8e9;text-align:center;font-size:9px;color:#aaa;border:1px dashed #c8e6c9">後製工序（新增後填入）</td>`;
  } else if (type === 'C') {
    c += ni('add-lay-'+zE,'層')+ni('add-qty-'+zE,'件')+ni('add-std-'+zE,'標時')+fm()+ni('add-act-'+zE,'人');
  } else if (type === 'D') {
    c += ni('add-lay-'+zE,'層')+ni('add-qty-'+zE,'件')+ni('add-std-'+zE,'標時')+fm()+ni('add-act-'+zE,'人');
    c += `<td colspan="4" style="background:#f1f8e9;text-align:center;font-size:9px;color:#aaa;border:1px dashed #c8e6c9">烘/轉印鞋垫（新增後填入）</td>`;
  } else {
    c += ni('add-std-'+zE,'標時')+fm();
  }
  c += ok;
  const tr = document.createElement('tr');
  tr.className = 'add-row-inline';
  tr.innerHTML = c;
  const trigger = tbody.querySelector('.add-trigger-row');
  if (trigger) tbody.insertBefore(tr, trigger); else tbody.appendChild(tr);
  tr.addEventListener('keydown', e => { if(e.key==='Enter') confirmAddCuttingRow(zone); if(e.key==='Escape') cancelAddCuttingRow(zone); });
  document.getElementById('add-name-'+zE)?.focus();
}

async function confirmAddCuttingRow(zone) {
  const type = CUTTING_ZONE_TYPE[zone] || 'A';
  const zE   = esc(zone);
  const name = document.getElementById('add-name-'+zE)?.value?.trim();
  if (!name) { alert('請輸入部件名稱'); return; }

  const mat = document.getElementById('add-mat-'+zE)?.value?.trim()||null;
  const g = (id) => parseFloat(document.getElementById(id)?.value)||null;
  Object.assign(payload, {mat_cat:mat});
  if (type==='A') Object.assign(payload, {layers_per_cut:g('add-lay-'+zE),qty_per_pair:g('add-qty-'+zE),cut_per_hour:g('add-cph-'+zE),actual_operators:g('add-act-'+zE)});
  else if (type==='B'||type==='C'||type==='D') Object.assign(payload, {layers_per_cut:g('add-lay-'+zE),qty_per_pair:g('add-qty-'+zE),standard_time:g('add-std-'+zE),actual_operators:g('add-act-'+zE)});
  else Object.assign(payload, {standard_time:g('add-std-'+zE)});
  const r = await fetch('/api/ie/cell/add_row', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});

// ── Generic zone card (stitching / assembly / stf / WS / _summary) ─────────────
function renderZoneCard(z, seg, eolr) {
  const zone = z.zone;
  const cols = getZoneCols(seg, zone);
  const isSummary = zone === '_summary';
  const isWS      = zone === WS;
  const offlines  = OFFLINE_MAP[seg] || [];
  const isOffline = offlines.includes(zone) && !isWS;
  const isLocked  = z.rows.length > 0 && z.rows.every(r => r.is_locked);
  const hasPending = z.rows.some(r => r.flag === '待手工');

  const hdrCls = isWS ? 'zone-header ws' : isOffline ? 'zone-header offline' : 'zone-header';
  const zLabel = esc(zoneLabel(zone));
  const zoneJ  = esc(JSON.stringify(zone));

  let h = `<div class="zone-card"><div class="${hdrCls}">
    <div class="zone-left">
      <span class="zone-name">${zLabel}</span>
      <span class="zone-count">${z.rows.length} 道</span>
      ${isLocked   ? '<span class="badge badge-lock">鎖定</span>' : ''}
      ${isWS       ? '<span class="badge badge-ws">Water Spider</span>' : ''}
      ${isOffline  ? '<span class="badge badge-off">離線統計</span>' : ''}
      ${hasPending ? '<span class="badge badge-pend">待手工</span>' : ''}
    </div>
    <div class="zone-actions">`;

  h += `</div></div>`;

  if (isSummary) {
    const total = calcHandTotal(z);
    h += `<div class="hand-total">
      <div class="hand-total-label">∑ 手工理論人數（非裁斷機）</div>
      <div class="hand-total-val" id="handTotalVal">${fmtNum(total)}</div>
    </div>`;
  } else {
    const segJ = esc(JSON.stringify(seg));
    h += '<div class="zone-body"><table class="proc-table"><thead><tr>';
    h += `<th style="width:22px"></th>`;
    for (const col of cols) {
      const lbl = COL_LABELS[col] || col;
      const isLeft = col === 'process_name' || col === 'part_name';
      const cls = (col === 'theory_operators' || col === 'production_target') ? 'th-theory' : col === 'actual_operators' ? 'th-actual' : isLeft ? 'left' : '';
      h += `<th${cls ? ` class="${cls}"` : ''}>${lbl}</th>`;
    }
    h += `</tr></thead><tbody id="tbody-gen-${esc(zone)}">`;

    // Pre-compute group sizes for rowspan
    const gSize = new Map(), gFirst = new Map();
    for (const row of z.rows) {
      if (row.group_info) {
        const gid = row.group_info.group_id;
        if (!gFirst.has(gid)) gFirst.set(gid, row.id);
        gSize.set(gid, (gSize.get(gid) || 0) + 1);
      }
    }

    for (const row of z.rows) {
      h += '<tr>';
      h += row.is_locked
        ? '<td class="del-cell"></td>'
        : `<td class="del-cell"><button class="btn-del" onclick="deleteRow(${row.id})" title="刪除">×</button></td>`;
      for (const col of cols) {
        if (col === 'actual_operators' && row.group_info) {
          const gid = row.group_info.group_id;
          if (gFirst.get(gid) === row.id) {
            h += renderGroupActualCell(row.group_info, gSize.get(gid) || 1, zone, seg);
          } else {
            h += renderGroupPlaceholder();
          }
        } else {
          h += renderCell(row, col, zone, seg, eolr);
        }
      }
      h += '</tr>';
    }
    h += renderAddTriggerRow(zone, seg);
    h += '</tbody></table></div>';
  }
  h += '</div>';
  return h;
}

function renderCell(row, col, zone, seg, eolr) {
  const val = row[col];
  const pid = row.id;
  const locked = row.is_locked;

  if (col === 'seq') return `<td class="seq">${val ?? ''}</td>`;

  if (col === 'process_name') {
    const isVi = LANG === 'vi' && row.process_name_vi;
    const main = esc(isVi ? row.process_name_vi : (row.process_name || ''));
    const sub  = isVi ? `<div style="font-size:9px;color:#aaa;margin-top:1px">${esc(row.process_name || '')}</div>` : '';
    return `<td class="name" data-pid="${pid}" data-zh="${esc(row.process_name||'')}" data-vi="${esc(row.process_name_vi||'')}">${main}${sub}</td>`;
  }

  if (col === 'part_name') return `<td class="name" style="color:#888;font-size:10px">${esc(val ?? '')}</td>`;

  if (col === 'production_target') {
    let st = parseFloat(row.standard_time);
    if ((seg === 'stitching' || seg === 'assembly') && row.normal_time != null) {
      const allow = row.allowance_pct != null ? row.allowance_pct : 10;
      st = row.normal_time * (1 + allow / 100);
    }
    const pt = (!isNaN(st) && st > 0) ? fmtNum(Math.round((3600 / st) * 10) / 10) : '';
    return `<td class="formula-cell">${pt}</td>`;
  }

  if (col === 'standard_time') {
    let computed = val;
    if (seg === 'stitching' || seg === 'assembly') {
      if (row.normal_time != null) {
        const allow = row.allowance_pct != null ? row.allowance_pct : 10;
        computed = row.normal_time * (1 + allow / 100);
      }
      const display = computed != null ? fmtNum(parseFloat(computed.toFixed(4))) : '';
      return `<td class="formula-cell">${display}</td>`;
    }
    if (seg === 'stf') {
      if (zone === '貼底') {
        if (row.normal_time != null) computed = row.normal_time * 1.1;
        const display = computed != null ? fmtNum(parseFloat(computed.toFixed(4))) : '';
        return `<td class="formula-cell">${display}</td>`;
      }
      // 打粗/照射: TCT manual, editable
      return `<td class="num" style="padding:0"><input class="cell-inp" value="${fmtNum(val)}" onblur="commitEditStatic(this,${pid},'standard_time')" onkeydown="if(event.key==='Enter')this.blur()"></td>`;
    }
    const display = computed != null ? fmtNum(parseFloat(computed.toFixed(4))) : '';
    return `<td class="formula-cell">${display}</td>`;
  }

  if (col === 'theory_operators') {
    let st;
    if (seg === 'stitching' || seg === 'assembly') {
      st = (row.normal_time != null)
        ? row.normal_time * (1 + (row.allowance_pct != null ? row.allowance_pct : 10) / 100)
        : parseFloat(row.standard_time);
    } else if (seg === 'stf' && zone === '貼底') {
      st = row.normal_time != null ? row.normal_time * 1.1 : parseFloat(row.standard_time);
    } else {
      st = parseFloat(row.standard_time);
    }
    const stNum = parseFloat(st);
    const th = (!isNaN(stNum) && stNum > 0) ? fmtNum(stNum / (3600 / eolr)) : '';
    return `<td class="formula-cell theory-cell" data-pid="${pid}" data-stdtime="${stNum || ''}" data-zone="${esc(zone)}">${th}</td>`;
  }

  if (col === 'actual_operators') {
    // group_info rows are handled by group-aware callers (renderZoneCard/renderCuttingRow); skip here
    if (row.group_info) return '';
    if (locked) return `<td class="actual-cell locked-cell">${fmtNum(val)}</td>`;
    if (row.flag === '待手工') return `<td class="actual-cell" style="background:#fff3e0;color:#e65100;text-align:center">⚠ 待手工</td>`;
    if (zone === WS) {
      return `<td class="actual-cell" style="padding:0"><input class="cell-inp" style="font-weight:600" value="${fmtNum(val)}" onblur="commitEditStatic(this,${pid},'actual_operators')" onkeydown="if(event.key==='Enter')this.blur()"></td>`;
    }
    const zoneJ = esc(JSON.stringify(zone));
    const segJ  = esc(JSON.stringify(seg));
    return `<td class="actual-cell clickable" onclick="openMergeModal(${zoneJ},${pid},${segJ})" data-tip="點擊設定/合併">${fmtNum(val)}</td>`;
  }

  if (col === 'allowance_pct') {
    const defaultAllow = (seg === 'stitching' || seg === 'assembly') ? 10 : null;
    const display = val != null ? fmtNum(val) : (defaultAllow != null ? fmtNum(defaultAllow) : '');
    if (locked) return `<td class="num locked-cell">${display}</td>`;
    return `<td class="num" style="padding:0"><input class="cell-inp" value="${display}" onblur="commitEditStatic(this,${pid},'allowance_pct')" onkeydown="if(event.key==='Enter')this.blur()"></td>`;
  }

  if (EDITABLE_COLS.has(col)) {
    if (locked) return `<td class="num locked-cell">${fmtNum(val)}</td>`;
    return `<td class="num" style="padding:0"><input class="cell-inp" value="${fmtNum(val)}" onblur="commitEditStatic(this,${pid},'${col}')" onkeydown="if(event.key==='Enter')this.blur()"></td>`;
  }

  return `<td class="num">${fmtNum(val)}</td>`;
}

function zoneLabel(z) {
  const m = {'_summary':'∑ 手工小計','待分區':'[待分區]','水蜘蛛':'水蜘蛛 (WS)'};
  return m[z] || z;
}

function calcHandTotal(summaryZone) {
  if (!DATA) return 0;
  const divisor = 3600 / EOLR;
  let total = 0;
  for (const z of DATA.zones) {
    if (z.zone === '_summary' || z.zone === '待分區' || MACHINE_ZONES.has(z.zone) || z.zone === WS) continue;
    for (const row of z.rows) {
      const st = parseFloat(row.standard_time);
      if (!isNaN(st) && st > 0) total += st / divisor;
    }
  }
  return total;
}

function updateTheoryAndTotal() {
  const divisor = 3600 / EOLR;
  let total = 0;
  document.querySelectorAll('.theory-cell[data-stdtime]').forEach(el => {
    const st = parseFloat(el.dataset.stdtime);
    if (!isNaN(st) && st > 0) {
      const th = st / divisor;
      el.textContent = fmtNum(th);
      const zone = el.dataset.zone;
      if (zone && !MACHINE_ZONES.has(zone) && zone !== WS && zone !== '_summary' && zone !== '待分區') {
        total += th;
      }
    } else {
      el.textContent = '';
    }
  });
  // Update cutting post-process ops cells
  document.querySelectorAll('.th-post-ops-cell[data-poststd]').forEach(el => {
    const ps = parseFloat(el.dataset.poststd);
    el.textContent = (!isNaN(ps) && ps > 0) ? fmtNum(parseFloat((ps / divisor).toFixed(4))) : '';
  });
  const ht = document.getElementById('handTotalVal');
  if (ht) ht.textContent = fmtNum(total);
}

// ── 合併人數：Modal + Group Action popup ──────────────────────────────────────
let MERGE_ZONE = null;
let MERGE_SEG  = null;

// Render a grouped actual_operators cell (first row of group — no rowspan)
function renderGroupActualCell(gi, rowspan, zone, seg) {
  const zoneJ = esc(JSON.stringify(zone));
  const segJ  = esc(JSON.stringify(seg));
  return `<td class="actual-cell group-cell" style="cursor:pointer;vertical-align:middle;text-align:right;background:#fff;color:#1C1C1E;border:1px solid #C7C7CC"
    onclick="openGroupAction(event,${gi.group_id},${gi.headcount},${zoneJ},${segJ})"
    title="點擊修改人數或解除合併">${fmtNum(gi.headcount)}</td>`;
}
// Placeholder for rows covered by a group (previously covered by rowspan)
function renderGroupPlaceholder() {
  return '<td style="background:#fff;border:1px solid #E5E5EA"></td>';
}

// Mini popup for editing / unmerging an existing group
function openGroupAction(event, groupId, headcount, zone, seg) {
  event.stopPropagation();
  closeGroupAction();
  const px = Math.min(event.clientX, window.innerWidth - 210);
  const py = Math.min(event.clientY + 4, window.innerHeight - 130);
  const p = document.createElement('div');
  p.id = 'groupActionPopup';
  p.className = 'group-action-popup';
  p.style.left = px + 'px';
  p.style.top  = py + 'px';
  p.innerHTML = `
    <div class="gap-title">合併格 · ${esc(zone)}</div>
    <div class="gap-row">
      <span class="gap-label">人數</span>
      <input class="gap-inp" id="gapHc" type="text" value="${headcount}">
      <button class="gap-btn-save" onclick="saveGroupHc(${groupId})">更新</button>
    </div>
    <button class="gap-btn-del" onclick="unmergeGroup(${groupId})">解除合併（清空人數）</button>`;
  document.body.appendChild(p);
  const inp = document.getElementById('gapHc');
  inp.focus(); inp.select();
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter')  saveGroupHc(groupId);
    if (e.key === 'Escape') closeGroupAction();
  });
  setTimeout(() => {
    document.addEventListener('click', function _cls(ev) {
      if (!p.contains(ev.target)) { closeGroupAction(); document.removeEventListener('click', _cls); }
    });
  }, 0);
}

function closeGroupAction() {
  document.getElementById('groupActionPopup')?.remove();
}

async function saveGroupHc(groupId) {
  const hcVal = document.getElementById('gapHc')?.value ?? '';
  const hc = parseFloat(hcVal);
  if (isNaN(hc) || hc < 0) { alert('請填寫正確人數'); return; }
  closeGroupAction();
  const r = await fetch('/api/ie/cell/update_group', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({group_id: groupId, headcount: hc})
  });
  const j = await r.json();
  if (j.ok) loadSegment(SEG);
  else alert('更新失敗: ' + (j.error || ''));
}

async function unmergeGroup(groupId) {
  closeGroupAction();
  if (!confirm('解除合併後，各工序回到獨立輸入格，人數清空。確認？')) return;
  const r = await fetch('/api/ie/cell/delete_group', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({group_id: groupId})
  });
  const j = await r.json();
  if (j.ok) loadSegment(SEG);
  else alert('解除失敗: ' + (j.error || ''));
}

// Merge modal: open for any unmerged actual_operators cell (all segments)
function openMergeModal(zone, clickedPid, seg) {
  MERGE_ZONE = zone;
  MERGE_SEG  = seg || SEG;
  document.getElementById('mergeModalTitle').textContent = `設定實際人數 — ${zone}`;

  const zoneData = DATA?.zones?.find(z => z.zone === zone);
  const rows = zoneData?.rows || [];

  // Only show rows that are NOT already in a group (this call is only for unmerged rows)
  const eligible = rows.filter(r => !r.group_info);
  const clickedRow = rows.find(r => r.id === clickedPid);
  const preHc = clickedRow?.actual_operators ?? '';

  const list = document.getElementById('mergeProcList');
  list.innerHTML = eligible.length
    ? eligible.map((r, i) => `<div class="proc-check-item">
        <input type="checkbox" id="mp${i}" value="${r.id}" ${r.id === clickedPid ? 'checked' : ''}>
        <label for="mp${i}" style="cursor:pointer">${esc(r.process_name || '工序 ' + r.id)}</label>
      </div>`).join('')
    : '<div style="color:#aaa;font-size:11px;padding:8px">此區無可合併工序</div>';

  document.getElementById('mergeHeadcount').value = preHc;
  document.getElementById('mergeModal').style.display = 'flex';
  setTimeout(() => document.getElementById('mergeHeadcount').focus(), 50);
}

function closeMergeModal() {
  document.getElementById('mergeModal').style.display = 'none';
  MERGE_ZONE = null;
  MERGE_SEG  = null;
}

async function submitMerge() {
  const checked = [...document.querySelectorAll('#mergeProcList input:checked')].map(cb => parseInt(cb.value));
  const hcStr = document.getElementById('mergeHeadcount').value;
  if (!checked.length) { alert('請選擇至少一道工序'); return; }
  if (hcStr === '') { alert('請填寫人數'); return; }
  const headcount = parseFloat(hcStr);
  if (isNaN(headcount) || headcount < 0) { alert('請填寫正確人數'); return; }

  if (checked.length === 1) {
    // Single process: save directly to actual_operators field
    const r = await fetch('/api/ie/cell/save', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cell_id: checked[0], stage_id: STAGE?.id, field: 'actual_operators', value: headcount, user: 'demo_user'})
    });
    const j = await r.json();
    if (j.ok) { closeMergeModal(); loadSegment(SEG); }
    else alert('儲存失敗: ' + (j.error || ''));
  } else {
    // Multiple processes: save to ie_process_group (rowspan display)
    const r = await fetch('/api/ie/cell/save_group', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({header_id: HID, segment: MERGE_SEG, zone: MERGE_ZONE,
        stage_id: STAGE?.id, process_ids: checked, headcount, note: ''})
    });
    const j = await r.json();
    if (j.ok) { closeMergeModal(); loadSegment(SEG); }
    else alert('儲存失敗: ' + (j.error || ''));
  }
}

// Cutting WS / direct inline save (blur)
async function saveSingleActual(inp, pid) {
  const val = inp.value.trim();
  if (val === '') return;
  const r = await fetch('/api/ie/cell/save', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({cell_id: pid, stage_id: STAGE?.id, field: 'actual_operators', value: val, user: 'demo_user'})
  });
  const j = await r.json();
  if (!j.ok) alert('儲存失敗: ' + (j.error || ''));
  else { inp.style.borderColor = '#007AFF'; setTimeout(() => { inp.style.borderColor = '#C7C7CC'; }, 1500); }
}

// ── Inline editing ────────────────────────────────────────────────────────────
function startEdit(td, pid, field) {
  const cur = td.textContent.trim();
  td.innerHTML = `<input type="text" value="${esc(cur)}"
    style="width:100%;box-sizing:border-box;border:1px solid #007AFF;border-radius:2px;padding:1px 4px;font-size:11px;text-align:right;outline:none;background:#fff"
    onblur="commitEdit(this,${pid},'${field}')"
    onkeydown="editKey(event,this,${pid},'${field}')">`;
  td.querySelector('input').focus();
}
function startTextEdit(td, pid, field) {
  const cur = td.textContent.trim();
  td.innerHTML = `<input type="text" value="${esc(cur)}"
    style="width:100%;border:1px solid #007AFF;border-radius:2px;padding:1px 3px;font-size:11px;background:#fff;outline:none"
    onblur="commitEdit(this,${pid},'${field}')"
    onkeydown="editKey(event,this,${pid},'${field}')">`;
  td.querySelector('input').focus();
}
function editKey(e, inp, pid, field) {
  if (e.key === 'Enter')  commitEdit(inp, pid, field);
  if (e.key === 'Escape') { inp.closest('td').textContent = inp.value || ''; }
}
function commitEdit(inp, pid, field) {
  const newVal = inp.value.trim();
  const td = inp.closest('td');
  td.textContent = newVal || '';
  if (!EDITS[pid]) EDITS[pid] = {};
  EDITS[pid][field] = newVal;
  td.style.outline = '1px solid #007AFF';
  updateSaveBar();
}
function commitEditStatic(inp, pid, field) {
  const newVal = inp.value.trim();
  if (!EDITS[pid]) EDITS[pid] = {};
  EDITS[pid][field] = newVal;
  updateSaveBar();
}

// ── Save bar ──────────────────────────────────────────────────────────────────
function updateSaveBar() {
  const count = Object.values(EDITS).reduce((n, f) => n + Object.keys(f).length, 0);
  document.getElementById('saveBar').style.display = count > 0 ? 'flex' : 'none';
  const el = document.getElementById('pendingCount');
  if (el) el.textContent = count;
}
async function submitAllEdits() {
  const btn = document.getElementById('btnSaveAll');
  btn.disabled = true; btn.textContent = '提交中…';
  const stageId = STAGE ? STAGE.id : null;
  let ok = 0, fail = 0;
  for (const [pid, fields] of Object.entries(EDITS)) {
    for (const [field, value] of Object.entries(fields)) {
      const r = await fetch('/api/ie/cell/save', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({cell_id:parseInt(pid), stage_id:stageId, field, value, user:'demo_user'}),
      });
      const j = await r.json();
      j.ok ? ok++ : fail++;
    }
  }
  EDITS = {}; updateSaveBar();
  btn.disabled = false; btn.textContent = '提交審核';
  alert(`提交完成：${ok} 項成功，${fail} 項失敗`);
}
function showSaveModal() {
  const count = Object.values(EDITS).reduce((n,f) => n + Object.keys(f).length, 0);
  if (count === 0) { alert('目前沒有修改項目'); return; }
  if (confirm(`確認提交 ${count} 項修改至版本「${STAGE?.stage_name || '—'}」？`)) submitAllEdits();
}
async function saveSilent() {
  const count = Object.values(EDITS).reduce((n, f) => n + Object.keys(f).length, 0);
  if (count === 0) return;
  const btn = document.getElementById('btnSaveAll');
  if (btn) { btn.disabled = true; btn.textContent = '儲存中…'; }
  const stageId = STAGE ? STAGE.id : null;
  let ok = 0, fail = 0;
  for (const [pid, fields] of Object.entries(EDITS)) {
    for (const [field, value] of Object.entries(fields)) {
      const r = await fetch('/api/ie/cell/save', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({cell_id:parseInt(pid), stage_id:stageId, field, value, user:'demo_user'}),
      });
      const j = await r.json();
      j.ok ? ok++ : fail++;
    }
  }
  EDITS = {};
  const bar = document.getElementById('saveBar');
  const msgEl = document.getElementById('saveBarMsg');
  if (msgEl) msgEl.innerHTML = `<span style="color:#34C759;font-weight:600">已儲存 ✓${fail>0?' ('+fail+' 項失敗)':''}</span>`;
  if (btn) btn.style.display = 'none';
  if (bar) {
    bar.style.display = 'flex';
    setTimeout(() => {
      bar.style.transition = 'opacity .5s';
      bar.style.opacity = '0';
      setTimeout(() => {
        bar.style.display = 'none';
        bar.style.opacity = '1';
        bar.style.transition = '';
        if (btn) { btn.style.display = ''; btn.disabled = false; btn.textContent = '儲存'; }
        updateSaveBar();
      }, 500);
    }, 1800);
  } else {
    if (btn) { btn.style.display = ''; btn.disabled = false; btn.textContent = '儲存'; }
  }
}
window.addEventListener('beforeunload', e => {
  const count = Object.values(EDITS).reduce((n, f) => n + Object.keys(f).length, 0);
  if (count > 0) { e.preventDefault(); e.returnValue = ''; }
});
function newStage() {
  const name = prompt('請輸入新版本名稱:');
  if (!name) return;
  fetch('/api/ie/stages/' + HID, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({stage_name:name}),
  }).then(r=>r.json()).then(j => {
    if (j.ok) {
      STAGE = {id:j.stage_id, stage_name:name};
      const sel = document.getElementById('stageSelect');
      const opt = document.createElement('option');
      opt.value = j.stage_id;
      opt.textContent = name;
      sel.appendChild(opt);
      sel.value = j.stage_id;
    } else alert('建立失敗');
  });
}

// ── + trigger row ─────────────────────────────────────────────────────────────
function renderAddTriggerRow(zone, seg) {
  const zJ   = esc(JSON.stringify(zone));
  const segJ = esc(JSON.stringify(seg));
  const fn   = (seg === 'cutting' && zone !== WS) ? `addCuttingRow(${zJ})` : `addRowInline(${zJ},${segJ})`;
  return `<tr class="add-trigger-row"><td class="add-trigger-cell"><button class="btn-add-zone" onclick="${fn}">＋</button></td><td colspan="100"></td></tr>`;
}

// ── Inline add for non-cutting zones ─────────────────────────────────────────
function addRowInline(zone, seg) {
  const tbodyId = 'tbody-gen-' + zone;
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  if (tbody.querySelector('.add-row-inline')) { tbody.querySelector('.add-row-inline input')?.focus(); return; }
  const cols = getZoneCols(seg, zone);
  if (!cols) return;
  const zJ   = esc(JSON.stringify(zone));
  const segJ = esc(JSON.stringify(seg));
  let cells = `<td class="del-cell"><button class="btn-del" onclick="cancelAddRowInline(${zJ})" title="取消">✕</button></td>`;
  for (const col of cols) {
    if (col === 'seq') {
      cells += `<td></td>`;
    } else if (col === 'process_name') {
      cells += `<td><input class="add-inp" id="add-gen-pname-${esc(zone)}" placeholder="工序名稱" style="min-width:110px"></td>`;
    } else if (col === 'normal_time') {
      cells += `<td><input class="add-inp add-num" id="add-gen-nt-${esc(zone)}" type="text" placeholder="正常時間" style="min-width:55px"></td>`;
    } else if (col === 'allowance_pct') {
      cells += `<td><input class="add-inp add-num" id="add-gen-ap-${esc(zone)}" type="text" value="10" placeholder="10" style="min-width:35px"></td>`;
    } else if (col === 'standard_time') {
      const isFormula = (seg === 'stitching' || seg === 'assembly') || (seg === 'stf' && zone === '貼底');
      cells += isFormula
        ? `<td class="formula-cell" style="font-size:9px">公式</td>`
        : `<td><input class="add-inp add-num" id="add-gen-std-${esc(zone)}" type="text" placeholder="TCT" style="min-width:55px"></td>`;
    } else if (col === 'production_target' || col === 'theory_operators') {
      cells += `<td class="formula-cell" style="font-size:9px">公式</td>`;
    } else if (col === 'actual_operators') {
      cells += `<td><input class="add-inp add-num" id="add-gen-act-${esc(zone)}" type="text" placeholder="人數" style="min-width:40px"></td>`;
    } else {
      cells += `<td></td>`;
    }
  }
  cells += `<td style="white-space:nowrap;border:1px solid #c8e6c9"><button class="btn-inline-ok" onclick="confirmAddRowInline(${zJ},${segJ})">✓</button></td>`;
  const tr = document.createElement('tr');
  tr.className = 'add-row-inline';
  tr.innerHTML = cells;
  const trigger = tbody.querySelector('.add-trigger-row');
  if (trigger) tbody.insertBefore(tr, trigger); else tbody.appendChild(tr);
  tr.addEventListener('keydown', e => {
    if (e.key === 'Enter')  confirmAddRowInline(zone, seg);
    if (e.key === 'Escape') cancelAddRowInline(zone);
  });
  document.getElementById('add-gen-pname-' + zone)?.focus();
}

async function confirmAddRowInline(zone, seg) {
  const name = document.getElementById('add-gen-pname-' + zone)?.value?.trim();
  if (!name) { alert('請輸入工序名稱'); return; }
  const payload = {header_id:HID, segment:seg, zone, stage_id:STAGE?.id, user:'demo', process_name:name};
  const nt  = parseFloat(document.getElementById('add-gen-nt-'  + zone)?.value) || null;
  const ap  = parseFloat(document.getElementById('add-gen-ap-'  + zone)?.value) || null;
  const std = parseFloat(document.getElementById('add-gen-std-' + zone)?.value) || null;
  const act = parseFloat(document.getElementById('add-gen-act-' + zone)?.value) || null;
  if (nt  != null) payload.normal_time = nt;
  if (ap  != null) payload.allowance_pct = ap;
  if (std != null) payload.standard_time = std;
  if (act != null) payload.actual_operators = act;
  const r = await fetch('/api/ie/cell/add_row', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload),
  });
  const j = await r.json();
  if (j.ok) loadSegment(seg);
  else alert('新增失敗: ' + (j.error || ''));
}

function cancelAddRowInline(zone) {
  const tbody = document.getElementById('tbody-gen-' + zone);
  if (tbody) tbody.querySelector('.add-row-inline')?.remove();
}

// ── Custom tooltip（跟隨滑鼠） ────────────────────────────────────────────────
(function(){
  const TIP = document.getElementById('cellTip');
  document.addEventListener('mouseover', e => {
    const cell = e.target.closest('[data-tip]');
    if (!cell) { TIP.style.display = 'none'; return; }
    TIP.textContent = cell.dataset.tip;
    TIP.style.display = 'block';
  });
  document.addEventListener('mousemove', e => {
    if (TIP.style.display === 'none') return;
    TIP.style.left = (e.clientX + 14) + 'px';
    TIP.style.top  = (e.clientY - 32) + 'px';
  });
  document.addEventListener('mouseout', e => {
    if (!e.relatedTarget?.closest('[data-tip]')) TIP.style.display = 'none';
  });
})();

// ── Utils ─────────────────────────────────────────────────────────────────────
function fmtNum(v) {
  if (v == null) return '';
  if (typeof v === 'number') return Number.isInteger(v) ? String(v) : parseFloat(v.toFixed(1)).toString();
  const n = parseFloat(v);
  return isNaN(n) ? String(v) : (Number.isInteger(n) ? String(n) : parseFloat(n.toFixed(1)).toString());
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Save dropdown ─────────────────────────────────────────────────────────────
function toggleSaveDropdown() {
  const m = document.getElementById('saveDropdownMenu');
  const isOpen = m.style.display !== 'none';
  m.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) {
    setTimeout(() => document.addEventListener('click', _closeSaveDDOutside), 0);
  }
}
function closeSaveDropdown() {
  document.getElementById('saveDropdownMenu').style.display = 'none';
  document.removeEventListener('click', _closeSaveDDOutside);
}
function _closeSaveDDOutside(e) {
  if (!e.target.closest('#saveDropdown')) closeSaveDropdown();
}

// Close merge modal on overlay click
document.getElementById('mergeModal').addEventListener('click', function(e) {
  if (e.target === this) closeMergeModal();
});

init();
</script>
