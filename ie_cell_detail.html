<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IE 細表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:13px;background:#f0f2f5;color:#1a1a2e;min-height:100vh}

/* ── Top bar ─────────────────────────────────────── */
.topbar{background:#1a2744;color:#fff;padding:9px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3);flex-wrap:wrap}
.topbar-model{font-size:14px;font-weight:700;white-space:nowrap;flex-shrink:0}
.topbar-meta{font-size:11px;color:#7a9bcc;white-space:nowrap;flex-shrink:0}
.topbar-spacer{flex:1}
.eolr-toggle{display:flex;gap:2px;background:#0f1e38;border-radius:6px;padding:3px}
.eolr-btn{background:transparent;color:#7a9bcc;border:none;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.eolr-btn.active{background:#4a6cf7;color:#fff}
.seg-select{background:#243356;color:#b0c4de;border:1px solid #3a4f72;border-radius:5px;padding:4px 8px;font-size:11px;cursor:pointer}
.btn-sm{background:#1d9e6b;color:#fff;border:none;border-radius:5px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-sm:hover{background:#178059}
.btn-outline{background:transparent;color:#7a9bcc;border:1px solid #3a4f72;border-radius:5px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn-outline:hover{background:#243356;color:#fff}
.stage-badge{background:#243356;color:#b0c4de;border-radius:4px;padding:3px 8px;font-size:11px;flex-shrink:0}

/* ── Segment tabs ────────────────────────────────── */
.tab-bar{background:#fff;border-bottom:2px solid #e4e9f2;padding:0 18px;display:flex;overflow-x:auto;position:sticky;top:46px;z-index:90;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tab-btn{padding:9px 16px;border:none;background:transparent;font-size:12px;font-weight:600;color:#777;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .12s,border-color .12s}
.tab-btn:hover{color:#4a6cf7}.tab-btn.active{color:#4a6cf7;border-bottom-color:#4a6cf7}

/* ── Content ─────────────────────────────────────── */
.content{padding:16px 18px;display:flex;flex-direction:column;gap:14px}

/* ── Zone card ───────────────────────────────────── */
.zone-card{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.08);overflow:hidden}
.zone-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#f5f7fc;border-bottom:1px solid #e4e9f2}
.zone-name{font-size:12px;font-weight:700;color:#1a2744;display:flex;align-items:center;gap:8px}
.zone-count{font-size:10px;color:#888;font-weight:400}
.zone-locked{font-size:10px;background:#fff3e0;color:#e65100;border-radius:3px;padding:1px 6px;font-weight:600}
.zone-pending{font-size:10px;background:#fce4ec;color:#c62828;border-radius:3px;padding:1px 6px;font-weight:600}
.zone-body{overflow-x:auto}

/* ── Process table ───────────────────────────────── */
.proc-table{border-collapse:collapse;width:100%;font-size:11px}
.proc-table th{background:#1a2744;color:#c8d8f0;padding:5px 8px;text-align:center;font-size:10px;font-weight:600;white-space:nowrap;border:1px solid #253355}
.proc-table th.left{text-align:left}
.proc-table td{padding:4px 8px;border:1px solid #e8ecf4;vertical-align:middle;white-space:nowrap}
.proc-table tr:hover td{background:#f5f8ff}
.proc-table td.seq{text-align:center;color:#888;font-weight:600;min-width:32px}
.proc-table td.name{text-align:left;min-width:180px;max-width:280px;white-space:normal;line-height:1.4}
.proc-table td.num{text-align:right;min-width:72px;color:#1a4a7a;font-family:'Consolas','Courier New',monospace}
.proc-table td.theory{text-align:right;min-width:72px;font-weight:700;color:#0d5e2e;font-family:'Consolas','Courier New',monospace}
.theory-line{font-size:9px;color:#aaa;margin-bottom:2px;font-family:'Consolas','Courier New',monospace}
.actual-display{font-family:'Consolas','Courier New',monospace;font-size:11px;color:#1a4a7a;font-weight:600}
.proc-table td.flag-cell{text-align:center;color:#c62828;font-weight:600;font-size:10px}
.proc-table td.formula-cell{background:#f5f5f5;color:#555}
.proc-table td.locked-cell{background:#fff8e1;color:#795548;font-weight:600}
.proc-table td.editable{background:#fff;cursor:text}
.proc-table td.editable input{width:100%;border:1px solid #4a6cf7;border-radius:3px;padding:1px 4px;font-size:11px;font-family:'Consolas','Courier New',monospace;text-align:right;outline:none;background:#edf2ff}
.proc-table tr.summary-row td{background:#e8f5e9;font-weight:700;color:#1a6e3c}

/* ── Hand total bar ──────────────────────────────── */
.hand-total{padding:10px 14px;background:#e8f5e9;border-top:2px solid #a5d6a7;display:flex;align-items:center;gap:10px}
.hand-total-label{font-size:12px;font-weight:700;color:#1a6e3c}
.hand-total-val{font-size:18px;font-weight:700;color:#0d5e2e;font-family:'Consolas','Courier New',monospace}

/* ── Save area ───────────────────────────────────── */
.save-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e4e9f2;padding:10px 18px;display:flex;gap:10px;align-items:center;z-index:80;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.save-bar-msg{flex:1;font-size:12px;color:#888}
.pending-dot{display:inline-block;width:8px;height:8px;background:#f9a825;border-radius:50%;margin-right:4px}
.btn-save-all{background:#4a6cf7;color:#fff;border:none;border-radius:6px;padding:7px 18px;font-size:12px;font-weight:700;cursor:pointer}
.btn-save-all:hover{background:#3a5ce7}
.btn-save-all:disabled{background:#c0c8d8;cursor:not-allowed}

/* states */
.loading-msg{padding:40px;text-align:center;color:#888;font-size:13px}
.error-msg{padding:20px;color:#cc2222;font-size:12px}

/* ── Back link ───────────────────────────────────── */
.back-link{color:#7a9bcc;text-decoration:none;font-size:11px;display:flex;align-items:center;gap:4px;flex-shrink:0}
.back-link:hover{color:#fff}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar" id="topbar">
  <a class="back-link" id="backLink" href="/ie">← 返回列表</a>
  <div class="topbar-model" id="modelName">載入中…</div>
  <div class="topbar-meta" id="modelMeta"></div>
  <div class="topbar-spacer"></div>
  <div class="stage-badge" id="stageBadge">— 版本 —</div>
  <div class="eolr-toggle">
    <button class="eolr-btn" id="eolr60"  onclick="setEolr(60)">EOLR 60</button>
    <button class="eolr-btn active" id="eolr120" onclick="setEolr(120)">EOLR 120</button>
  </div>
  <button class="btn-sm" onclick="showSaveModal()">儲存修改</button>
  <button class="btn-outline" onclick="newStage()">新建版本</button>
</div>

<!-- SEGMENT TABS -->
<div class="tab-bar" id="tabBar">
  <button class="tab-btn active" data-seg="cutting"  onclick="switchSeg('cutting')">裁斷 Cutting</button>
  <button class="tab-btn" data-seg="stitching" onclick="switchSeg('stitching')">針車 Stitching</button>
  <button class="tab-btn" data-seg="assembly"  onclick="switchSeg('assembly')">成型 Assembly</button>
  <button class="tab-btn" data-seg="stf"       onclick="switchSeg('stf')">STF</button>
</div>

<!-- MAIN CONTENT -->
<div class="content" id="mainContent">
  <div class="loading-msg" id="loadingMsg">載入中…</div>
</div>

<!-- SAVE BAR -->
<div class="save-bar" id="saveBar" style="display:none">
  <div class="save-bar-msg" id="saveBarMsg"><span class="pending-dot"></span>有 <span id="pendingCount">0</span> 項修改待確認</div>
  <button class="btn-save-all" id="btnSaveAll" onclick="submitAllEdits()">提交審核</button>
</div>

<script>
const PATH   = window.location.pathname;           // /ie/32/detail
const HID    = parseInt(PATH.split('/')[2]) || 0;
let EOLR     = 120;
let SEG      = 'cutting';
let STAGE    = null;
let DATA     = null;                               // current API response
let EDITS    = {};                                 // {process_id: {field: value}}

// ── Bootstrap ────────────────────────────────────────────────────────────────
document.getElementById('backLink').href = '/ie/' + HID;

async function init() {
  // Load stage info first
  const sr = await fetch('/api/ie/stages/' + HID);
  const sj = await sr.json();
  if (sj.ok && sj.stages.length) {
    STAGE = sj.stages[sj.stages.length - 1];
    document.getElementById('stageBadge').textContent = STAGE.stage_name;
  }

  // Load header meta
  const mr = await fetch('/api/ie/cell/' + HID + '?segment=cutting&eolr=120');
  // Parallel: fetch model name from list API
  const lr = await fetch('/api/ie/list');
  const lj = await lr.json();
  if (lj.ok) {
    const rec = (lj.records || []).find(r => r.id === HID);
    if (rec) {
      document.getElementById('modelName').textContent = rec.model_name;
      document.getElementById('modelMeta').textContent =
        (rec.season || '') + (rec.material ? '  |  ' + rec.material.substring(0, 30) : '');
      document.title = rec.model_name + ' — IE 細表';
    }
  }

  loadSegment('cutting');
}

// ── Load segment ──────────────────────────────────────────────────────────────
async function loadSegment(seg) {
  EDITS = {};
  updateSaveBar();
  document.getElementById('loadingMsg') && (document.getElementById('mainContent').innerHTML =
    '<div class="loading-msg" id="loadingMsg">載入中…</div>');

  const url = '/api/ie/cell/' + HID + '?segment=' + seg + '&eolr=' + EOLR;
  const resp = await fetch(url);
  DATA = await resp.json();

  if (!DATA.ok) {
    document.getElementById('mainContent').innerHTML =
      '<div class="error-msg">載入失敗: ' + (DATA.error || '') + '</div>';
    return;
  }

  renderZones(DATA);
}

// ── Render ────────────────────────────────────────────────────────────────────
const SEG_COLS = {
  cutting:   ['seq','process_name','part_name','cut_per_hour','qty_per_pair','standard_time','actual_operators','machine'],
  stitching: ['seq','process_name','normal_time','allowance_pct','standard_time','actual_operators','machine'],
  assembly:  ['seq','process_name','normal_time','allowance_pct','standard_time','actual_operators','machine'],
  stf:       ['seq','process_name','standard_time','actual_operators','flag'],
};
const COL_LABELS = {
  seq:'#', process_name:'工序名稱', part_name:'部件/素材',
  cut_per_hour:'刀數/H', qty_per_pair:'量/雙',
  normal_time:'正常時間', allowance_pct:'寬放%', standard_time:'標準時間',
  actual_operators:'人數(理/實)',
  machine:'機器', flag:'備注',
};
const EDITABLE_FIELDS = new Set(['standard_time','actual_operators','cut_per_hour','normal_time']);
const FORMULA_READONLY = new Set(['theory_operators','allowance_pct']);

function renderZones(data) {
  const cols = SEG_COLS[data.segment] || SEG_COLS.stitching;
  let html = '';

  for (const z of data.zones) {
    const isSpecial = z.zone === '_summary';
    const hasFlag      = z.rows.some(r => r.flag && r.flag !== '待手工');
    const hasPending   = z.rows.some(r => r.flag === '待手工');
    const isLocked  = z.rows.every(r => r.is_locked);

    html += `<div class="zone-card">
  <div class="zone-header">
    <div class="zone-name">
      ${zoneLabel(z.zone)}
      <span class="zone-count">${z.rows.length} 道工序</span>
      ${isLocked ? '<span class="zone-locked">鎖定</span>' : ''}
      ${hasFlag    ? '<span class="zone-pending">待補</span>'  : ''}
      ${hasPending ? '<span class="zone-pending" style="background:#fff3e0;color:#e65100">待手工</span>' : ''}
    </div>
  </div>`;

    if (isSpecial) {
      // 手工總人數 summary
      html += `<div class="hand-total">
    <div class="hand-total-label">手工總人數（非裁斷機）</div>
    <div class="hand-total-val" id="handTotalVal">${fmt(data.hand_total)}</div>
  </div>`;
    } else {
      html += '<div class="zone-body"><table class="proc-table"><thead><tr>';
      for (const col of cols) {
        html += `<th class="${col==='process_name'||col==='part_name'?'left':''}">${COL_LABELS[col]||col}</th>`;
      }
      html += `<th></th></tr></thead><tbody>`;

      for (const row of z.rows) {
        html += '<tr>';
        for (const col of cols) {
          html += renderCell(row, col, data.segment, data.eolr);
        }
        // action cell
        if (!row.is_locked) {
          html += `<td style="width:24px"></td>`;
        } else {
          html += `<td></td>`;
        }
        html += '</tr>';
      }
      html += '</tbody></table></div>';
    }
    html += '</div>';
  }

  document.getElementById('mainContent').innerHTML = html;
}

function renderCell(row, col, seg, eolr) {
  const val = row[col];
  const pid = row.id;

  if (col === 'seq')          return `<td class="seq">${val ?? ''}</td>`;
  if (col === 'process_name') return `<td class="name">${esc(val ?? '')}</td>`;
  if (col === 'part_name')    return `<td class="name" style="color:#888;font-size:10px">${esc(val ?? '')}</td>`;
  if (col === 'flag') {
    if (val === '待手工') return `<td class="flag-cell" style="color:#e65100;background:#fff3e0">⚠ 待手工</td>`;
    return `<td class="flag-cell">${esc(val ?? '')}</td>`;
  }
  if (col === 'machine')      return `<td class="num" style="color:#555;font-family:sans-serif">${esc(val ?? '')}</td>`;

  if (col === 'actual_operators') {
    const theory = row.theory_operators;
    const stdtime = row.standard_time ?? '';
    const theoryStr = (theory !== null && theory !== undefined) ? fmt(theory) : '—';
    const theoryLine = `<div class="theory-line" data-stdtime="${stdtime}" data-eolr="${eolr}">理 ${theoryStr}</div>`;

    if (row.is_locked) {
      const display = val !== null && val !== undefined ? fmt(val) : '—';
      return `<td class="num locked-cell" style="min-width:90px;padding:3px 8px">${theoryLine}<div class="actual-display">${display}</div></td>`;
    }
    if (row.flag === '待手工') {
      return `<td class="flag-cell" style="color:#e65100;background:#fff3e0;min-width:90px;padding:3px 8px">${theoryLine}<div>⚠ 待手工</div></td>`;
    }
    const display = val !== null && val !== undefined ? fmt(val) : '';
    return `<td class="num editable" style="min-width:90px;padding:3px 8px" onclick="startEdit(this,${pid},'actual_operators')" title="點擊填寫實際人數">${theoryLine}<div class="actual-display">${display || '—'}</div></td>`;
  }

  if (col === 'theory_operators') {
    const cls = row.is_locked ? 'locked-cell theory' : 'formula-cell theory';
    const display = val !== null && val !== undefined ? fmt(val) : '—';
    return `<td class="${cls}" data-pid="${pid}" data-eolr="${eolr}" data-stdtime="${row.standard_time ?? ''}">${display}</td>`;
  }

  if (FORMULA_READONLY.has(col)) {
    const display = val !== null && val !== undefined ? fmt(val) : '—';
    return `<td class="num formula-cell">${display}</td>`;
  }

  if (row.is_locked) {
    const display = val !== null && val !== undefined ? fmt(val) : '—';
    return `<td class="num locked-cell">${display}</td>`;
  }

  if (EDITABLE_FIELDS.has(col)) {
    const display = val !== null && val !== undefined ? fmt(val) : '';
    return `<td class="num editable" onclick="startEdit(this, ${pid}, '${col}')" title="點擊編輯">${display}</td>`;
  }

  const display = val !== null && val !== undefined ? fmt(val) : '—';
  return `<td class="num">${display}</td>`;
}

function zoneLabel(z) {
  const map = {'_summary':'∑ 手工小計', '待分區':'[待分區]'};
  return esc(map[z] || z);
}

function fmt(v) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'number') {
    return Number.isInteger(v) ? String(v) : v.toFixed(4).replace(/\.?0+$/, '');
  }
  return String(v);
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── EOLR toggle ───────────────────────────────────────────────────────────────
function setEolr(v) {
  if (EOLR === v) return;
  EOLR = v;
  document.getElementById('eolr60').classList.toggle('active', v === 60);
  document.getElementById('eolr120').classList.toggle('active', v === 120);

  // Recalculate theory_operators in DOM without full reload
  const divisor = 3600 / v;
  document.querySelectorAll('[data-stdtime]').forEach(el => {
    const st = parseFloat(el.dataset.stdtime);
    if (!isNaN(st) && st > 0) {
      const theory = (st / divisor).toFixed(4).replace(/\.?0+$/, '');
      if (el.classList.contains('theory-line')) {
        el.textContent = '理 ' + theory;   // dual-display cell
      } else {
        el.textContent = theory;           // standalone theory column
      }
    }
  });

  // Recalculate hand total
  let handTotal = 0;
  document.querySelectorAll('[data-stdtime]').forEach(el => {
    const z = el.closest('.zone-card');
    if (z && !z.querySelector('.zone-locked')) {
      const st = parseFloat(el.dataset.stdtime);
      if (!isNaN(st)) handTotal += st / divisor;
    }
  });
  const ht = document.getElementById('handTotalVal');
  if (ht) ht.textContent = handTotal.toFixed(4).replace(/\.?0+$/, '');
}

// ── Segment switch ────────────────────────────────────────────────────────────
function switchSeg(seg) {
  SEG = seg;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.seg === seg));
  loadSegment(seg);
}

// ── Inline editing ────────────────────────────────────────────────────────────
function startEdit(td, pid, field) {
  // For actual_operators dual-display cell: extract only the actual value
  const theoryLine = td.querySelector('.theory-line');
  const actualDiv  = td.querySelector('.actual-display');
  let cur = '';
  if (actualDiv) {
    cur = actualDiv.textContent.trim();
    if (cur === '—') cur = '';
  } else {
    cur = td.textContent.trim();
  }
  const theoryHTML = theoryLine ? theoryLine.outerHTML : '';
  td.innerHTML = theoryHTML + `<input type="number" step="any" value="${cur}" onblur="commitEdit(this,${pid},'${field}')" onkeydown="editKey(event,this,${pid},'${field}')">`;
  td.querySelector('input').focus();
}

function editKey(e, inp, pid, field) {
  if (e.key === 'Enter') commitEdit(inp, pid, field);
  if (e.key === 'Escape') inp.closest('td').textContent = inp.value || '—';
}

function commitEdit(inp, pid, field) {
  const newVal = inp.value.trim();
  const td = inp.closest('td');

  if (field === 'actual_operators') {
    const theoryLine = td.querySelector('.theory-line');
    const theoryHTML = theoryLine ? theoryLine.outerHTML : '';
    td.innerHTML = theoryHTML + `<div class="actual-display">${newVal || '—'}</div>`;
  } else {
    td.textContent = newVal || '—';
  }

  if (!EDITS[pid]) EDITS[pid] = {};
  EDITS[pid][field] = newVal;
  td.style.background = '#fff3cd';

  // If editing standard_time, update theory-line divs in same row
  if (field === 'standard_time') {
    const tr = td.closest('tr');
    const divisor = 3600 / EOLR;
    const st = parseFloat(newVal);
    tr.querySelectorAll('[data-stdtime]').forEach(el => {
      el.dataset.stdtime = newVal;
      if (!isNaN(st)) {
        const theory = (st / divisor).toFixed(4).replace(/\.?0+$/, '');
        if (el.classList.contains('theory-line')) {
          el.textContent = '理 ' + theory;
        } else {
          el.textContent = theory;
        }
      }
    });
  }

  updateSaveBar();
}

// ── Save bar ──────────────────────────────────────────────────────────────────
function updateSaveBar() {
  const count = Object.values(EDITS).reduce((n, f) => n + Object.keys(f).length, 0);
  document.getElementById('saveBar').style.display = count > 0 ? 'flex' : 'none';
  const el = document.getElementById('pendingCount');
  if (el) el.textContent = count;
}

async function submitAllEdits() {
  const btn = document.getElementById('btnSaveAll');
  btn.disabled = true;
  btn.textContent = '提交中…';
  const stageId = STAGE ? STAGE.id : null;
  const user = 'demo_user';
  let ok = 0, fail = 0;

  for (const [pid, fields] of Object.entries(EDITS)) {
    for (const [field, value] of Object.entries(fields)) {
      const r = await fetch('/api/ie/cell/save', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({cell_id: parseInt(pid), stage_id: stageId, field, value, user})
      });
      const j = await r.json();
      j.ok ? ok++ : fail++;
    }
  }

  EDITS = {};
  updateSaveBar();
  btn.disabled = false;
  btn.textContent = '提交審核';
  alert(`提交完成：${ok} 項成功，${fail} 項失敗`);
}

// ── Save modal / New stage ────────────────────────────────────────────────────
function showSaveModal() {
  const editCount = Object.values(EDITS).reduce((n,f)=>n+Object.keys(f).length,0);
  if (editCount === 0) {
    alert('目前沒有修改項目');
  } else {
    if (confirm(`確認提交 ${editCount} 項修改至版本「${STAGE?.stage_name || '—'}」？`)) {
      submitAllEdits();
    }
  }
}

function newStage() {
  const name = prompt('請輸入新版本名稱 (例如: v2.0 修正版):');
  if (!name) return;
  fetch('/api/ie/stages/' + HID, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({stage_name: name})
  }).then(r => r.json()).then(j => {
    if (j.ok) {
      STAGE = {id: j.stage_id, stage_name: name};
      document.getElementById('stageBadge').textContent = name;
      alert('新版本建立: ' + name);
    }
  });
}

// ── Start ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
