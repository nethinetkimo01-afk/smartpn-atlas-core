<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IE 細表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.topbar{background:#1a2744;color:#fff;padding:9px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3);flex-wrap:wrap}
.topbar-model{font-size:14px;font-weight:700;white-space:nowrap}
.topbar-meta{font-size:11px;color:#7a9bcc;white-space:nowrap}
.eolr-badge{font-size:10px;background:#1b3a6b;color:#90caf9;border:1px solid #2a5298;border-radius:4px;padding:2px 7px;font-weight:700;white-space:nowrap}
.topbar-spacer{flex:1}
.stage-select{background:#243356;color:#b0c4de;border:1px solid #3a4f72;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;min-width:90px}
.stage-select option{background:#1a2744;color:#c8d8f0}
.toggle-group{display:flex;gap:2px;background:#0f1e38;border-radius:6px;padding:3px}
.tg-btn{background:transparent;color:#7a9bcc;border:none;border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.tg-btn.active{background:#4a6cf7;color:#fff}
.tg-btn.lang-active{background:#1d9e6b;color:#fff}
.btn-sm{background:#1d9e6b;color:#fff;border:none;border-radius:5px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.btn-sm:hover{background:#178059}
.btn-outline{background:transparent;color:#7a9bcc;border:1px solid #3a4f72;border-radius:5px;padding:5px 12px;font-size:12px;cursor:pointer}
.btn-outline:hover{background:#243356;color:#fff}
.back-link{color:#7a9bcc;text-decoration:none;font-size:11px;display:flex;align-items:center;gap:4px}
.back-link:hover{color:#fff}
.tab-bar{background:#fff;border-bottom:2px solid #e4e9f2;padding:0 18px;display:flex;overflow-x:auto;position:sticky;top:46px;z-index:90;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tab-btn{padding:9px 16px;border:none;background:transparent;font-size:12px;font-weight:600;color:#777;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .12s,border-color .12s}
.tab-btn:hover{color:#4a6cf7}.tab-btn.active{color:#4a6cf7;border-bottom-color:#4a6cf7}
.content{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.zone-card{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.08);overflow:hidden}
.zone-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#f5f7fc;border-bottom:1px solid #e4e9f2}
.zone-header.ws{background:#e3f2fd;border-bottom-color:#90caf9}
.zone-header.offline{background:#f3e5f5;border-bottom-color:#ce93d8}
.zone-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zone-name{font-size:12px;font-weight:700;color:#1a2744}
.zone-header.ws .zone-name{color:#0d47a1}
.zone-header.offline .zone-name{color:#6a1b9a}
.zone-count{font-size:10px;color:#888}
.badge{font-size:10px;border-radius:3px;padding:1px 6px;font-weight:600}
.badge-lock{background:#fff3e0;color:#e65100}
.badge-ws{background:#bbdefb;color:#0d47a1}
.badge-off{background:#e8eaf6;color:#3949ab}
.badge-pend{background:#fce4ec;color:#c62828}
.zone-actions{display:flex;align-items:center;gap:6px}
.btn-add{background:#1d9e6b;color:#fff;border:none;border-radius:4px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer}
.btn-add:hover{background:#178059}
.btn-group{background:#4a6cf7;color:#fff;border:none;border-radius:4px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer}
.btn-group:hover{background:#3a5ce7}
.zone-body{overflow-x:auto}
.proc-table{border-collapse:collapse;width:100%;font-size:11px}
.proc-table th{background:#1a2744;color:#c8d8f0;padding:5px 8px;text-align:center;font-size:10px;font-weight:600;white-space:nowrap;border:1px solid #253355}
.proc-table th.left{text-align:left}
.proc-table th.th-theory{background:#455a64;color:#cfd8dc}
.proc-table th.th-actual{background:#fff;color:#444}
.proc-table td{padding:4px 8px;border:1px solid #e8ecf4;vertical-align:middle;white-space:nowrap}
.proc-table tr:hover td{background:#f5f8ff}
.proc-table tr:hover td.formula-cell{background:#eeeeee}
.proc-table tr:hover td.locked-cell{background:#fff8e1}
.proc-table tr.add-row-inline:hover td{background:#f0fff4!important}
.proc-table td.seq{text-align:center;color:#888;font-weight:600;min-width:30px}
.proc-table td.name{text-align:left;min-width:120px;max-width:220px;white-space:normal;line-height:1.4}
.proc-table td.num{text-align:right;min-width:60px;color:#1a4a7a;font-family:Consolas,monospace}
.formula-cell{background:#f0f0f0;color:#555;text-align:right;min-width:60px;font-family:Consolas,monospace;cursor:default}
.actual-cell{background:#fff;color:#0d5e2e;text-align:right;min-width:60px;font-family:Consolas,monospace;font-weight:700}
.actual-cell.clickable{cursor:text}
.actual-cell.clickable:hover{background:#f0fff4;outline:1px dashed #1d9e6b}
.actual-cell input{width:100%;border:1px solid #1d9e6b;border-radius:3px;padding:1px 4px;font-size:11px;font-family:Consolas,monospace;text-align:right;outline:none;background:#f0fff4}
.locked-cell{background:#fff8e1;color:#795548;font-weight:600}
.del-cell{width:22px;text-align:center;padding:2px 4px;border:1px solid #e8ecf4}
.btn-del{background:transparent;border:none;color:#ccc;font-size:14px;cursor:pointer;padding:0 2px;border-radius:3px;line-height:1}
.btn-del:hover{color:#c62828;background:#fce4ec}
.group-cell{background:#e8f5e9;color:#1a6e3c;font-weight:700;text-align:right;font-family:Consolas,monospace}
.group-badge{font-size:9px;background:#c8e6c9;color:#1b5e20;border-radius:3px;padding:0 4px;margin-left:4px;font-weight:600}
.hand-total{padding:10px 14px;background:#e8f5e9;border-top:2px solid #a5d6a7;display:flex;align-items:center;gap:12px}
.hand-total-label{font-size:12px;font-weight:700;color:#1a6e3c}
.hand-total-val{font-size:18px;font-weight:700;color:#0d5e2e;font-family:Consolas,monospace}
.save-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e4e9f2;padding:10px 18px;display:flex;gap:10px;align-items:center;z-index:80;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.save-bar-msg{flex:1;font-size:12px;color:#888}
.pdot{display:inline-block;width:8px;height:8px;background:#f9a825;border-radius:50%;margin-right:4px}
.btn-save-all{background:#4a6cf7;color:#fff;border:none;border-radius:6px;padding:7px 18px;font-size:12px;font-weight:700;cursor:pointer}
.btn-save-all:hover{background:#3a5ce7}
.btn-save-all:disabled{background:#c0c8d8;cursor:not-allowed}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:10px;padding:24px;min-width:380px;max-width:520px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-title{font-size:14px;font-weight:700;color:#1a2744;margin-bottom:16px}
.modal-label{font-size:11px;color:#555;font-weight:600;margin-bottom:4px;display:block}
.modal-input{width:100%;border:1px solid #ddd;border-radius:5px;padding:6px 10px;font-size:12px;margin-bottom:12px}
.proc-check-list{border:1px solid #e4e9f2;border-radius:6px;padding:8px;max-height:220px;overflow-y:auto;margin-bottom:12px}
.proc-check-item{display:flex;align-items:flex-start;gap:8px;padding:4px 0;border-bottom:1px solid #f0f2f5;font-size:11px}
.proc-check-item:last-child{border-bottom:none}
.proc-check-item input{margin-top:2px;flex-shrink:0}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn-mcancel{background:transparent;border:1px solid #ccc;border-radius:5px;padding:6px 14px;font-size:12px;cursor:pointer}
.btn-mok{background:#4a6cf7;color:#fff;border:none;border-radius:5px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}
.loading-msg{padding:40px;text-align:center;color:#888;font-size:13px}
.error-msg{padding:20px;color:#cc2222;font-size:12px}
/* ── Cutting tab — 照 LA TRAINER OG xlsx Cutting (da thật) 結構 ─────── */
.cut-table th{background:#1a2744;color:#c8d8f0;padding:3px 5px;text-align:center;font-size:9px;font-weight:600;white-space:nowrap;border:1px solid #253355}
.cut-table th.left{text-align:left}
.th-cut-group{background:#1a3a6b;color:#90caf9;text-align:center;font-size:10px;font-weight:700}
.th-post-group{background:#2d4a1e;color:#a5d6a7;text-align:center;font-size:10px;font-weight:700}
.th-vi{background:#1b3060;color:#a8c8f0;font-size:9px;font-weight:400;font-style:italic}
.th-en{background:#192a55;color:#8ab4d8;font-size:9px;font-weight:400;font-style:italic}
.th-zh{background:#1a2744;color:#c8d8f0;font-size:9px;font-weight:600}
.th-zh.th-formula-col{background:#37474f;color:#cfd8dc}
.th-zh.th-theory-col{background:#455a64;color:#b0bec5}
.th-zh.th-actual-col{background:#fff;color:#444;font-weight:700}
.name-zh{font-size:9px;color:#aaa;margin-top:1px}
/* Inline add row */
.add-row-inline td{background:#f0fff4!important;padding:2px 3px}
.add-inp{width:100%;border:1px solid #a5d6a7;border-radius:2px;padding:1px 3px;font-size:10px;background:#fff}
.btn-inline-ok{background:#1d9e6b;color:#fff;border:none;border-radius:3px;padding:2px 7px;font-size:10px;cursor:pointer;font-weight:700}
.btn-inline-ok:hover{background:#178059}
.btn-inline-cancel{background:#e0e0e0;color:#555;border:none;border-radius:3px;padding:2px 5px;font-size:10px;cursor:pointer;margin-left:2px}
/* + trigger row */
.add-trigger-row td{background:transparent;border:none;padding:0}
.add-trigger-cell{text-align:center;padding:1px 2px!important;width:22px;min-width:22px}
.btn-add-zone{background:transparent;border:1px dashed #c8e6c9;border-radius:3px;color:#bbb;font-size:13px;font-weight:700;cursor:pointer;padding:1px 6px;line-height:1.6}
.btn-add-zone:hover{color:#1d9e6b;border-color:#1d9e6b;background:#f8fff8}
/* Custom tooltip */
#cellTip{position:fixed;background:#1a2744;color:#c8d8f0;font-size:10px;padding:2px 8px;border-radius:4px;pointer-events:none;z-index:500;display:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="cellTip"></div>

<div class="topbar">
  <a class="back-link" href="/ie">← 返回列表</a>
  <div class="topbar-model" id="modelName">載入中…</div>
  <div class="eolr-badge" id="eolrBadge">EOLR 120</div>
  <div class="topbar-meta" id="modelMeta"></div>
  <div class="topbar-spacer"></div>
  <select class="stage-select" id="stageSelect" onchange="switchStage(this.value)">
    <option value="">— 版本 —</option>
  </select>
  <div class="toggle-group">
    <button class="tg-btn" id="langZH" onclick="setLang('zh')">中</button>
    <button class="tg-btn" id="langVI"  onclick="setLang('vi')">越</button>
  </div>
  <div class="toggle-group">
    <button class="tg-btn" id="eolr60"  onclick="setEolr(60)">EOLR 60</button>
    <button class="tg-btn active" id="eolr120" onclick="setEolr(120)">EOLR 120</button>
  </div>
  <button class="btn-sm" onclick="showSaveModal()">儲存修改</button>
  <button class="btn-outline" onclick="newStage()">新建版本</button>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-seg="cutting"  onclick="switchSeg('cutting')">裁斷 Cutting</button>
  <button class="tab-btn" data-seg="stitching" onclick="switchSeg('stitching')">針車 Stitching</button>
  <button class="tab-btn" data-seg="assembly"  onclick="switchSeg('assembly')">成型 Assembly</button>
  <button class="tab-btn" data-seg="stf"       onclick="switchSeg('stf')">STF</button>
</div>

<div class="content" id="mainContent">
  <div class="loading-msg">載入中…</div>
</div>

<div class="save-bar" id="saveBar" style="display:none">
  <div class="save-bar-msg"><span class="pdot"></span>有 <span id="pendingCount">0</span> 項修改待確認</div>
  <button class="btn-save-all" id="btnSaveAll" onclick="submitAllEdits()">提交審核</button>
</div>

<!-- 分組 Modal -->
<div class="modal-overlay" id="groupModal">
  <div class="modal-box">
    <div class="modal-title" id="groupModalTitle">設定人力分組</div>
    <label class="modal-label">選擇工序（同一組共用人力）</label>
    <div class="proc-check-list" id="groupProcList"></div>
    <label class="modal-label">實際人數（此組合計）</label>
    <input class="modal-input" type="number" step="0.5" min="0.5" id="groupHeadcount" placeholder="例如: 2">
    <label class="modal-label">備注（選填）</label>
    <input class="modal-input" type="text" id="groupNote" placeholder="例如: 甲班配置">
    <div class="modal-footer">
      <button class="btn-mcancel" onclick="closeGroupModal()">取消</button>
      <button class="btn-mok" onclick="submitGroup()">儲存分組</button>
    </div>
  </div>
</div>

<!-- 新增工序 Modal（非cutting段用） -->
<div class="modal-overlay" id="addRowModal">
  <div class="modal-box">
    <div class="modal-title" id="addRowTitle">新增工序</div>
    <label class="modal-label">工序名稱 *</label>
    <input class="modal-input" type="text" id="addProcessName" placeholder="例: 車縫鞋頭">
    <label class="modal-label">部件名稱（選填）</label>
    <input class="modal-input" type="text" id="addPartName" placeholder="例: 鞋頭面料">
    <label class="modal-label">TCT 秒/雙（選填）</label>
    <input class="modal-input" type="number" step="any" min="0" id="addTCT" placeholder="例: 30">
    <div class="modal-footer">
      <button class="btn-mcancel" onclick="closeAddModal()">取消</button>
      <button class="btn-mok" onclick="submitAddRow()">新增</button>
    </div>
  </div>
</div>

<script>
const PATH = window.location.pathname;
const HID  = parseInt(PATH.split('/')[2]) || 0;
let EOLR   = 120;
let SEG    = 'cutting';
let STAGE  = null;
let DATA   = null;
let EDITS  = {};
let LANG   = localStorage.getItem('ie_lang') || 'zh';
let ZONE_ROWS = {};
let GROUP_ZONE = null;
let ADD_ZONE   = null;

const MACHINE_ZONES = new Set(['裁斷機','ATOM','Laser','EMMA','YINGHUI','移印','轉印']);
const WS = '水蜘蛛';
const OFFLINE_MAP = {
  cutting:   ['水蜘蛛'],
  stitching: ['電腦針車','水蜘蛛'],
  assembly:  ['水蜘蛛','成型UV'],
  stf:       ['水蜘蛛'],
};
const COL_LABELS = {
  seq:'#', process_name:'工序名稱', part_name:'部件/素材',
  cut_per_hour:'刀數/H', qty_per_pair:'件數/雙', layers_per_cut:'層數',
  normal_time:'正常時間', allowance_pct:'寬放%', standard_time:'標準時間',
  production_target:'生産目標',
  theory_operators:'理論人數', actual_operators:'實際人數',
};
const EDITABLE_COLS = new Set(['cut_per_hour','normal_time','qty_per_pair','layers_per_cut']);

// Cutting zones WITHOUT post-process data (ATOM/Laser/YINGHUI use normal_time formula)
const CUTTING_NO_POST = new Set(['ATOM','Laser','YINGHUI']);

function getZoneCols(seg, zone) {
  if (zone === '_summary') return null;
  if (zone === WS) return ['seq','process_name','actual_operators'];
  if (seg === 'cutting') {
    if (zone === '裁斷機') {
      return ['seq','process_name','part_name','layers_per_cut','qty_per_pair','cut_per_hour','standard_time','theory_operators','actual_operators'];
    }
    return ['seq','process_name','standard_time','actual_operators'];
  }
  if (seg === 'stitching' || seg === 'assembly') {
    return ['seq','process_name','normal_time','allowance_pct','standard_time','production_target','theory_operators','actual_operators'];
  }
  if (seg === 'stf') {
    if (zone === '水洗') return ['seq','process_name','actual_operators'];
    if (zone === '貼底') return ['seq','process_name','normal_time','standard_time','theory_operators','actual_operators'];
    return ['seq','process_name','standard_time','actual_operators']; // 打粗/照射: TCT manual
  }
  return ['seq','process_name','standard_time','theory_operators','actual_operators'];
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
applyLangUI(LANG);

async function init() {
  const [sr, lr] = await Promise.all([
    fetch('/api/ie/stages/' + HID).then(r => r.json()).catch(() => ({})),
    fetch('/api/ie/list').then(r => r.json()).catch(() => ({})),
  ]);

  if (sr.ok && sr.stages && sr.stages.length) {
    const sel = document.getElementById('stageSelect');
    sel.innerHTML = '';
    for (const st of sr.stages) {
      const opt = document.createElement('option');
      opt.value = st.id;
      opt.textContent = st.stage_name;
      sel.appendChild(opt);
      if (!STAGE) STAGE = st;
    }
    if (STAGE) sel.value = STAGE.id;
  }

  if (lr.ok) {
    const rec = (lr.records || []).find(r => r.id === HID);
    if (rec) {
      const cleanName = (rec.model_name || '').replace(/\s+Target Output.*$/i, '').trim();
      document.getElementById('modelName').textContent = cleanName;
      const parts = [];
      if (rec.season)   parts.push(rec.season);
      if (rec.material) parts.push(rec.material.substring(0, 30));
      document.getElementById('modelMeta').textContent = parts.join('  |  ');
      document.title = cleanName + ' — IE 細表';
    }
  }
  loadSegment('cutting');
}

function switchStage(stageId) {
  if (!stageId) return;
  const sel = document.getElementById('stageSelect');
  STAGE = {id: parseInt(stageId), stage_name: sel.options[sel.selectedIndex].textContent};
}

async function loadSegment(seg) {
  EDITS = {};
  updateSaveBar();
  document.getElementById('mainContent').innerHTML = '<div class="loading-msg">載入中…</div>';
  try {
    const resp = await fetch('/api/ie/cell/' + HID + '?segment=' + seg + '&eolr=' + EOLR);
    DATA = await resp.json();
  } catch(e) {
    document.getElementById('mainContent').innerHTML = '<div class="error-msg">網路錯誤</div>';
    return;
  }
  if (!DATA.ok) {
    document.getElementById('mainContent').innerHTML =
      '<div class="error-msg">載入失敗: ' + esc(DATA.error || '') + '</div>';
    return;
  }
  renderZones(DATA);
}

// ── Render dispatcher ──────────────────────────────────────────────────────────
const CUTTING_FIXED_ORDER = ['裁斷機','ATOM','EMMA','Laser','YINGHUI','移印','轉印'];

function renderZones(data) {
  ZONE_ROWS = {};
  for (const z of data.zones) {
    ZONE_ROWS[z.zone] = z.rows.map(r => ({
      id: r.id,
      name: (LANG === 'vi' && r.process_name_vi) ? r.process_name_vi : (r.process_name || ''),
    }));
  }
  let html = '';
  if (data.segment === 'cutting') {
    const zoneMap = new Map(data.zones.map(z => [z.zone, z]));
    // ①–⑦ 固定順序，無資料也渲染（空 rows）
    for (const name of CUTTING_FIXED_ORDER) {
      html += renderCuttingZoneCard(zoneMap.get(name) || { zone: name, rows: [] }, data.eolr);
    }
    // ⑧ 手工總人數行
    html += renderZoneCard(zoneMap.get('_summary') || { zone: '_summary', rows: [] }, data.segment, data.eolr);
    // ⑨ 水蜘蛛
    html += renderZoneCard(zoneMap.get(WS) || { zone: WS, rows: [] }, data.segment, data.eolr);
  } else {
    for (const z of data.zones) {
      html += renderZoneCard(z, data.segment, data.eolr);
    }
  }
  document.getElementById('mainContent').innerHTML = html;
}

// ── Cutting zone card (all zones unified: 裁斷機/ATOM/LASER/YINGHUI/EMMA/移印/轉印) ──
// ── Cutting 區帶編號 (照 LA TRAINER OG xlsx Cutting (da thật) 結構) ────
const CUTTING_ZONE_NUM = {'裁斷機':'①','ATOM':'②','EMMA':'③','Laser':'④','YINGHUI':'⑤','移印':'⑥','轉印':'⑦'};

function renderCuttingZoneCard(z, eolr) {
  const zone  = z.zone;
  const zoneJ = esc(JSON.stringify(zone));
  const num   = CUTTING_ZONE_NUM[zone] || '';
  const isAuto = CUTTING_NO_POST.has(zone);
  let h = `<div class="zone-card">
    <div class="zone-header">
      <div class="zone-left">
        <span class="zone-name">${num ? num + ' ' : ''}${esc(zone)}</span>
        <span class="zone-count">${z.rows.length} 道</span>
        ${isAuto ? '<span class="badge" style="background:#e8eaf6;color:#3949ab">自動裁</span>' : ''}
      </div>
      <div class="zone-actions">

function renderCuttingRow(row, zone, eolr) {
  const pid     = row.id;
  const divisor = 3600 / eolr;
  function dv(v) { return v != null ? fmtNum(v) : '—'; }
  function opsDisp(std) {
    if (std == null || std <= 0) return '—';
    return fmtNum(parseFloat((std / divisor).toFixed(4)));
  }
  const stdTime = row.standard_time;
  const theory  = (stdTime != null && stdTime > 0) ? stdTime / divisor : null;
  const thDisp  = theory != null ? fmtNum(parseFloat(theory.toFixed(4))) : '—';
  const viet = esc((LANG === 'vi' && row.process_name_vi) ? row.process_name_vi : (row.process_name || ''));
  const zh   = esc(row.process_name_zh || '');
  const nameCell = zh
    ? `<td class="name left" style="white-space:normal">${viet}<div class="name-zh">${zh}</div></td>`
    : `<td class="name left" style="white-space:normal">${viet}</td>`;
  let h = '<tr>';
  h += `<td class="del-cell"><button class="btn-del" onclick="deleteRow(${pid})">×</button></td>`;
  h += `<td class="num" style="background:#fff;cursor:text;font-size:9px" onclick="startTextEdit(this,${pid},'mat_cat')" data-tip="點擊編輯">${esc(row.mat_cat || '—')}</td>`;
  h += `<td class="seq">${row.seq ?? ''}</td>`;
  h += nameCell;
  h += `<td class="num" style="background:#fff;cursor:text" onclick="startEdit(this,${pid},'layers_per_cut')" data-tip="點擊編輯">${dv(row.layers_per_cut)}</td>`;
  h += `<td class="num" style="background:#fff;cursor:text" onclick="startEdit(this,${pid},'qty_per_pair')" data-tip="點擊編輯">${dv(row.qty_per_pair)}</td>`;
  h += `<td class="num" style="background:#fff;cursor:text" onclick="startEdit(this,${pid},'cut_per_hour')" data-tip="點擊編輯">${dv(row.cut_per_hour)}</td>`;
  h += `<td class="formula-cell">${stdTime != null ? fmtNum(stdTime) : '—'}</td>`;
  h += `<td class="formula-cell theory-cell" data-stdtime="${stdTime ?? ''}" data-zone="${esc(zone)}">${thDisp}</td>`;
  h += `<td class="actual-cell clickable" onclick="startEdit(this,${pid},'actual_operators')" data-tip="點擊編輯">${dv(row.actual_operators)}</td>`;
  const postCols = ['post_marking_std','post_skiving_std','post_attach_std','post_edge_std','post_heat_std'];
  for (const col of postCols) {
    const ps = row[col];
    h += `<td class="num" style="background:#fff;cursor:text" onclick="startEdit(this,${pid},'${col}')" data-tip="點擊編輯">${dv(ps)}</td>`;
    h += `<td class="formula-cell th-post-ops-cell" style="background:#e8f5e9;color:#2e7d32" data-poststd="${ps ?? ''}">${opsDisp(ps)}</td>`;
  }
  h += '</tr>';
  return h;
}

    </td>`;
  const tr = document.createElement('tr');

  if (trigger) tbody.insertBefore(tr, trigger); else tbody.appendChild(tr);

async function confirmAddCuttingRow(zone) {
  const name = document.getElementById('add-name-' + zone)?.value?.trim();
  if (!name) { alert('請輸入部件名稱'); return; }
  const payload = {header_id: HID, segment: SEG, zone, stage_id: STAGE?.id, user: 'demo', process_name: name};
  const mat = document.getElementById('add-mat-' + zone)?.value?.trim() || null;
  const lay = parseFloat(document.getElementById('add-lay-' + zone)?.value) || null;
  const qty = parseFloat(document.getElementById('add-qty-' + zone)?.value) || null;
  const cph = parseFloat(document.getElementById('add-cph-' + zone)?.value) || null;
  const std = parseFloat(document.getElementById('add-std-' + zone)?.value) || null;
  const act = parseFloat(document.getElementById('add-act-' + zone)?.value) || null;
  Object.assign(payload, {mat_cat: mat, layers_per_cut: lay, qty_per_pair: qty, cut_per_hour: cph, standard_time: std, actual_operators: act});
  const r = await fetch('/api/ie/cell/add_row', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload),
  });
  const j = await r.json();
  if (j.ok) loadSegment(SEG);
  else alert('新增失敗: ' + (j.error || ''));
}

function cancelAddCuttingRow(zone) {
  document.getElementById('tbody-cut-' + zone)?.querySelector('.add-row-inline')?.remove();
}

// ── Generic zone card (stitching / assembly / stf / WS / _summary) ─────────────
function renderZoneCard(z, seg, eolr) {
  const zone = z.zone;
  const cols = getZoneCols(seg, zone);
  const isSummary = zone === '_summary';
  const isWS      = zone === WS;
  const offlines  = OFFLINE_MAP[seg] || [];
  const isOffline = offlines.includes(zone) && !isWS;
  const isLocked  = z.rows.length > 0 && z.rows.every(r => r.is_locked);
  const hasPending = z.rows.some(r => r.flag === '待手工');

  const hdrCls = isWS ? 'zone-header ws' : isOffline ? 'zone-header offline' : 'zone-header';
  const zLabel = esc(zoneLabel(zone));
  const zoneJ  = esc(JSON.stringify(zone));

  let h = `<div class="zone-card"><div class="${hdrCls}">
    <div class="zone-left">
      <span class="zone-name">${zLabel}</span>
      <span class="zone-count">${z.rows.length} 道</span>
      ${isLocked   ? '<span class="badge badge-lock">鎖定</span>' : ''}
      ${isWS       ? '<span class="badge badge-ws">Water Spider</span>' : ''}
      ${isOffline  ? '<span class="badge badge-off">離線統計</span>' : ''}
      ${hasPending ? '<span class="badge badge-pend">待手工</span>' : ''}
    </div>
    <div class="zone-actions">`;

  if (!isSummary) {
    h += `<button class="btn-group" onclick="openGroupModal(${zoneJ})">分組</button>`;
  }
  h += `</div></div>`;

  if (isSummary) {
    const total = calcHandTotal(z);
    h += `<div class="hand-total">
      <div class="hand-total-label">∑ 手工理論人數（非裁斷機）</div>
      <div class="hand-total-val" id="handTotalVal">${fmtNum(total)}</div>
    </div>`;
  } else {
    const segJ = esc(JSON.stringify(seg));
    h += '<div class="zone-body"><table class="proc-table"><thead><tr>';
    for (const col of cols) {
      const lbl = COL_LABELS[col] || col;
      const isLeft = col === 'process_name' || col === 'part_name';
      const cls = (col === 'theory_operators' || col === 'production_target') ? 'th-theory' : col === 'actual_operators' ? 'th-actual' : isLeft ? 'left' : '';
      h += `<th${cls ? ` class="${cls}"` : ''}>${lbl}</th>`;
    }
    h += `<th style="width:22px"></th></tr></thead><tbody id="tbody-gen-${esc(zone)}">`;

    for (const row of z.rows) {
      h += '<tr>';
      for (const col of cols) h += renderCell(row, col, zone, seg, eolr);
      h += row.is_locked
        ? '<td class="del-cell"></td>'
        : `<td class="del-cell"><button class="btn-del" onclick="deleteRow(${row.id})" title="刪除">×</button></td>`;
      h += '</tr>';
    }
    h += renderAddTriggerRow(zone, seg);
    h += '</tbody></table></div>';
  }
  h += '</div>';
  return h;
}

function renderCell(row, col, zone, seg, eolr) {
  const val = row[col];
  const pid = row.id;
  const locked = row.is_locked;

  if (col === 'seq') return `<td class="seq">${val ?? ''}</td>`;

  if (col === 'process_name') {
    const isVi = LANG === 'vi' && row.process_name_vi;
    const main = esc(isVi ? row.process_name_vi : (row.process_name || ''));
    const sub  = isVi ? `<div style="font-size:9px;color:#aaa;margin-top:1px">${esc(row.process_name || '')}</div>` : '';
    return `<td class="name">${main}${sub}</td>`;
  }

  if (col === 'part_name') return `<td class="name" style="color:#888;font-size:10px">${esc(val ?? '')}</td>`;

  if (col === 'production_target') {
    let st = parseFloat(row.standard_time);
    if ((seg === 'stitching' || seg === 'assembly') && row.normal_time != null) {
      const allow = row.allowance_pct != null ? row.allowance_pct : 10;
      st = row.normal_time * (1 + allow / 100);
    }
    const pt = (!isNaN(st) && st > 0) ? fmtNum(Math.round((3600 / st) * 10) / 10) : '—';
    return `<td class="formula-cell">${pt}</td>`;
  }

  if (col === 'standard_time') {
    let computed = val;
    if (seg === 'stitching' || seg === 'assembly') {
      if (row.normal_time != null) {
        const allow = row.allowance_pct != null ? row.allowance_pct : 10;
        computed = row.normal_time * (1 + allow / 100);
      }
      const display = computed != null ? fmtNum(parseFloat(computed.toFixed(4))) : '—';
      return `<td class="formula-cell">${display}</td>`;
    }
    if (seg === 'stf') {
      if (zone === '貼底') {
        if (row.normal_time != null) computed = row.normal_time * 1.1;
        const display = computed != null ? fmtNum(parseFloat(computed.toFixed(4))) : '—';
        return `<td class="formula-cell">${display}</td>`;
      }
      // 打粗/照射: TCT manual, white, editable
      return `<td class="num" style="background:#fff;cursor:text" onclick="startEdit(this,${pid},'standard_time')" data-tip="點擊編輯">${val != null ? fmtNum(val) : '—'}</td>`;
    }
    const display = computed != null ? fmtNum(parseFloat(computed.toFixed(4))) : '—';
    return `<td class="formula-cell">${display}</td>`;
  }

  if (col === 'theory_operators') {
    let st;
    if (seg === 'stitching' || seg === 'assembly') {
      st = (row.normal_time != null)
        ? row.normal_time * (1 + (row.allowance_pct != null ? row.allowance_pct : 10) / 100)
        : parseFloat(row.standard_time);
    } else if (seg === 'stf' && zone === '貼底') {
      st = row.normal_time != null ? row.normal_time * 1.1 : parseFloat(row.standard_time);
    } else {
      st = parseFloat(row.standard_time);
    }
    const stNum = parseFloat(st);
    const th = (!isNaN(stNum) && stNum > 0) ? fmtNum(stNum / (3600 / eolr)) : '—';
    return `<td class="formula-cell theory-cell" data-pid="${pid}" data-stdtime="${stNum || ''}" data-zone="${esc(zone)}">${th}</td>`;
  }

  if (col === 'actual_operators') {
    if (row.group_info) {
      const gi = row.group_info;
      return `<td class="actual-cell group-cell">${fmtNum(gi.headcount)}<span class="group-badge">組</span></td>`;
    }
    if (locked) return `<td class="actual-cell locked-cell">${val != null ? fmtNum(val) : '—'}</td>`;
    if (row.flag === '待手工') return `<td class="actual-cell" style="background:#fff3e0;color:#e65100;text-align:center">⚠ 待手工</td>`;
    return `<td class="actual-cell clickable" onclick="startEdit(this,${pid},'actual_operators')" data-tip="點擊編輯">${val != null ? fmtNum(val) : '—'}</td>`;
  }

  if (col === 'allowance_pct') {
    const defaultAllow = (seg === 'stitching' || seg === 'assembly') ? 10 : null;
    const display = val != null ? fmtNum(val) : (defaultAllow != null ? fmtNum(defaultAllow) : '—');
    return `<td class="formula-cell">${display}</td>`;
  }

  if (EDITABLE_COLS.has(col)) {
    if (locked) return `<td class="num locked-cell">${val != null ? fmtNum(val) : '—'}</td>`;
    return `<td class="num" style="background:#fff;cursor:text" onclick="startEdit(this,${pid},'${col}')" data-tip="點擊編輯">${val != null ? fmtNum(val) : '—'}</td>`;
  }

  return `<td class="num">${val != null ? fmtNum(val) : '—'}</td>`;
}

function zoneLabel(z) {
  const m = {'_summary':'∑ 手工小計','待分區':'[待分區]','水蜘蛛':'水蜘蛛 (WS)'};
  return m[z] || z;
}

function calcHandTotal(summaryZone) {
  if (!DATA) return 0;
  const divisor = 3600 / EOLR;
  let total = 0;
  for (const z of DATA.zones) {
    if (z.zone === '_summary' || z.zone === '待分區' || MACHINE_ZONES.has(z.zone) || z.zone === WS) continue;
    for (const row of z.rows) {
      const st = parseFloat(row.standard_time);
      if (!isNaN(st) && st > 0) total += st / divisor;
    }
  }
  return total;
}

function updateTheoryAndTotal() {
  const divisor = 3600 / EOLR;
  let total = 0;
  document.querySelectorAll('.theory-cell[data-stdtime]').forEach(el => {
    const st = parseFloat(el.dataset.stdtime);
    if (!isNaN(st) && st > 0) {
      const th = st / divisor;
      el.textContent = fmtNum(th);
      const zone = el.dataset.zone;
      if (zone && !MACHINE_ZONES.has(zone) && zone !== WS && zone !== '_summary' && zone !== '待分區') {
        total += th;
      }
    } else {
      el.textContent = '—';
    }
  });
  // Update cutting post-process ops cells
  document.querySelectorAll('.th-post-ops-cell[data-poststd]').forEach(el => {
    const ps = parseFloat(el.dataset.poststd);
    el.textContent = (!isNaN(ps) && ps > 0) ? fmtNum(parseFloat((ps / divisor).toFixed(4))) : '—';
  });
  const ht = document.getElementById('handTotalVal');
  if (ht) ht.textContent = fmtNum(total);
}

  document.getElementById('addRowModal').style.display = 'none';
  ADD_ZONE = null;
}
async function submitAddRow() {
  const name = document.getElementById('addProcessName').value.trim();
  if (!name) { alert('請輸入工序名稱'); return; }
  const partName = document.getElementById('addPartName').value.trim() || null;
  const tctVal = document.getElementById('addTCT').value;
  const tct = tctVal ? parseFloat(tctVal) : null;
  const r = await fetch('/api/ie/cell/add_row', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      header_id: HID, segment: SEG, zone: ADD_ZONE,
      stage_id: STAGE?.id, user: 'demo',
      process_name: name, part_name: partName, tct,
    }),
  });
  const j = await r.json();
  if (j.ok) { closeAddModal(); loadSegment(SEG); }
  else alert('新增失敗: ' + (j.error || ''));
}

// ── Delete row ────────────────────────────────────────────────────────────────
async function deleteRow(pid) {
  if (!confirm('確認刪除此工序？')) return;
  const r = await fetch('/api/ie/cell/delete_row', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({process_id:pid, stage_id:STAGE?.id, user:'demo'}),
  });
  const j = await r.json();
  if (j.ok) loadSegment(SEG);
  else alert('刪除失敗: ' + (j.error || ''));
}

// ── Group modal ───────────────────────────────────────────────────────────────
function openGroupModal(zone) {
  GROUP_ZONE = zone;
  document.getElementById('groupModalTitle').textContent = '設定人力分組 — ' + zoneLabel(zone);
  const rows = ZONE_ROWS[zone] || [];
  const list = document.getElementById('groupProcList');
  list.innerHTML = rows.length
    ? rows.map((r,i) => `<div class="proc-check-item">
        <input type="checkbox" id="gp${i}" value="${r.id}">
        <label for="gp${i}" style="cursor:pointer">${esc(r.name || '工序 ' + r.id)}</label>
      </div>`).join('')
    : '<div style="color:#aaa;font-size:11px;padding:8px">此區暫無工序</div>';
  document.getElementById('groupHeadcount').value = '';
  document.getElementById('groupNote').value = '';
  document.getElementById('groupModal').style.display = 'flex';
}
function closeGroupModal() {
  document.getElementById('groupModal').style.display = 'none';
  GROUP_ZONE = null;
}
async function submitGroup() {
  const checked = [...document.querySelectorAll('#groupProcList input:checked')].map(cb => parseInt(cb.value));
  const headcount = parseFloat(document.getElementById('groupHeadcount').value);
  const note = document.getElementById('groupNote').value.trim();
  if (!checked.length) { alert('請選擇至少一道工序'); return; }
  if (isNaN(headcount) || headcount <= 0) { alert('請填寫正確人數'); return; }
  const r = await fetch('/api/ie/cell/save_group', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({header_id:HID, segment:SEG, zone:GROUP_ZONE,
      stage_id:STAGE?.id, process_ids:checked, headcount, note}),
  });
  const j = await r.json();
  if (j.ok) { closeGroupModal(); loadSegment(SEG); }
  else alert('分組失敗: ' + (j.error || ''));
}

// ── Inline editing ────────────────────────────────────────────────────────────
function startEdit(td, pid, field) {
  const cur = td.textContent.trim();
  td.innerHTML = `<input type="number" step="any" value="${esc(cur === '—' ? '' : cur)}"
    onblur="commitEdit(this,${pid},'${field}')"
    onkeydown="editKey(event,this,${pid},'${field}')">`;
  td.querySelector('input').focus();
}
function startTextEdit(td, pid, field) {
  const cur = td.textContent.trim();
  td.innerHTML = `<input type="text" value="${esc(cur === '—' ? '' : cur)}"
    style="width:100%;border:1px solid #4a6cf7;border-radius:2px;padding:1px 3px;font-size:11px"
    onblur="commitEdit(this,${pid},'${field}')"
    onkeydown="editKey(event,this,${pid},'${field}')">`;
  td.querySelector('input').focus();
}
function editKey(e, inp, pid, field) {
  if (e.key === 'Enter')  commitEdit(inp, pid, field);
  if (e.key === 'Escape') { inp.closest('td').textContent = inp.value || '—'; }
}
function commitEdit(inp, pid, field) {
  const newVal = inp.value.trim();
  const td = inp.closest('td');
  td.textContent = newVal || '—';
  if (!EDITS[pid]) EDITS[pid] = {};
  EDITS[pid][field] = newVal;
  td.style.outline = '2px solid #f9a825';
  updateSaveBar();
}

// ── Save bar ──────────────────────────────────────────────────────────────────
function updateSaveBar() {
  const count = Object.values(EDITS).reduce((n, f) => n + Object.keys(f).length, 0);
  document.getElementById('saveBar').style.display = count > 0 ? 'flex' : 'none';
  const el = document.getElementById('pendingCount');
  if (el) el.textContent = count;
}
async function submitAllEdits() {
  const btn = document.getElementById('btnSaveAll');
  btn.disabled = true; btn.textContent = '提交中…';
  const stageId = STAGE ? STAGE.id : null;
  let ok = 0, fail = 0;
  for (const [pid, fields] of Object.entries(EDITS)) {
    for (const [field, value] of Object.entries(fields)) {
      const r = await fetch('/api/ie/cell/save', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({cell_id:parseInt(pid), stage_id:stageId, field, value, user:'demo_user'}),
      });
      const j = await r.json();
      j.ok ? ok++ : fail++;
    }
  }
  EDITS = {}; updateSaveBar();
  btn.disabled = false; btn.textContent = '提交審核';
  alert(`提交完成：${ok} 項成功，${fail} 項失敗`);
}
function showSaveModal() {
  const count = Object.values(EDITS).reduce((n,f) => n + Object.keys(f).length, 0);
  if (count === 0) { alert('目前沒有修改項目'); return; }
  if (confirm(`確認提交 ${count} 項修改至版本「${STAGE?.stage_name || '—'}」？`)) submitAllEdits();
}
function newStage() {
  const name = prompt('請輸入新版本名稱:');
  if (!name) return;
  fetch('/api/ie/stages/' + HID, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({stage_name:name}),
  }).then(r=>r.json()).then(j => {
    if (j.ok) {
      STAGE = {id:j.stage_id, stage_name:name};
      const sel = document.getElementById('stageSelect');
      const opt = document.createElement('option');
      opt.value = j.stage_id;
      opt.textContent = name;
      sel.appendChild(opt);
      sel.value = j.stage_id;
    } else alert('建立失敗');
  });
}

// ── + trigger row ─────────────────────────────────────────────────────────────
function renderAddTriggerRow(zone, seg) {
  const zJ   = esc(JSON.stringify(zone));
  const segJ = esc(JSON.stringify(seg));
  const fn   = (seg === 'cutting' && zone !== WS) ? `addCuttingRow(${zJ})` : `addRowInline(${zJ},${segJ})`;
  return `<tr class="add-trigger-row"><td class="add-trigger-cell"><button class="btn-add-zone" onclick="${fn}">＋</button></td><td colspan="100"></td></tr>`;
}

// ── Inline add for non-cutting zones ─────────────────────────────────────────
function addRowInline(zone, seg) {
  const tbodyId = 'tbody-gen-' + zone;
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  if (tbody.querySelector('.add-row-inline')) { tbody.querySelector('.add-row-inline input')?.focus(); return; }
  const cols = getZoneCols(seg, zone);
  if (!cols) return;
  const zJ   = esc(JSON.stringify(zone));
  const segJ = esc(JSON.stringify(seg));
  let cells = '';
  for (const col of cols) {
    if (col === 'seq') {
      cells += `<td style="text-align:center;color:#aaa">—</td>`;
    } else if (col === 'process_name') {
      cells += `<td><input class="add-inp" id="add-gen-pname-${esc(zone)}" placeholder="工序名稱" style="min-width:110px"></td>`;
    } else if (col === 'normal_time') {
      cells += `<td><input class="add-inp add-num" id="add-gen-nt-${esc(zone)}" type="number" placeholder="正常時間" style="min-width:55px"></td>`;
    } else if (col === 'allowance_pct') {
      cells += `<td><input class="add-inp add-num" id="add-gen-ap-${esc(zone)}" type="number" value="10" placeholder="10" style="min-width:35px"></td>`;
    } else if (col === 'standard_time') {
      const isFormula = (seg === 'stitching' || seg === 'assembly') || (seg === 'stf' && zone === '貼底');
      cells += isFormula
        ? `<td class="formula-cell" style="font-size:9px;color:#aaa">公式</td>`
        : `<td><input class="add-inp add-num" id="add-gen-std-${esc(zone)}" type="number" placeholder="TCT" style="min-width:55px"></td>`;
    } else if (col === 'production_target' || col === 'theory_operators') {
      cells += `<td class="formula-cell" style="font-size:9px;color:#aaa">公式</td>`;
    } else if (col === 'actual_operators') {
      cells += `<td><input class="add-inp add-num" id="add-gen-act-${esc(zone)}" type="number" placeholder="人數" style="min-width:40px"></td>`;
    } else {
      cells += `<td></td>`;
    }
  }
  cells += `<td style="white-space:nowrap;border:1px solid #c8e6c9">
    <button class="btn-inline-ok" onclick="confirmAddRowInline(${zJ},${segJ})">✓</button>
    <button class="btn-inline-cancel" onclick="cancelAddRowInline(${zJ})">✗</button>
  </td>`;
  const tr = document.createElement('tr');
  tr.className = 'add-row-inline';
  tr.innerHTML = cells;
  const trigger = tbody.querySelector('.add-trigger-row');
  if (trigger) tbody.insertBefore(tr, trigger); else tbody.appendChild(tr);
  tr.addEventListener('keydown', e => {
    if (e.key === 'Enter')  confirmAddRowInline(zone, seg);
    if (e.key === 'Escape') cancelAddRowInline(zone);
  });
  document.getElementById('add-gen-pname-' + zone)?.focus();
}

async function confirmAddRowInline(zone, seg) {
  const name = document.getElementById('add-gen-pname-' + zone)?.value?.trim();
  if (!name) { alert('請輸入工序名稱'); return; }
  const payload = {header_id:HID, segment:seg, zone, stage_id:STAGE?.id, user:'demo', process_name:name};
  const nt  = parseFloat(document.getElementById('add-gen-nt-'  + zone)?.value) || null;
  const ap  = parseFloat(document.getElementById('add-gen-ap-'  + zone)?.value) || null;
  const std = parseFloat(document.getElementById('add-gen-std-' + zone)?.value) || null;
  const act = parseFloat(document.getElementById('add-gen-act-' + zone)?.value) || null;
  if (nt  != null) payload.normal_time = nt;
  if (ap  != null) payload.allowance_pct = ap;
  if (std != null) payload.standard_time = std;
  if (act != null) payload.actual_operators = act;
  const r = await fetch('/api/ie/cell/add_row', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload),
  });
  const j = await r.json();
  if (j.ok) loadSegment(seg);
  else alert('新增失敗: ' + (j.error || ''));
}

function cancelAddRowInline(zone) {
  const tbody = document.getElementById('tbody-gen-' + zone);
  if (tbody) tbody.querySelector('.add-row-inline')?.remove();
}

// ── Custom tooltip ────────────────────────────────────────────────────────────
(function(){
  const TIP = document.getElementById('cellTip');
  document.addEventListener('mouseover', e => {
    const cell = e.target.closest('[data-tip]');
    if (!cell) { TIP.style.display = 'none'; return; }
    TIP.textContent = cell.dataset.tip;
    TIP.style.display = 'block';
    const r = cell.getBoundingClientRect();
    TIP.style.left = Math.max(0, r.left + r.width / 2 - TIP.offsetWidth / 2) + 'px';
    TIP.style.top  = (r.top - TIP.offsetHeight - 5) + 'px';
  });
  document.addEventListener('mouseout', e => {
    if (!e.relatedTarget?.closest('[data-tip]')) TIP.style.display = 'none';
  });
})();

// ── Utils ─────────────────────────────────────────────────────────────────────
function fmtNum(v) {
  if (v == null) return '—';
  if (typeof v === 'number') return Number.isInteger(v) ? String(v) : parseFloat(v.toFixed(1)).toString();
  const n = parseFloat(v);
  return isNaN(n) ? String(v) : (Number.isInteger(n) ? String(n) : parseFloat(n.toFixed(1)).toString());
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
